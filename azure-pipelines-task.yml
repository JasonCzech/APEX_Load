parameters:
  - name: script
    type: string
  - name: vusers
    type: string
    default: '10'
  - name: duration
    type: string
    default: '1m'
  - name: rampUp
    type: string
    default: '0s'
  - name: apiUrl
    type: string
    default: ''
  - name: baseUrl
    type: string
    default: ''
  - name: envOverrides
    type: object
    default: []
  - name: p95LatencyMs
    type: string
    default: ''
  - name: maxErrorPct
    type: string
    default: ''
  - name: maxAvgServerProcessingMs
    type: string
    default: ''
  - name: maxAvgTransferMs
    type: string
    default: ''
  - name: maxErrorCount
    type: string
    default: ''

steps:
  - task: GoTool@0
    displayName: Use Go 1.26
    inputs:
      version: '1.26'

  - bash: |
      set -euo pipefail

      cmd=(go run ./cmd/apexctl run \
        --script '${{ parameters.script }}' \
        --vusers '${{ parameters.vusers }}' \
        --duration '${{ parameters.duration }}' \
        --ramp-up '${{ parameters.rampUp }}' \
        --format json)

      if [[ -n '${{ parameters.apiUrl }}' ]]; then
        cmd+=(--api '${{ parameters.apiUrl }}')
      fi
      if [[ -n '${{ parameters.baseUrl }}' ]]; then
        cmd+=(--base-url '${{ parameters.baseUrl }}')
      fi
      if [[ -n '${{ parameters.p95LatencyMs }}' ]]; then
        cmd+=(--p95-latency-ms '${{ parameters.p95LatencyMs }}')
      fi
      if [[ -n '${{ parameters.maxErrorPct }}' ]]; then
        cmd+=(--max-error-pct '${{ parameters.maxErrorPct }}')
      fi
      if [[ -n '${{ parameters.maxAvgServerProcessingMs }}' ]]; then
        cmd+=(--max-avg-server-processing-ms '${{ parameters.maxAvgServerProcessingMs }}')
      fi
      if [[ -n '${{ parameters.maxAvgTransferMs }}' ]]; then
        cmd+=(--max-avg-transfer-ms '${{ parameters.maxAvgTransferMs }}')
      fi
      if [[ -n '${{ parameters.maxErrorCount }}' ]]; then
        cmd+=(--max-error-count '${{ parameters.maxErrorCount }}')
      fi

      env_json='${{ convertToJson(parameters.envOverrides) }}'
      while IFS= read -r entry; do
        [[ -z "$entry" ]] && continue
        cmd+=(--env "$entry")
      done < <(python3 -c 'import json,sys; [print(item) for item in json.loads(sys.argv[1])] if sys.argv[1] else None' "$env_json")

      result="$(${cmd[@]})"
      echo "$result"
      echo "##vso[task.setvariable variable=apexload.resultJson;isOutput=true]$result"
    displayName: Run APEX Load SLA gate
    name: apexload