syntax = "proto3";

package apexload.v1;

option go_package = "github.com/jasonczech/apexload/api/proto";

// GeneratorControl is the gRPC service between the controller and generator pods.
// Phase 1 uses direct in-process execution; this proto is defined for Phase 2 distribution.
service GeneratorControl {
  // AssignWork sends a test script and VUser allocation to a generator.
  rpc AssignWork(WorkAssignment) returns (AssignmentAck);

  // AdjustVUsers changes the VUser count for a running test on this generator.
  rpc AdjustVUsers(VUserAdjustment) returns (AdjustmentAck);

  // AdjustDuration changes the duration for a running test on this generator.
  rpc AdjustDuration(DurationAdjustment) returns (DurationAck);

  // StopTest requests graceful shutdown of a test on this generator.
  rpc StopTest(StopRequest) returns (StopAck);

  // StreamMetrics is a bidirectional stream: controller sends control signals
  // and the generator streams metrics batches back.
  rpc StreamMetrics(stream ControlSignal) returns (stream MetricsBatch);

  // Heartbeat is a bidirectional keepalive stream.
  rpc Heartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);

  // DistributeScript sends a compiled script to a generator for caching.
  rpc DistributeScript(ScriptPayload) returns (ScriptAck);

  // GetArchiveArtifact returns a generated archive artifact for a completed test.
  rpc GetArchiveArtifact(ArchiveArtifactRequest) returns (ArchiveArtifact);
}

message WorkAssignment {
  string test_id = 1;
  string group_name = 8;
  int64 target_duration_seconds = 9;
  string script_id = 2;
  bytes script_content = 3;
  int32 vuser_count = 4;
  int32 ramp_up_seconds = 5;
  map<string, string> environment = 6;
  repeated DataFile data_files = 7;
}

message DataFile {
  string name = 1;
  bytes content = 2;
}

message AssignmentAck {
  bool accepted = 1;
  string error_message = 2;
  int32 available_capacity = 3;
}

message VUserAdjustment {
  string test_id = 1;
  string group_name = 4;
  int32 target_vusers = 2;
  int32 ramp_seconds = 3;
}

message AdjustmentAck {
  bool accepted = 1;
  int32 current_vusers = 2;
}

message DurationAdjustment {
  string test_id = 1;
  int64 target_duration_seconds = 2;
}

message DurationAck {
  bool accepted = 1;
  int64 current_duration_seconds = 2;
}

message StopRequest {
  string test_id = 1;
  bool graceful = 2;
}

message StopAck {
  bool acknowledged = 1;
  int32 pending_vusers = 2;
}

message MetricsBatch {
  string test_id = 1;
  string generator_id = 2;
  int64 timestamp_unix_ms = 3;
  repeated TransactionMetric transactions = 4;
  GeneratorStats stats = 5;
  repeated GroupMetric groups = 6;
  string lifecycle_state = 7;
  string lifecycle_error = 8;
  MetricsBatchTelemetry telemetry = 9;
}

message MetricsBatchTelemetry {
  int64 dropped_results = 1;
  int64 collected_at_unix_ms = 2;
  int64 published_at_unix_ms = 3;
  double sample_age_ms = 4;
}

message GroupMetric {
  string name = 1;
  int32 active_vusers = 2;
}

message ServerTelemetry {
  double server_processing_ms = 1;
  double transfer_ms = 2;
  double request_payload_kb = 3;
  double response_payload_kb = 4;
  bool connection_reused = 5;
  string request_size_class = 6;
  string response_size_class = 7;
  double consumer_lag_ms = 8;
  double message_latency_ms = 9;
  int32 messages_sent = 10;
  int32 messages_received = 11;
  double messages_sent_per_sec = 12;
  double messages_received_per_sec = 13;
}

message TransactionMetric {
  string name = 1;
  int64 start_time_unix_ms = 2;
  double duration_ms = 3;
  double dns_ms = 4;
  double connect_ms = 5;
  double tls_ms = 6;
  double ttfb_ms = 7;
  int64 bytes_sent = 8;
  int64 bytes_received = 9;
  int32 status_code = 10;
  bool success = 11;
  string error_message = 12;
  string correlation_id = 13;
  string dependency_type = 14;
  string dependency_target = 15;
  ServerTelemetry server_telemetry = 16;
  string soap_operation = 17;
}

message GeneratorStats {
  int32 active_vusers = 1;
  double cpu_percent = 2;
  int64 memory_bytes = 3;
  int32 goroutine_count = 4;
}

message ControlSignal {
  oneof signal {
    VUserAdjustment adjust = 1;
    StopRequest stop = 2;
    PauseRequest pause = 3;
  }
}

message PauseRequest {
  string test_id = 1;
  bool pause = 2;
}

message HeartbeatPing {
  string generator_id = 1;
  int64 timestamp_unix_ms = 2;
  GeneratorStats stats = 3;
}

message HeartbeatPong {
  string generator_id = 3;
  int64 timestamp_unix_ms = 1;
  repeated string active_test_ids = 2;
  GeneratorStats stats = 4;
  int32 available_capacity = 5;
  double cpu_limit_cores = 6;
  int64 memory_limit_bytes = 7;
  int32 max_vusers = 8;
  string version = 9;
  repeated string supported_protocols = 10;
  repeated string compatible_features = 11;
}

message ScriptPayload {
  string script_id = 1;
  bytes content = 2;
  string content_hash = 3;
}

message ScriptAck {
  bool cached = 1;
  string content_hash = 2;
}

message ArchiveArtifactRequest {
  string test_id = 1;
  string name = 2;
}

message ArchiveArtifact {
  string name = 1;
  bytes content = 2;
}
