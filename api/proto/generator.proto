syntax = "proto3";

package apexload.v1;

option go_package = "github.com/jasonczech/apexload/api/proto";

import "google/protobuf/duration.proto";

// GeneratorControl is the gRPC service between the controller and generator pods.
// Phase 1 uses direct in-process execution; this proto is defined for Phase 2 distribution.
service GeneratorControl {
  // ReservePodCapacity holds a test's peak envelope before any work is staged.
  rpc ReservePodCapacity(PodCapacityClaim) returns (PodCapacityAck);
  // ClaimExecutionEpoch establishes or renews the controller execution term on
  // this generator. A higher generation fences all lower-generation work.
  rpc ClaimExecutionEpoch(ExecutionEpochClaim) returns (ExecutionEpochAck);

  // ClaimRunSupervision establishes or renews the controller-owned deadman
  // lease for one staged or active test. No other RPC renews this lease.
  rpc ClaimRunSupervision(RunSupervisionClaim) returns (RunSupervisionAck);

  // AssignWork sends a test script and VUser allocation to a generator.
  rpc AssignWork(WorkAssignment) returns (AssignmentAck);

  // CommitWork releases every successfully staged shard for one test on this
  // generator. AssignWork performs admission/parsing/reservation only, so no
  // protocol traffic can start before the controller finishes staging the
  // complete fleet fan-out.
  rpc CommitWork(WorkCommitRequest) returns (WorkCommitAck);

  // AdjustVUsers changes the VUser count for a running test on this generator.
  rpc AdjustVUsers(VUserAdjustment) returns (AdjustmentAck);

  // AdjustDuration changes the duration for a running test on this generator.
  rpc AdjustDuration(DurationAdjustment) returns (DurationAck);

  // SetPaused applies an idempotent, execution-fenced pause transition and
  // returns only after the generator engine has applied the requested state.
  rpc SetPaused(PauseRequest) returns (PauseAck);

  // StopTest requests graceful shutdown of a test on this generator.
  rpc StopTest(StopRequest) returns (StopAck);

  // StreamMetrics is a bidirectional stream: controller sends control signals
  // and the generator streams metrics batches back.
  rpc StreamMetrics(stream ControlSignal) returns (stream MetricsBatch);

  // Heartbeat is a bidirectional keepalive stream.
  rpc Heartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);

  // DistributeScript sends a compiled script to a generator for caching.
  rpc DistributeScript(ScriptPayload) returns (ScriptAck);

  // GetArchiveArtifact returns a generated archive artifact for a completed test.
  // Deprecated for controller transfers: large artifacts should use
  // StreamArchiveArtifact so they are not buffered into one protobuf message.
  rpc GetArchiveArtifact(ArchiveArtifactRequest) returns (ArchiveArtifact);

  // StreamArchiveArtifact returns an archive artifact in bounded chunks. The
  // first chunk declares total_size and every chunk carries its absolute offset
  // so the controller can reject truncated, duplicated, or reordered streams.
  rpc StreamArchiveArtifact(ArchiveArtifactRequest) returns (stream ArchiveArtifactChunk);
}

message CapacityVector {
  double cpu_cores = 1;
  double memory_mb = 2;
  double network_mbps = 3;
  double vusers = 4;
  map<string, double> protocols = 5;
}

message PodCapacityClaim {
  string test_id = 1;
  uint64 execution_generation = 2;
  string incarnation = 3;
  string model_version = 4;
  CapacityVector schedulable = 5;
  CapacityVector demand = 6;
  double headroom_pct = 7;
  bool dedicated = 8;
  map<string, int32> group_peaks = 9;
  bool release = 10;
  uint64 revision = 11;
  string reservation_id = 12;
}

message PodCapacitySnapshot {
  string incarnation = 1;
  CapacityVector schedulable = 2;
  CapacityVector reserved = 3;
  double headroom_pct = 4;
  bool dedicated = 5;
  string state = 6;
  repeated string reserved_test_ids = 7;
}

message PodCapacityAck {
  bool accepted = 1;
  string error_message = 2;
  PodCapacitySnapshot snapshot = 3;
}

// Complete immutable source-engine membership. Every assignment carries the same manifest.
message SourcePlanManifest {
  uint32 version = 1;
  string project_id = 2;
  string source_plan_id = 3;
  uint64 execution_generation = 4;
  repeated SourcePlanGroup groups = 5;
  repeated string required_features = 6;
  string compatibility_profile = 7;
}
message SourcePlanGroup {
  string group_name = 1;
  string source_group_id = 2;
  string script_hash = 3;
  int32 vusers = 4;
}

message WorkAssignment {
  string test_id = 1;
  string group_name = 8;
  int64 target_duration_seconds = 9;
  string script_id = 2;
  bytes script_content = 3;
  int32 vuser_count = 4;
  int32 ramp_up_seconds = 5;
  map<string, string> environment = 6;
  repeated DataFile data_files = 7;
  repeated RedactionRule redaction_rules = 10;
  uint64 execution_generation = 11;
  string expected_script_hash = 12;
  // Precise fields supersede the legacy whole-second fields above. Senders
  // populate both during rolling upgrades; receivers prefer these fields.
  google.protobuf.Duration target_duration = 13;
  google.protobuf.Duration ramp_up = 14;
  google.protobuf.Duration ramp_down = 15;
  string init_strategy = 16;
  google.protobuf.Duration pre_baseline = 17;
  google.protobuf.Duration post_baseline = 18;
  // Stable logical-shard identity. shard_ordinal is zero-based and must be
  // smaller than shard_count. vuser_id_offset maps local VUser IDs into the
  // one logical run so unique data rows do not restart on each generator.
  uint32 shard_ordinal = 19;
  uint32 shard_count = 20;
  uint64 vuser_id_offset = 21;
  // start_paused keeps a newly provisioned evacuation target behind the
  // execution gate when the logical run is already paused. A replacement
  // generator has no prior local assignment from which to infer this state.
  bool start_paused = 22;
  // duration_offset is active steady-test time completed before this shard was
  // staged. It lets a fresh evacuation target translate later whole-run
  // duration controls into its replacement-local deadline.
  google.protobuf.Duration duration_offset = 23;
  // secret_bundle contains only the logical secrets referenced by this
  // assignment's script. Controllers send it exclusively to generators that
  // advertise secret_bundle_v1 over authenticated TLS. Generators keep it only
  // in memory for the lifetime of the staged/running assignment.
  map<string, string> secret_bundle = 24;
  // secret_bundle_id is opaque, non-secret retry identity generated by the
  // controller and tracked separately from assignment fingerprints.
  string secret_bundle_id = 25;
  // scenario_id is the stable managed scenario identity exposed to protocol
  // runtimes. It is distinct from the generated script artifact ID.
  string scenario_id = 26;
  // require_test_execution_lease makes CommitWork fail closed unless this
  // assignment has a live, explicitly acknowledged run-scoped lease.
  bool require_test_execution_lease = 27;
  // Opaque, controller-generated run-incarnation capability. Current
  // execution-enabled generators require exactly 32 non-zero bytes.
  bytes run_supervision_token = 28;
  // Controller-approved load-zone label. Generators attach this value to
  // results; script data is never accepted as a regional analytics label.
  string region = 29;
  // Active-test delay from the shared load epoch before this group may emit
  // user traffic. Pause time never consumes this duration.
  google.protobuf.Duration start_offset = 30;
  // Assignment-local success-detail quotas. The controller partitions the
  // authored run budget across logical shards; zero preserves script limits.
  int32 message_detail_max_items = 31;
  int64 message_detail_max_item_bytes = 32;
  int64 message_detail_max_total_bytes = 33;
  double transaction_response_time_sla_ms = 34;
  // Frozen dense logical data-allocation coordinates; independent of sparse VUser IDs.
  uint32 parameter_population = 35;
  uint32 parameter_offset = 36;
  // Explicit fixed-population iteration completion; omission retains duration mode.
  string termination_mode = 37;
  SourcePlanManifest source_plan = 38;
  // adoption_grace opts this run into HA run continuity. When the controller
  // epoch lapses, a committed supervised assignment keeps running for up to
  // this long (capped by the generator) waiting for a successor controller to
  // adopt it through ExecutionEpochClaim.adoptions, then stops with
  // controller_adoption_timeout. Zero (the default) keeps fail-fast behaviour.
  google.protobuf.Duration adoption_grace = 39;
  // Original controller target namespace for identity-bound archive collection.
  // Omission preserves legacy collection; groups on one generator must agree.
  string archive_source_target = 40;
  // Explicit negotiated dedicated execution-pod placement. Omission preserves
  // the local dedicated path; send only to java_host_broker_v1 peers.
  JavaHostSelection java_host = 41;
  // Defer runtime preflight and all target interaction until CommitWork.
  bool prepare_only = 42;
}

// Operator approval binds immutable source and the complete placement profile.
message JavaHostSelection {
  string contract = 1;
  string script_sha256 = 2;
  string profile_id = 3;
  string configuration_sha256 = 4;
  string policy_sha256 = 5;
  int64 preparation_ms = 6;
  int64 run_lifetime_ms = 7;
  string facade_resources_sha256 = 8;
  // Requires java_host_prepared_population_v1. Zero uses the initial count.
  // Nonzero reserves lifetime admissions; closed sessions are never reused.
  int32 prepared_vusers = 9;
}
message JavaHostProfile {
  string script_sha256 = 1;
  string profile_id = 2;
  string configuration_sha256 = 3;
  string policy_sha256 = 4;
  int64 memory_bytes = 5;
  int64 preparation_ms = 6;
  int64 max_run_ms = 7;
  int64 invocation_ms = 8;
  // Optional operator budget for generator/facade overhead per dedicated Vuser.
  // Execution pod/JVM memory remains in memory_bytes above.
  int64 facade_cpu_millicores = 9;
  int64 facade_memory_bytes = 10;
  int64 facade_network_kbps = 11;
  string facade_resources_sha256 = 12;
}
message JavaHostCapabilities {
  string contract = 1;
  string mode = 2;
  string containment = 3;
  int32 max_hosts = 4;
  int32 max_vusers = 5;
  int64 max_memory_bytes = 6;
  repeated JavaHostProfile profiles = 7;
}

message WorkCommitRequest {
  string source_plan_digest = 5;
  string test_id = 1;
  uint64 execution_generation = 2;
  // Common controller-selected release barrier for every generator in the
  // fleet. A generator rejects a new commit received after this instant rather
  // than starting late and skewing the distributed ramp.
  int64 start_at_unix_nano = 3;
  bytes run_supervision_token = 4;
}

message WorkCommitAck {
  bool accepted = 1;
  string error_message = 2;
  bool run_supervision_armed = 3;
  int64 run_supervision_ttl_milliseconds = 4;
}

enum RunSupervisionState {
  RUN_SUPERVISION_STATE_UNSPECIFIED = 0;
  RUN_SUPERVISION_STATE_STAGED = 1;
  RUN_SUPERVISION_STATE_ACTIVE = 2;
  RUN_SUPERVISION_STATE_STOPPING = 3;
  RUN_SUPERVISION_STATE_FENCED = 4;
}

message RunSupervisionClaim {
  string test_id = 1;
  uint64 execution_generation = 2;
  bytes run_supervision_token = 3;
  int64 requested_ttl_milliseconds = 4;
  string execution_lease_owner_id = 5;
}

message RunSupervisionAck {
  bool accepted = 1;
  uint32 contract_version = 2;
  uint64 current_generation = 3;
  int64 granted_ttl_milliseconds = 4;
  int64 expires_at_unix_ms = 5;
  RunSupervisionState state = 6;
  string error_message = 7;
}

message ExecutionEpochClaim {
  uint64 execution_generation = 1;
  int64 lease_ttl_milliseconds = 2;
  // execution_lease_owner_id is the controller scheduler lease's exact,
  // acquisition-scoped owner token. Together with execution_generation it
  // identifies one durable controller term and lets a replacement generator
  // safely revalidate that same live term without admitting a different owner.
  string execution_lease_owner_id = 3;
  // test_id requests a run-scoped assignment lease instead of renewing the
  // process-wide controller epoch. Controllers use this lease to fence one
  // lost assignment without interrupting unrelated tests on the generator.
  string test_id = 4;
  // adoptions carries runs a successor controller takes over as part of this
  // higher-generation claim. They must travel inside the claim: a higher
  // generation fences every lower-generation assignment it does not adopt.
  repeated RunAdoption adoptions = 5;
}

// RunAdoption proves lineage of one run to the generator: the prior
// generation and supervision token must match the assignment exactly. The new
// token replaces the old one for every later mutation and supervision claim.
message RunAdoption {
  string test_id = 1;
  uint64 prior_generation = 2;
  bytes prior_run_supervision_token = 3;
  bytes new_run_supervision_token = 4;
  // Additional exact lineage proofs from durable, interrupted controller
  // rotations. Including the primary proof, at most four are accepted.
  repeated RunAdoptionProof prior_proofs = 5;
}

enum RunAdoptionOutcome {
  RUN_ADOPTION_OUTCOME_UNSPECIFIED = 0;
  RUN_ADOPTION_OUTCOME_ADOPTED = 1;
  // The run finished (COMPLETE) before adoption; its archive is retained.
  RUN_ADOPTION_OUTCOME_ALREADY_COMPLETED = 2;
  // The run already stopped or failed (for example its grace expired).
  RUN_ADOPTION_OUTCOME_ALREADY_STOPPED = 3;
  RUN_ADOPTION_OUTCOME_REJECTED = 4;
  RUN_ADOPTION_OUTCOME_UNKNOWN_TEST = 5;
}

message RunAdoptionResult {
  string test_id = 1;
  RunAdoptionOutcome outcome = 2;
  string detail = 3;
  // Terminal lifecycle state reported for ALREADY_COMPLETED/ALREADY_STOPPED.
  string terminal_state = 4;
}

message ExecutionEpochAck {
  bool accepted = 1;
  uint64 current_generation = 2;
  int64 expires_at_unix_ms = 3;
  string error_message = 4;
  // Explicit capability acknowledgement. Older generators ignore test_id and
  // leave this false, so a newer controller cannot mistake a process-epoch
  // renewal for a run-scoped fence.
  bool test_lease_accepted = 5;
  // adoption_supported is true on generators that understand adoptions; an
  // older generator leaves it false and fences every lower-generation run.
  bool adoption_supported = 6;
  repeated RunAdoptionResult adoptions = 7;
}

message RedactionRule {
  string name = 1;
  string pattern = 2;
  string replacement = 3;
}

message DataFile {
  string name = 1;
  bytes content = 2;
  string sha256 = 3;
}

message JavaHostPlacement {
  JavaHostSelection selection = 1;
  string reservation_id = 2;
  string mode = 3;
  string containment = 4;
  int32 max_hosts = 5;
  int32 max_vusers = 6;
}
message AssignmentAck {
  bool accepted = 1;
  string error_message = 2;
  int32 available_capacity = 3;
  JavaHostPlacement java_host = 4;
}

message VUserAdjustment {
  string test_id = 1;
  string group_name = 4;
  int32 target_vusers = 2;
  int32 ramp_seconds = 3;
  uint64 execution_generation = 5;
  google.protobuf.Duration ramp_duration = 6;
  bytes run_supervision_token = 7;
}

message AdjustmentAck {
  bool accepted = 1;
  int32 current_vusers = 2;
}

message DurationAdjustment {
  string test_id = 1;
  int64 target_duration_seconds = 2;
  uint64 execution_generation = 3;
  google.protobuf.Duration target_duration = 4;
  bytes run_supervision_token = 5;
}

message DurationAck {
  bool accepted = 1;
  int64 current_duration_seconds = 2;
  google.protobuf.Duration current_duration = 3;
}

message StopRequest {
  string test_id = 1;
  bool graceful = 2;
  uint64 execution_generation = 3;
  bytes run_supervision_token = 4;
}

message StopAck {
  bool acknowledged = 1;
  int32 pending_vusers = 2;
}

message MetricsBatch {
  string test_id = 1;
  string generator_id = 2;
  int64 timestamp_unix_ms = 3;
  repeated TransactionMetric transactions = 4;
  GeneratorStats stats = 5;
  repeated GroupMetric groups = 6;
  string lifecycle_state = 7;
  string lifecycle_error = 8;
  MetricsBatchTelemetry telemetry = 9;
  // window_ms is the elapsed wall-clock duration (in milliseconds) that the
  // transactions in this batch were drained over. The controller divides
  // per-batch success counts by this window to compute a true per-second rate
  // (TPS). 0 means "unknown" (e.g. an older generator) and is treated as 1000ms.
  int64 window_ms = 10;
  repeated MetricAggregate transaction_metrics = 11;
  repeated MetricAggregate dependency_metrics = 12;
  repeated MetricAggregate soap_metrics = 13;
  repeated MetricAggregate network_profile_metrics = 14;
  MetricAggregate fleet_metrics = 15;
  BrowserMetrics browser_metrics = 16;
  repeated BrowserDeviceMetrics browser_device_metrics = 17;
  uint64 execution_generation = 18;
  // batch_sequence is monotonic for one test execution generation. Zero means
  // unknown (an older generator). Controllers use gaps to mark live windows
  // that a bounded subscriber queue could not deliver.
  uint64 batch_sequence = 19;
  repeated MetricAggregate region_metrics = 20;
  repeated MetricAggregate property_metrics = 22;
  repeated MetricAggregate action_metrics = 23;
  uint32 action_metrics_version = 24;
  repeated MetricAggregate action_property_metrics = 25;
  repeated TransactionResponseTimeSLACompliance transaction_response_time_sla = 21;
}

message MetricsBatchTelemetry {
  int64 dropped_results = 1;
  int64 collected_at_unix_ms = 2;
  int64 published_at_unix_ms = 3;
  double sample_age_ms = 4;
  // shedded_arrivals counts open-workload arrivals dropped because the
  // in-flight worker cap was saturated (the system under test could not keep up
  // with the offered TPS). Cumulative over the run, per generator.
  int64 shedded_arrivals = 5;
  double generator_processing_lag_ms = 6;
  double transport_lag_ms = 7;
  int64 dropped_subscriber_batches = 8;
}

message GroupMetric {
  string name = 1;
  int32 active_vusers = 2;
  MetricAggregate metrics = 3;
}

message TransactionResponseTimeSLACompliance {
  string group = 1;
  string transaction = 2;
  double threshold_ms = 3;
  int64 total_count = 4;
  int64 eligible_success_count = 5;
  int64 excluded_error_count = 6;
  int64 missed_count = 7;
}

message TDigestCentroid {
  double mean = 1;
  double weight = 2;
}

message TDigestSnapshot {
  double compression = 1;
  double total_weight = 2;
  double min = 3;
  double max = 4;
  int64 count = 5;
  repeated TDigestCentroid centroids = 6;
}

message MetricAggregate {
  string name = 1;
  string dependency_type = 2;
  string dependency_target = 3;
  int64 count = 4;
  int64 errors = 5;
  double avg_ms = 6;
  double p50_ms = 7;
  double p90_ms = 8;
  double p95_ms = 9;
  double p99_ms = 10;
  double avg_dns_ms = 11;
  double avg_connect_ms = 12;
  double avg_tls_ms = 13;
  double avg_ttfb_ms = 14;
  int64 bytes_sent = 15;
  int64 bytes_received = 16;
  double tps = 17;
  TDigestSnapshot duration_digest = 18;
  string messaging_summary_json = 19; // bounded, validated protocol.MessagingSummary v1
  uint32 messaging_version = 20;
}

message BrowserMetrics {
  int64 samples = 1;
  double avg_fcp_ms = 2;
  double avg_lcp_ms = 3;
  double avg_cls_score = 4;
  double avg_inp_ms = 5;
  double avg_ttfb_ms = 6;
  double avg_blocking_resources = 7;
  double avg_long_task_count = 8;
  double avg_js_heap_used_mb = 9;
  double avg_browser_process_cpu_pct = 10;
  double avg_browser_process_mem_mb = 11;
}

message BrowserDeviceMetrics {
  string device_profile = 1;
  string device_platform = 2;
  string device_tier = 3;
  string browser_engine = 4;
  BrowserMetrics metrics = 5;
}

message ServerTelemetry {
  double server_processing_ms = 1;
  double transfer_ms = 2;
  double request_payload_kb = 3;
  double response_payload_kb = 4;
  bool connection_reused = 5;
  string request_size_class = 6;
  string response_size_class = 7;
  double consumer_lag_ms = 8;
  double message_latency_ms = 9;
  int32 messages_sent = 10;
  int32 messages_received = 11;
  double messages_sent_per_sec = 12;
  double messages_received_per_sec = 13;
  double first_event_ms = 14;
  int32 event_count = 15;
  // Messaging reliability counters (P1.1).
  int32 send_failure_count = 16;
  int32 redelivery_count = 17;
  int32 dead_lettered_count = 18;
  int32 duplicate_count = 19;
  int32 out_of_order_count = 20;
  int32 commit_count = 21;
  int32 abort_count = 22;
  int64 consumer_offset_lag = 23;
  // Event Hubs / streaming ingestion signals (EH.4).
  int32 throttled_requests = 24;
  int32 server_busy_count = 25;
  int32 quota_exceeded_count = 26;
  int32 event_too_large_count = 27;
  double end_to_end_latency_ms = 28;
  string partition_id = 29;
  GRPCDiagnostics grpc = 30;
  WebSocketDiagnostics websocket = 31;
  bool consumer_lag_observed = 32;
  bool consumer_offset_lag_observed = 33;
  optional double acknowledgement_ms = 34;
  string subscription_id = 35;
}

message WebSocketDiagnostics {
  string operation = 1;
  string message_type = 2;
  optional double handshake_ms = 3;
  optional double reconnect_ms = 4;
  optional double send_ms = 5;
  optional double receive_ms = 6;
  optional double write_wait_ms = 7;
  int64 pending_writes = 8;
  int64 reconnects = 9;
  int64 messages_sent = 10;
  int64 messages_received = 11;
  int64 bytes_sent = 12;
  int64 bytes_received = 13;
  repeated double ping_rtt_ms = 14;
  optional int32 close_code = 15;
  string disconnect_reason = 16;
  bool callback_mode = 17;
}

// Optional client-observed diagnostics. Missing status/first-message fields
// remain unavailable; a receive limit does not prove the remote RPC succeeded.
message GRPCDiagnostics {
  string method = 1;
  string mode = 2;
  double call_ms = 3;
  optional double first_message_ms = 4;
  optional double deadline_budget_ms = 5;
  optional int32 status_code = 6;
  int64 messages_sent = 7;
  int64 messages_received = 8;
  int64 request_bytes = 9;
  int64 response_bytes = 10;
  bool receive_limit_reached = 11;
  optional double encode_ms = 12;
  optional double decode_ms = 13;
}

message TransactionMetric {
  double worker_duration_ms = 25;
  string name = 1;
  int64 start_time_unix_ms = 2;
  double duration_ms = 3;
  double dns_ms = 4;
  double connect_ms = 5;
  double tls_ms = 6;
  double ttfb_ms = 7;
  int64 bytes_sent = 8;
  int64 bytes_received = 9;
  int32 status_code = 10;
  bool success = 11;
  string error_message = 12;
  string correlation_id = 13;
  string dependency_type = 14;
  string dependency_target = 15;
  ServerTelemetry server_telemetry = 16;
  string soap_operation = 17;
  string snapshot_json = 18;
  string group = 19;
  string region = 20;
  string network_profile = 21;
  string hierarchy = 22;
  string phase = 23;
  string page_name = 24;
}

message GeneratorStats {
 int64 completed_iterations = 38;
  int32 active_vusers = 1;
  double cpu_percent = 2;
  int64 memory_bytes = 3;
  int32 goroutine_count = 4;
  double cpu_user_pct = 5;
  double cpu_system_pct = 6;
  double cpu_iowait_pct = 7;
  double cpu_steal_pct = 8;
  double load1 = 9;
  double load5 = 10;
  double load15 = 11;
  int32 thread_count = 12;
  int32 open_fd_count = 13;
  double heap_alloc_mb = 14;
  double heap_in_use_mb = 15;
  uint32 gc_count_delta = 16;
  double gc_pause_ms = 17;
  double container_cpu_limit_cores = 18;
  double container_cpu_usage_pct = 19;
  uint64 container_cpu_throttled_periods_delta = 20;
  double container_cpu_throttled_seconds_rate = 21;
  double container_memory_working_set_mb = 22;
  double container_memory_limit_mb = 23;
  double container_memory_usage_pct = 24;
  uint64 container_memory_fail_count_delta = 25;
  uint64 container_oom_kill_count_delta = 26;
  double net_drop_in_per_sec = 27;
  double net_drop_out_per_sec = 28;
  double net_error_in_per_sec = 29;
  double net_error_out_per_sec = 30;
  double tcp_retransmits_per_sec = 31;
  int32 tcp_established = 32;
  int32 tcp_time_wait = 33;
  double ephemeral_port_utilization_pct = 34;
  double disk_io_time_pct = 35;
  double disk_weighted_io_time_pct = 36;
  uint64 disk_in_progress = 37;
}

message ControlSignal {
  oneof signal {
    VUserAdjustment adjust = 1;
    StopRequest stop = 2;
    PauseRequest pause = 3;
  }
}

message PauseRequest {
  string test_id = 1;
  bool pause = 2;
  uint64 execution_generation = 3;
  string operation_id = 4;
  uint64 operation_sequence = 5;
  bytes run_supervision_token = 6;
}

message PauseAck {
  bool accepted = 1;
  bool current_paused = 2;
  string applied_operation_id = 3;
  string error_message = 4;
  uint64 applied_operation_sequence = 5;
}

message HeartbeatPing {
  string generator_id = 1;
  int64 timestamp_unix_ms = 2;
  GeneratorStats stats = 3;
}

// ProtocolRuntimeCapacity advertises a protocol-specific runtime ceiling
// independently from the generator pod's general goroutine/VUser capacity.
// Older controllers ignore this optional heartbeat field; newer controllers
// use it to avoid staging persistent sidecar work on a saturated generator.
message ProtocolRuntimeCapacity {
  string protocol = 1;
  bool available = 2;
  int64 max_vusers = 3;
  int64 available_vusers = 4;
  repeated string features = 5;
  // occupancy_mode is optional for rolling-upgrade compatibility. A current
  // generator reports idle, persistent, or legacy so the controller never
  // co-locates incompatible Java lifecycle modes in shared JVM process slots.
  string occupancy_mode = 6;
}

// GeneratorSafetyExitEvidence is the token-free durable explanation for the
// generator's most recent process safety exit. It survives a generator restart
// and lets a replacement controller recover the exact failed lifecycle outcome
// even though the original metrics stream disappeared with both processes.
message GeneratorSafetyExitEvidence {
  string test_id = 1;
  uint64 execution_generation = 2;
  string lifecycle_state = 3;
  string reason = 4;
  int64 requested_at_unix_ms = 5;
  int32 outstanding_executions = 6;
  // Exact token-free incident identity. requested_at_unix_ms remains for older
  // controllers, but cannot distinguish two escalations in the same millisecond.
  string requested_at_rfc3339_nano = 7;
}

message HeartbeatPong {
  string generator_id = 3;
  // Millisecond generator wall-clock sample retained for rolling compatibility.
  int64 timestamp_unix_ms = 1;
  repeated string active_test_ids = 2;
  GeneratorStats stats = 4;
  int32 available_capacity = 5;
  double cpu_limit_cores = 6;
  int64 memory_limit_bytes = 7;
  int32 max_vusers = 8;
  string version = 9;
  repeated string supported_protocols = 10;
  repeated string compatible_features = 11;
  repeated ProtocolRuntimeCapacity runtime_capacities = 12;
  // Actual generator wall-clock sample taken immediately before the heartbeat
  // response is built. Controllers use the request/response midpoint to
  // estimate the generator clock domain for coordinated start barriers.
  int64 timestamp_unix_nano = 13;
  // Monotonic process-lifetime safety counters. These are deliberately
  // generator-scoped so they never introduce run-token labels or disclosure.
  uint64 run_supervision_expirations_total = 14;
  uint64 run_supervision_escalations_total = 15;
  // Retained for rolling compatibility. Current consumers should use
  // safety_exits so a later incident cannot hide an earlier run.
  GeneratorSafetyExitEvidence last_safety_exit = 16;
  repeated GeneratorSafetyExitEvidence safety_exits = 17;
  PodCapacitySnapshot pod_capacity = 18;
  JavaHostCapabilities java_host = 19;
}

message ScriptPayload {
  string script_id = 1;
  bytes content = 2;
  string content_hash = 3;
  uint64 execution_generation = 4;
}

message ScriptAck {
  bool cached = 1;
  string content_hash = 2;
}

message ArchiveArtifactRequest {
  string test_id = 1;
  string name = 2;
  // Optional retained assignment identity; a mismatch must emit no artifact bytes.
  string source_identity = 3;
}

message ArchiveArtifact {
  string name = 1;
  bytes content = 2;
  string source_identity = 3;
}

message ArchiveArtifactChunk {
  string name = 1;
  bytes content = 2;
  int64 offset = 3;
  int64 total_size = 4;
  bool eof = 5;
  string source_identity = 6;
}

message RunAdoptionProof {
  uint64 generation = 1;
  bytes run_supervision_token = 2;
}
