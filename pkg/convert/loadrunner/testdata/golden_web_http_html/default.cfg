[HTTP]
ConnectTimeout=45
ReceiveTimeout=20
HTTPVersion=2
KeepAlive=1
MaxConnectionsPerHost=12
MaxRedirections=7

[Proxy]
Mode=custom
ProxyServer=http://proxy.example.test:8080
ProxyUserName=perfuser
ProxyPassword={{secret.proxy_password}}

[Browser Emulation]
UserAgent=StormrunnerGolden/1.0
AcceptLanguage=en-US
AcceptEncoding=gzip, deflate
Engine=chromium
DeviceProfile=pixel_7
TouchMode=1
Orientation=portrait
ClientMetrics=1
SlowMoMs=50
ViewportWidth=412
ViewportHeight=915
CacheEnabled=1
CacheContentURLs=1
CheckNewerVersions=1
NewUserPerIteration=1
DownloadResources=recorded

[SSL]
SSLVersion=TLS1.2

[Authentication]
UserName=perfuser
Password={{secret.basic_password}}

[Run Logic]
Iterations=3
AutoTransactions=per_action
BlockScheduling=sequential
ActionSequence=init,action,teardown

[Pacing]
Mode=random_delay
MinDelayMs=1000
MaxDelayMs=5000

[Think Time]
Ignore=0
Multiplier=1.5
LimitMs=10000

[Logging]
Level=extended
OnErrorOnly=1
ParameterSubstitution=1
DataReturned=1
AdvancedTrace=1

[Misc]
ContinueOnError=1
SnapshotOnError=1

[Additional Attributes]
BusinessProcess=Checkout
Owner=Performance Engineering

[Download Filters]
Mode=allow_list
Hosts=shop.example.test,cdn.example.test

[Content Check]
Text=Access Denied
Scope=any_response
FailIfFound=1

[Network Speed Simulation]
Mode=custom
BandwidthKbps=2048
LatencyMs=75

[Streaming]
Mode=fixed
BufferSizeSeconds=30
FixedBitrateKbps=1800
BandwidthEstimation=instant

[Data Formatting]
AutoDetect=1
Chain=base64,gzip mode=decode,url_decode,html_unescape,xml_to_json
