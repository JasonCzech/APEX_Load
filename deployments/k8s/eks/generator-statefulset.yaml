apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
spec:
  serviceName: apexload-generator
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-generator
        app.kubernetes.io/component: generator
        # Generators resolve {{secret.*}} references in-process at run time,
        # so they need workload identity for Key Vault just like the controller.
    spec:
      serviceAccountName: apexload-generator
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      # Pin generators to the dedicated load node pool (created by Terraform)
      # so noisy load generation never starves the controller or system pods.
      nodeSelector:
        apexload.io/node-pool: generators
      tolerations:
        - key: apexload.io/dedicated
          operator: Equal
          value: generators
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apexload-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: apexload-generator:0.1.0 # rewritten to the ACR reference by kustomization.yaml
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Fail closed: with APEXLOAD_ENV=production the generator refuses to
            # start on a plaintext, tokenless gRPC channel (see cmd/generator).
            # This guarantees a missing/misnamed token or TLS secret crashes the
            # pod instead of silently serving insecure RPCs.
            - name: APEXLOAD_ENV
              value: production
            - name: APEXLOAD_GENERATOR_MAX_VUSERS
              value: "10000"
            - name: APEXLOAD_GENERATOR_RUN_SUPERVISION_TTL
              value: "60s"
            - name: APEXLOAD_GENERATOR_ABANDON_DRAIN
              value: "5s"
            - name: APEXLOAD_JAVA_VUSER_RUNNER_ENABLED
              value: "false"
            # The durable generation high-water prevents a replaced pod from
            # accepting work from a controller term that was already fenced.
            - name: APEXLOAD_GENERATOR_STATE_DIR
              value: /var/lib/apexload-generator
            # Keep completed/per-crash generator evidence on the per-ordinal PVC
            # until the controller has durably ingested it.
            - name: APEXLOAD_ARCHIVE_DIR
              value: /var/lib/apexload-generator/archives
            # Server certificate + client-CA: requires mTLS from controllers.
            # Mirrors deployments/k8s/onprem. The grpc-tls Secret is mounted
            # below; provision it via cert-manager or workload-identity tooling.
            - name: APEXLOAD_GRPC_TLS_CERT
              value: /etc/apexload/grpc-tls/tls.crt
            - name: APEXLOAD_GRPC_TLS_KEY
              value: /etc/apexload/grpc-tls/tls.key
            - name: APEXLOAD_GRPC_TLS_CA
              value: /etc/apexload/grpc-tls/ca.crt
            # gRPC auth: controllers must present this token on every RPC.
            # Generate once and put it in the apexload-data-platform Secret
            # (both controller and generator consume it). Required (not
            # optional): a missing secret fails the pod, matching onprem.
            - name: APEXLOAD_GRPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_GRPC_AUTH_TOKEN
            # Secrets Manager access for {{secret.*}} interpolation during
            # runs. Only the region is imported: generators resolve secret
            # values and must never hold rotation authority, so the
            # write-enable key stays controller-only. That separation is why
            # this list is explicit rather than an envFrom of the whole
            # ConfigMap, which is what the controller uses.
            - name: APEXLOAD_AWS_SECRETS_MANAGER_REGION
              valueFrom:
                configMapKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_AWS_SECRETS_MANAGER_REGION
                  optional: true
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: apexload-data-platform
                  key: AWS_REGION
                  optional: true
            - name: APEXLOAD_AZURE_MESSAGING_ALLOWED_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_AZURE_MESSAGING_ALLOWED_NAMESPACES
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: generator-state
              mountPath: /var/lib/apexload-generator
            - name: grpc-tls
              mountPath: /etc/apexload/grpc-tls
              readOnly: true
          ports:
            - name: grpc
              containerPort: 9090
            - name: health
              containerPort: 9092
          readinessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 6Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: grpc-tls
          secret:
            secretName: apexload-generator-grpc-tls
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: generator-state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
