apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
spec:
  # Keep one controller in the base overlay. HA is supported only through the
  # aks-ha overlay, which sets APEXLOAD_CONTROLLER_HA=true and uses the shared
  # PostgreSQL/Redis data platform.
  replicas: 1
  # Do not overlap non-HA controller revisions or attach the RWO import-assets
  # claim from incumbent and replacement pods. The HA overlay inherits this
  # one-at-a-time strategy and keeps one of its two replicas available.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-controller
        app.kubernetes.io/component: controller
        # Required for the workload-identity webhook to inject the federated
        # token volume (Key Vault, Blob Storage access without secrets).
    spec:
      serviceAccountName: apexload-controller
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: apexload-controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: apexload-controller:0.1.0 # rewritten to the ACR reference by kustomization.yaml
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          env:
            # Fail closed: refuse to start in a bypass (unauthenticated) auth
            # mode. Configure auth.mode=oidc or trusted_headers in settings.
            - name: APEXLOAD_ENV
              value: production
            - name: APEXLOAD_ADDR
              value: ":8080"
            # Stable external identity for GitHub Actions OIDC and Check links.
            # Change this to the production ingress URL before deployment.
            - name: APEXLOAD_PUBLIC_URL
              value: https://apexload.example.com
            # Local staging/scratch only; durable state lives in PostgreSQL,
            # Amazon S3, and Redis — pods are fully disposable.
            - name: APEXLOAD_ARCHIVE_DIR
              value: /var/lib/apexload/archives
            - name: APEXLOAD_EXPORT_DIR
              value: /var/lib/apexload/exports
            - name: APEXLOAD_IMPORT_ASSET_DIR
              value: /var/lib/apexload-import-assets
            - name: APEXLOAD_BRUNO_ARTIFACT_ROOT
              value: /var/lib/apexload-import-assets/.bruno-artifacts
          envFrom:
            - configMapRef:
                name: apexload-data-platform
            - secretRef:
                name: apexload-data-platform
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/apexload
            - name: import-assets
              mountPath: /var/lib/apexload-import-assets
            - name: grpc-tls
              mountPath: /etc/apexload/grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/system/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 14Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: data
          emptyDir:
            sizeLimit: 10Gi
        - name: import-assets
          persistentVolumeClaim:
            claimName: apexload-controller-import-assets
        # Client certificate + CA for mTLS to generators. Provision the
        # apexload-controller-grpc-tls Secret via cert-manager or the Key Vault
        # CSI driver (see onprem/certificates.example.yaml for issuance).
        - name: grpc-tls
          secret:
            secretName: apexload-controller-grpc-tls
