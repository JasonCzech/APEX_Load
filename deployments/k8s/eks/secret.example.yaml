# EXAMPLE ONLY — not referenced by kustomization.yaml. Create the real secret
# out-of-band (kubectl create secret / SealedSecrets / the Secrets Store CSI
# driver's secretObjects sync) and never commit live credentials.
#
# Terraform already generates both credentials and writes them to Secrets
# Manager — see `terraform output database_url_secret_arn` and
# `redis_url_secret_arn`. They are deliberately not Terraform output VALUES:
# that would put them in plaintext in the state file and in any CI log that
# prints outputs.
#
#   kubectl -n apexload create secret generic apexload-data-platform \
#     --from-literal=APEXLOAD_DATABASE_URL="$(aws secretsmanager get-secret-value \
#         --secret-id apexload/platform/database-url --query SecretString --output text)" \
#     --from-literal=APEXLOAD_REDIS_URL="$(aws secretsmanager get-secret-value \
#         --secret-id apexload/platform/redis-url --query SecretString --output text)" \
#     --from-literal=APEXLOAD_GRPC_AUTH_TOKEN="$(openssl rand -hex 32)"
#
# ElastiCache with in-transit encryption enabled serves rediss:// on 6379
# (unlike Azure Cache for Redis, which uses 6380).
apiVersion: v1
kind: Secret
metadata:
  name: apexload-data-platform
  namespace: apexload
type: Opaque
stringData:
  APEXLOAD_DATABASE_URL: postgres://apexload:change-me@change-me.rds.amazonaws.com:5432/apexload?sslmode=require
  APEXLOAD_REDIS_URL: rediss://:change-me@change-me.cache.amazonaws.com:6379
  # Shared controller<->generator gRPC auth token (openssl rand -hex 32).
  APEXLOAD_GRPC_AUTH_TOKEN: change-me-64-hex-chars
