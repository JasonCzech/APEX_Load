# IRSA service accounts. The eks.amazonaws.com/role-arn annotations must name
# the IAM roles whose trust policies federate the cluster's OIDC provider to
# these service accounts (created by deployments/aws/terraform).
#
# Replace ${CONTROLLER_IRSA_ROLE_ARN} and ${GENERATOR_IRSA_ROLE_ARN} before
# applying. The safest path is:
#   scripts/render-eks-manifests.sh --output /tmp/apexload-eks.yaml
#   kubectl apply -f /tmp/apexload-eks.yaml
#
# EKS Pod Identity is an alternative to IRSA and needs no annotation at all:
# associate the role with the service account through the EKS API instead, and
# the controller resolves credentials the same way (ambient credential mode).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
  annotations:
    eks.amazonaws.com/role-arn: "${CONTROLLER_IRSA_ROLE_ARN}"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
  annotations:
    eks.amazonaws.com/role-arn: "${GENERATOR_IRSA_ROLE_ARN}"
automountServiceAccountToken: false
