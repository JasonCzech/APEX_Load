apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
      app.kubernetes.io/component: controller
  namespaceSelector:
    matchNames:
      - apexload-local
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - targetLabel: environment
          replacement: local
