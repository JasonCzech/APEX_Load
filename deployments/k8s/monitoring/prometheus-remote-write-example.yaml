apiVersion: v1
kind: ConfigMap
metadata:
  name: stormrunner-prometheus-remote-write
  labels:
    app.kubernetes.io/name: stormrunner
    app.kubernetes.io/component: monitoring
data:
  prometheus.remote-write.yaml: |
    global:
      scrape_interval: 15s
      external_labels:
        platform: stormrunner
        environment: production

    scrape_configs:
      - job_name: stormrunner-controller
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: stormrunner-controller
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep

    remote_write:
      # Grafana Mimir or managed Prometheus-compatible endpoint.
      - url: ${STORMRUNNER_PROMETHEUS_REMOTE_WRITE_URL}
        headers:
          X-Scope-OrgID: ${STORMRUNNER_PROMETHEUS_TENANT_ID}
        queue_config:
          capacity: 5000
          max_shards: 20
          min_shards: 1
          max_samples_per_send: 1000
          batch_send_deadline: 5s

      # Optional Thanos Receive endpoint. Remove this block when unused.
      - url: ${STORMRUNNER_THANOS_RECEIVE_REMOTE_WRITE_URL}
        queue_config:
          capacity: 5000
          max_shards: 20
          min_shards: 1
          max_samples_per_send: 1000
          batch_send_deadline: 5s
