apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apexload
resources:
  - ../onprem
patches:
  - target:
      kind: Deployment
      name: apexload-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APEXLOAD_CONTROLLER_HA
          value: "true"
