apiVersion: v1
kind: Secret
metadata:
  name: stormrunner-data-platform
type: Opaque
stringData:
  STORMRUNNER_DATABASE_URL: postgres://stormrunner:change-me@postgresql.stormrunner.svc:5432/stormrunner?sslmode=require
  STORMRUNNER_REDIS_URL: redis://redis.stormrunner.svc:6379/0
  STORMRUNNER_PROMETHEUS_REMOTE_WRITE_URL: https://mimir.example.com/api/v1/push
  STORMRUNNER_PROMETHEUS_TENANT_ID: stormrunner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stormrunner-data-platform
data:
  STORMRUNNER_STORE: postgres
  STORMRUNNER_DATABASE_MAX_OPEN_CONNS: "25"
  STORMRUNNER_DATABASE_MAX_IDLE_CONNS: "10"
  STORMRUNNER_DATABASE_CONN_MAX_LIFETIME: 30m
  STORMRUNNER_ARCHIVE_BACKEND: s3
  STORMRUNNER_ARCHIVE_BUCKET: stormrunner-archives
  STORMRUNNER_ARCHIVE_PREFIX: production/run-evidence
  STORMRUNNER_ARCHIVE_REGION: us-east-1
  STORMRUNNER_CACHE_BACKEND: memory
  STORMRUNNER_METRICS_RETENTION_BACKEND: prometheus_remote_write
