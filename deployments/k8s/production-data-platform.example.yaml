apiVersion: v1
kind: Secret
metadata:
  name: apexload-data-platform
type: Opaque
stringData:
  APEXLOAD_DATABASE_URL: postgres://apexload:change-me@postgresql.apexload.svc:5432/apexload?sslmode=require
  # Always set a Redis/Valkey password (ha/redis-valkey.example.yaml enforces
  # requirepass); prefer rediss:// (TLS, e.g. port 6380) when the cache supports it.
  APEXLOAD_REDIS_URL: redis://:change-me@apexload-redis.apexload.svc:6379/0
  APEXLOAD_PROMETHEUS_REMOTE_WRITE_URL: https://mimir.example.com/api/v1/push
  APEXLOAD_PROMETHEUS_TENANT_ID: apexload
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apexload-data-platform
data:
  APEXLOAD_STORE: postgres
  APEXLOAD_DATABASE_MAX_OPEN_CONNS: "25"
  APEXLOAD_DATABASE_MAX_IDLE_CONNS: "10"
  APEXLOAD_DATABASE_CONN_MAX_LIFETIME: 30m
  # Opt-in TimescaleDB hypertables for time-series tables (requires the
  # timescaledb extension available on the PostgreSQL server). Disabled by default.
  APEXLOAD_TIMESCALEDB: "false"
  APEXLOAD_ARCHIVE_BACKEND: s3
  APEXLOAD_ARCHIVE_BUCKET: apexload-archives
  APEXLOAD_ARCHIVE_PREFIX: production/run-evidence
  APEXLOAD_ARCHIVE_REGION: us-east-1
  APEXLOAD_CACHE_BACKEND: redis
  APEXLOAD_REDIS_KEY_PREFIX: apexload:prod
  APEXLOAD_REDIS_TIMEOUT: 2s
  APEXLOAD_REDIS_FANOUT_CHANNEL: telemetry:fanout
  APEXLOAD_API_KEY_RATE_LIMIT_PER_MINUTE: "600"
  APEXLOAD_IDEMPOTENCY_KEY_TTL: 15m
  APEXLOAD_METRICS_RETENTION_BACKEND: prometheus_remote_write
