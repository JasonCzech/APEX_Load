apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-controller
        app.kubernetes.io/component: controller
    spec:
      terminationGracePeriodSeconds: 45
      serviceAccountName: apexload-controller
      # Active EndpointSlice leadership publishing (APEXLOAD_ACTIVE_ENDPOINT_SLICE)
      # and optional audited restart controls require a mounted Kubernetes API token
      # on the controller ServiceAccount (keep automountServiceAccountToken: false
      # on generator pods).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: apexload-controller
                    app.kubernetes.io/component: controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          # Pin an immutable semantic release tag or digest in production; never use :latest.
          image: ghcr.io/jasonczech/apexload-controller:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            # Fail closed: refuse to start in a bypass (unauthenticated) auth
            # mode. Configure auth.mode=oidc or trusted_headers in settings.
            - name: APEXLOAD_ENV
              value: production
            # Script exports are confined here; root filesystem is read-only.
            - name: APEXLOAD_EXPORT_DIR
              value: /var/lib/apexload/exports
            # HA leader election. With replicas > 1, only the replica that holds
            # the execution lease promotes/starts/scales tests and reconciles
            # interrupted runs; the others serve the read-only API and return
            # HTTP 503 for execution-mutating calls. On leader loss a standby
            # takes over after the lease TTL (~30s). REQUIRES a shared database
            # that backs scheduler leases — PostgreSQL here, NOT per-pod SQLite.
            # (Point apexload-data-platform at PostgreSQL via APEXLOAD_DATABASE_URL.)
            - name: APEXLOAD_CONTROLLER_HA
              value: "true"
            - name: APEXLOAD_ACTIVE_ENDPOINT_SLICE
              value: apexload-controller-active
            - name: APEXLOAD_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APEXLOAD_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APEXLOAD_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Keep process-local reader materialization caches off any shared RWX volume.
            - name: APEXLOAD_ARCHIVE_READER_CACHE_DIR
              value: /tmp/apexload-archive-read-cache
          envFrom:
            - configMapRef:
                name: apexload-data-platform
            - secretRef:
                name: apexload-data-platform
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: archive-staging
              mountPath: /var/lib/apexload
          readinessProbe:
            httpGet:
              path: /api/v1/system/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        # Private per-pod ephemeral scratch for /tmp and process-local reader caches.
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        # HA archives must publish to shared object storage (s3, azure_blob, or gcs)
        # via apexload-data-platform, and any shared staging/export or import-assets
        # mount across controller replicas must use a qualified ReadWriteMany PVC
        # (never rely on per-pod emptyDir for durable archives or cross-replica assets;
        # see docs/ARCHIVE_SOURCE_RETENTION.md#shared-controller-staging).
        - name: archive-staging
          persistentVolumeClaim:
            claimName: apexload-controller-archive-staging
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apexload-controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
      app.kubernetes.io/component: controller
