apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-controller
        app.kubernetes.io/component: controller
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: apexload-controller
                    app.kubernetes.io/component: controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: ghcr.io/jasonczech/apexload-controller:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            # Fail closed: refuse to start in a bypass (unauthenticated) auth
            # mode. Configure auth.mode=oidc or trusted_headers in settings.
            - name: APEXLOAD_ENV
              value: production
            # Script exports are confined here; root filesystem is read-only.
            - name: APEXLOAD_EXPORT_DIR
              value: /var/lib/apexload/exports
            # HA leader election. With replicas > 1, only the replica that holds
            # the execution lease promotes/starts/scales tests and reconciles
            # interrupted runs; the others serve the read-only API and return
            # HTTP 503 for execution-mutating calls. On leader loss a standby
            # takes over after the lease TTL (~30s). REQUIRES a shared database
            # that backs scheduler leases — PostgreSQL here, NOT per-pod SQLite.
            # (Point apexload-data-platform at PostgreSQL via APEXLOAD_DATABASE_URL.)
            - name: APEXLOAD_CONTROLLER_HA
              value: "true"
          envFrom:
            - configMapRef:
                name: apexload-data-platform
            - secretRef:
                name: apexload-data-platform
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/apexload
          readinessProbe:
            httpGet:
              path: /api/v1/system/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        # Ephemeral scratch for the read-only-root container. In HA, point
        # APEXLOAD_EXPORT_DIR / persistence at shared storage instead.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apexload-controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
      app.kubernetes.io/component: controller
