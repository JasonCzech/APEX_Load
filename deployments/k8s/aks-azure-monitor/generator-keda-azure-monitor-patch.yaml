# Query expressions generated by scripts/generate-keda-queries.py; edit its signal definition.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apexload-generator
  namespace: apexload
spec:
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://CHANGE-ME.monitor.azure.com
        metricName: apexload_queued_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="${APEXLOAD_FLEET_ID}",signal="total_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "5000"
        activationThreshold: "1"
      authenticationRef:
        name: apexload-azure-monitor
    - type: prometheus
      metadata:
        serverAddress: https://CHANGE-ME.monitor.azure.com
        metricName: apexload_active_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="${APEXLOAD_FLEET_ID}",signal="active_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "5000"
        activationThreshold: "1"
      authenticationRef:
        name: apexload-azure-monitor
    - type: prometheus
      metadata:
        serverAddress: https://CHANGE-ME.monitor.azure.com
        metricName: apexload_queued_browser_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="${APEXLOAD_FLEET_ID}",signal="total_browser_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "20"
        activationThreshold: "1"
      authenticationRef:
        name: apexload-azure-monitor
    - type: prometheus
      metadata:
        serverAddress: https://CHANGE-ME.monitor.azure.com
        metricName: apexload_active_browser_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="${APEXLOAD_FLEET_ID}",signal="active_browser_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "20"
        activationThreshold: "1"
      authenticationRef:
        name: apexload-azure-monitor
    - type: prometheus
      metadata:
        serverAddress: https://CHANGE-ME.monitor.azure.com
        metricName: apexload_saturated_generators
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="${APEXLOAD_FLEET_ID}",signal="saturated_generators"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "1"
        activationThreshold: "1"
      authenticationRef:
        name: apexload-azure-monitor
    - type: prometheus
      metadata:
        serverAddress: https://CHANGE-ME.monitor.azure.com
        metricName: apexload_reserved_replica_floor
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="${APEXLOAD_FLEET_ID}",signal="reserved_replica_floor"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "1"
        activationThreshold: "0"
      authenticationRef:
        name: apexload-azure-monitor
