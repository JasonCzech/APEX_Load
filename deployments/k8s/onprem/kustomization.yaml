apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apexload
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - controller-service.yaml
  - controller-deployment.yaml
  - controller-ingress.yaml
  - generator-service.yaml
  - generator-statefulset.yaml
  - network-policy.yaml
  - pdb.yaml
  # Opt-in after filling in cluster CIDRs (see file header):
  # - egress-policies.example.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: apexload
      app.kubernetes.io/managed-by: kustomize

# Point at your registry. CI can do this dynamically with:
#   kustomize edit set image apexload-controller=$REGISTRY/apexload-controller:$TAG
images:
  - name: apexload-controller
    newName: registry.example.internal/apexload/apexload-controller # CHANGE-ME
    newTag: 0.1.0
  - name: apexload-generator
    newName: registry.example.internal/apexload/apexload-generator # CHANGE-ME
    newTag: 0.1.0
