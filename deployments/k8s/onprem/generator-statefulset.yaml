apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
spec:
  serviceName: apexload-generator
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-generator
        app.kubernetes.io/component: generator
    spec:
      serviceAccountName: apexload-generator
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Recommended: a dedicated node pool for load generation so spikes never
      # starve the controller or other tenants. Label/taint your nodes with
      # apexload.io/node-pool=generators and uncomment:
      # nodeSelector:
      #   apexload.io/node-pool: generators
      # tolerations:
      #   - key: apexload.io/dedicated
      #     operator: Equal
      #     value: generators
      #     effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apexload-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: apexload-generator:0.1.0 # rewritten to your registry by kustomization.yaml
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Warn loudly if the gRPC transport is left plaintext/tokenless.
            - name: APEXLOAD_ENV
              value: production
            # Server certificate + client-CA: requires mTLS from controllers.
            - name: APEXLOAD_GRPC_TLS_CERT
              value: /etc/apexload/grpc-tls/tls.crt
            - name: APEXLOAD_GRPC_TLS_KEY
              value: /etc/apexload/grpc-tls/tls.key
            - name: APEXLOAD_GRPC_TLS_CA
              value: /etc/apexload/grpc-tls/ca.crt
            - name: APEXLOAD_GRPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_GRPC_AUTH_TOKEN
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: grpc-tls
              mountPath: /etc/apexload/grpc-tls
              readOnly: true
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 6Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: grpc-tls
          secret:
            secretName: apexload-generator-grpc-tls
