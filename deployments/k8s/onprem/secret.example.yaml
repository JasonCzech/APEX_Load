# EXAMPLE ONLY — not referenced by kustomization.yaml. Create the real secret
# out-of-band (kubectl, SealedSecrets, SOPS, External Secrets Operator) and
# never commit live credentials.
#
#   kubectl -n apexload create secret generic apexload-data-platform \
#     --from-literal=APEXLOAD_DATABASE_URL='postgres://apexload:<password>@postgres.example.internal:5432/apexload?sslmode=require' \
#     --from-literal=APEXLOAD_REDIS_URL='rediss://:<password>@redis.example.internal:6380/0' \
#     --from-literal=APEXLOAD_GRPC_AUTH_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=APEXLOAD_ARCHIVE_ACCESS_KEY_ID='<minio-access-key>' \
#     --from-literal=APEXLOAD_ARCHIVE_SECRET_ACCESS_KEY='<minio-secret-key>'
#
# Notes:
# - Use sslmode=require (or verify-full) on the PostgreSQL DSN.
# - Prefer rediss:// (TLS) and always set a Redis/Valkey password — see
#   ../ha/redis-valkey.example.yaml for an in-cluster Valkey with requirepass.
# - APEXLOAD_GRPC_AUTH_TOKEN must be identical in the controller and generator
#   pods; both consume this secret.
# - The S3 credentials map to standard AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
#   if you prefer those names; gocloud reads the AWS SDK default chain.
apiVersion: v1
kind: Secret
metadata:
  name: apexload-data-platform
  namespace: apexload
type: Opaque
stringData:
  APEXLOAD_DATABASE_URL: postgres://apexload:change-me@postgres.example.internal:5432/apexload?sslmode=require
  APEXLOAD_REDIS_URL: rediss://:change-me@redis.example.internal:6380/0
  APEXLOAD_GRPC_AUTH_TOKEN: change-me-64-hex-chars
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
