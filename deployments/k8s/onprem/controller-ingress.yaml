# TLS-terminating ingress for the controller API + dashboard (ingress-nginx).
# Production deployments must not serve the dashboard over plain HTTP: session
# cookies are marked Secure in production mode and APIs carry bearer tokens.
#
# The dashboard streams live metrics over WebSockets (/api/v1/ws and
# /api/v1/tests/{id}/stream) — the long timeouts prevent the proxy from
# severing streams mid-test.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # With cert-manager installed, uncomment to issue the certificate:
    # cert-manager.io/cluster-issuer: your-cluster-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - apexload.example.internal # CHANGE-ME: your DNS name
      secretName: apexload-tls # CHANGE-ME: cert-manager-issued or uploaded
  rules:
    - host: apexload.example.internal # CHANGE-ME
      http:
        paths:
          # CI run mutations and execution-readiness must reach only the
          # admitted execution leader. OIDC exchange remains on the ordinary
          # all-replica Service so authentication survives leader failover.
          - path: /api/v1/ci
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Test lifecycle, execution-plan scheduling/materialization, and
          # capacity binding are execution-leader mutations. Route each family
          # through the generation-fenced active-controller endpoint.
          - path: /api/v1/tests
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/scenarios
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/schedules/health
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/execution-plans
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/capacity/timeslots
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/system/execution-readiness
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Replay and debugger session state lives on its owning controller.
          # Route both starts and subsequent lifecycle/diagnosis requests to
          # the admitted leader rather than load-balancing them by request.
          - path: /api/v1/scripts
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/replay
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/script-debug
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/browser-replay
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Recorder sessions and their verification replays share local
          # manager state and therefore must stay on the admitted controller.
          - path: /api/v1/recorder
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/browser-recorder
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Replay/debug progress is broadcast from the owning controller's
          # process-local WebSocket hub. Keep the global stream on that same
          # active endpoint. Per-test streams are covered by /api/v1/tests.
          - path: /api/v1/ws
            pathType: Exact
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apexload-controller
                port:
                  name: http
