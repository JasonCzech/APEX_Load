# Dedicated service accounts: neither workload needs Kubernetes API access
# (no client-go in the binaries), so no Role/RoleBinding is shipped. Dedicated
# SAs still matter for audit attribution and future admission policies.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
automountServiceAccountToken: false
