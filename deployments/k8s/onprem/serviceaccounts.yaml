# Dedicated service accounts default to tokenless. The controller Deployment
# explicitly mounts its token for the shipped namespace-scoped restart Role;
# generator pods remain tokenless.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
automountServiceAccountToken: false
