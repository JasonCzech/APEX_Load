apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
spec:
  serviceName: apexload-generator
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-generator
        app.kubernetes.io/component: generator
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: apexload-generator:0.1.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # This pod has its own network namespace, so its UDP drop
            # counters are attributable to it in run reports.
            - name: APEXLOAD_UDP_COUNTER_SCOPE
              value: pod
            - name: APEXLOAD_GENERATOR_MAX_VUSERS
              value: "1000"
            - name: APEXLOAD_GENERATOR_RUN_SUPERVISION_TTL
              value: "60s"
            - name: APEXLOAD_GENERATOR_ABANDON_DRAIN
              value: "5s"
            # emptyDir survives a generator container restart within this local
            # pod, preserving the execution high-water and safety-exit evidence.
            # Production overlays use a per-ordinal PVC so this also survives pod
            # replacement.
            - name: APEXLOAD_GENERATOR_STATE_DIR
              value: /var/lib/apexload-generator
            - name: APEXLOAD_ARCHIVE_DIR
              value: /var/lib/apexload-generator/archives
            - name: APEXLOAD_JAVA_VUSER_RUNNER_ENABLED
              value: "false"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: generator-state
              mountPath: /var/lib/apexload-generator
          ports:
            - name: grpc
              containerPort: 9090
            - name: health
              containerPort: 9092
          readinessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: generator-state
          emptyDir: {}
