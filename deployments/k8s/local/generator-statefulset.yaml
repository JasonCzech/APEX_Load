apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
spec:
  serviceName: apexload-generator
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-generator
        app.kubernetes.io/component: generator
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: apexload-generator:0.1.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir: {}
