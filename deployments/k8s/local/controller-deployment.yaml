apiVersion: apps/v1
kind: Deployment
metadata:
  name: stormrunner-controller
  labels:
    app.kubernetes.io/name: stormrunner-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stormrunner-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stormrunner-controller
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: controller
          image: stormrunner-controller:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STORMRUNNER_ADDR
              value: ":8080"
            - name: STORMRUNNER_DB
              value: /var/lib/stormrunner/stormrunner.db
            - name: STORMRUNNER_ARCHIVE_DIR
              value: /var/lib/stormrunner/archives
            - name: STORMRUNNER_GENERATOR_TIMEOUT
              value: 10s
            - name: STORMRUNNER_GENERATORS
              value: stormrunner-generator-0.stormrunner-generator:9090,stormrunner-generator-1.stormrunner-generator:9090
          volumeMounts:
            - name: controller-data
              mountPath: /var/lib/stormrunner
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: controller-data
          persistentVolumeClaim:
            claimName: stormrunner-controller-data
