apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: apexload-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: apexload-controller:0.1.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APEXLOAD_FLEET_ID
              value: apexload-local
            # Labels the build/runtime indicator in the dashboard. Auto-detection
            # falls back to "kubernetes" when unset; override to "aks"/"eks"/etc.
            # for precise cloud labeling in cloud-specific overlays.
            - name: APEXLOAD_ENVIRONMENT
              value: kubernetes
            - name: APEXLOAD_ADDR
              value: ":8080"
            - name: APEXLOAD_K8S_RESTART_ENABLED
              value: "true"
            - name: APEXLOAD_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APEXLOAD_DB
              value: /var/lib/apexload/apexload.db
            - name: APEXLOAD_STORE
              value: sqlite
            # Local-only wrapping key for database-backed Project Secrets.
            # Production deployments must inject a randomly generated key.
            - name: APEXLOAD_WRAPPING_MASTER_KEY
              value: apexload-local-project-secret-wrapping-key
            - name: APEXLOAD_ARCHIVE_DIR
              value: /var/lib/apexload/archives
            - name: APEXLOAD_ARCHIVE_BACKEND
              value: filesystem
            # Confine script exports to the writable data volume (the container
            # root filesystem is read-only).
            - name: APEXLOAD_EXPORT_DIR
              value: /var/lib/apexload/exports
            - name: APEXLOAD_GENERATOR_TIMEOUT
              value: 10s
            - name: APEXLOAD_GENERATOR_RUN_SUPERVISION_TTL
              value: 60s
            - name: APEXLOAD_GENERATOR_RUN_SUPERVISION_RENEW_INTERVAL
              value: 10s
            - name: APEXLOAD_GENERATORS
              value: dns://apexload-generator.apexload-local.svc.cluster.local:9090
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apexload-openai-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: apexload-openai-settings
                  key: OPENAI_MODEL
                  optional: true
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apexload-xai-secrets
                  key: XAI_API_KEY
                  optional: true
            - name: XAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: apexload-xai-settings
                  key: XAI_MODEL
                  optional: true
          volumeMounts:
            - name: controller-data
              mountPath: /var/lib/apexload
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: controller-data
          persistentVolumeClaim:
            claimName: apexload-controller-data
        - name: tmp
          emptyDir: {}
