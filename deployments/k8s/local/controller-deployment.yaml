apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-controller
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: controller
          image: apexload-controller:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APEXLOAD_ADDR
              value: ":8080"
            - name: APEXLOAD_DB
              value: /var/lib/apexload/apexload.db
            - name: APEXLOAD_STORE
              value: sqlite
            - name: APEXLOAD_ARCHIVE_DIR
              value: /var/lib/apexload/archives
            - name: APEXLOAD_ARCHIVE_BACKEND
              value: filesystem
            - name: APEXLOAD_GENERATOR_TIMEOUT
              value: 10s
            - name: APEXLOAD_GENERATORS
              value: apexload-generator-0.apexload-generator:9090,apexload-generator-1.apexload-generator:9090
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apexload-openai-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: apexload-openai-settings
                  key: OPENAI_MODEL
                  optional: true
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apexload-xai-secrets
                  key: XAI_API_KEY
                  optional: true
            - name: XAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: apexload-xai-settings
                  key: XAI_MODEL
                  optional: true
          volumeMounts:
            - name: controller-data
              mountPath: /var/lib/apexload
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: controller-data
          persistentVolumeClaim:
            claimName: apexload-controller-data
