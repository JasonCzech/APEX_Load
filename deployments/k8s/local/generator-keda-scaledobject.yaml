apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: apexload-generator
  minReplicaCount: 2
  maxReplicaCount: 50
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 25
              periodSeconds: 300
          selectPolicy: Min
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: apexload_queued_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="apexload-local",signal="total_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "5000"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: apexload_active_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="apexload-local",signal="active_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "5000"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: apexload_queued_browser_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="apexload-local",signal="total_browser_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "20"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: apexload_active_browser_vusers
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="apexload-local",signal="active_browser_vusers"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "20"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: apexload_saturated_generators
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="apexload-local",signal="saturated_generators"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "1"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: apexload_reserved_replica_floor
        ignoreNullValues: "false"
        query: max(apexload_fleet_autoscaling{fleet="apexload-local",signal="reserved_replica_floor"} and on(fleet,job,instance) (apexload_fleet_autoscaling_valid_until > time()))
        threshold: "1"
        activationThreshold: "0"
