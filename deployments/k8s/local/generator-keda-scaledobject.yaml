apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: stormrunner-generator
  labels:
    app.kubernetes.io/name: stormrunner-generator
    app.kubernetes.io/component: generator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: stormrunner-generator
  minReplicaCount: 2
  maxReplicaCount: 50
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 25
              periodSeconds: 300
          selectPolicy: Min
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: stormrunner_queued_vusers
        query: sum(stormrunner_scaling_vusers{state="queued"})
        threshold: "5000"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: stormrunner_queued_browser_vusers
        query: sum(stormrunner_scaling_protocol_vusers{state="queued",protocol="browser"})
        threshold: "20"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: stormrunner_saturated_generators
        query: sum(stormrunner_generator_capacity_state_count{state="saturated"})
        threshold: "1"
        activationThreshold: "1"
