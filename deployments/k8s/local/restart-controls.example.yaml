# OPT-IN restart controls — not included in kustomization.yaml.
#
# Default local manifests intentionally run tokenless. The local overlay does
# not define a dedicated controller ServiceAccount today, so create/use
# `apexload-controller`, set serviceAccountName on the controller Deployment,
# and mount the token only in your opt-in overlay:
#
# patches:
#   - target:
#       kind: Deployment
#       name: apexload-controller
#     patch: |-
#       - op: add
#         path: /spec/template/spec/serviceAccountName
#         value: apexload-controller
#       - op: replace
#         path: /spec/template/spec/automountServiceAccountToken
#         value: true
#       - op: add
#         path: /spec/template/spec/containers/0/env/-
#         value: { name: APEXLOAD_K8S_RESTART_ENABLED, value: "true" }
#       - op: add
#         path: /spec/template/spec/containers/0/env/-
#         value: { name: APEXLOAD_K8S_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
#
# Optional env overrides:
#   APEXLOAD_K8S_CONTROLLER_DEPLOYMENT=apexload-controller
#   APEXLOAD_K8S_GENERATOR_STATEFULSET=apexload-generator
#   APEXLOAD_K8S_GENERATOR_SELECTOR=app.kubernetes.io/name=apexload-generator
#   APEXLOAD_K8S_RESTART_ALLOW_FORCE=true
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apexload-restart-controls
  namespace: apexload-local
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: restart-controls
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apexload-restart-controls
  namespace: apexload-local
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: restart-controls
subjects:
  - kind: ServiceAccount
    name: apexload-controller
    namespace: apexload-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apexload-restart-controls
