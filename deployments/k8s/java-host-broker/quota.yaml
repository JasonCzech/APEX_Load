apiVersion: v1
kind: ResourceQuota
metadata:
  name: java-hosts
  namespace: apexload-java-execution
spec:
  hard:
    pods: "25"
    count/secrets: "100"
    requests.cpu: "25"
    limits.cpu: "25"
    requests.memory: 8Gi
    limits.memory: 8Gi
    requests.ephemeral-storage: 2Gi
    limits.ephemeral-storage: 2Gi
