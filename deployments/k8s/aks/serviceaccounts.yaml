# Workload-identity service accounts. The azure.workload.identity/client-id
# annotation must be the client ID of the user-assigned managed identity that
# has federated credentials for these service accounts (created by
# deployments/azure/terraform — see output `workload_identity_client_id`).
#
# Replace ${WORKLOAD_IDENTITY_CLIENT_ID} before applying, e.g.:
#   export WORKLOAD_IDENTITY_CLIENT_ID=$(terraform output -raw workload_identity_client_id)
#   kubectl kustomize deployments/k8s/aks | envsubst '$WORKLOAD_IDENTITY_CLIENT_ID' | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}"
