# Workload-identity service accounts. The azure.workload.identity/client-id
# annotations must be the client IDs of the user-assigned managed identities
# that have federated credentials for these service accounts (created by
# deployments/azure/terraform).
#
# Replace ${CONTROLLER_WORKLOAD_IDENTITY_CLIENT_ID} and
# ${GENERATOR_WORKLOAD_IDENTITY_CLIENT_ID} before applying. The safest path is:
#   scripts/render-aks-manifests.sh --output /tmp/apexload-aks.yaml
#   kubectl apply -f /tmp/apexload-aks.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "${CONTROLLER_WORKLOAD_IDENTITY_CLIENT_ID}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "${GENERATOR_WORKLOAD_IDENTITY_CLIENT_ID}"
