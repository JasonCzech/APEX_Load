# Exposes the controller API + dashboard through AKS Web Application Routing
# (the managed NGINX ingress add-on; enable with `--enable-app-routing` or the
# Terraform `web_app_routing` block). For AGIC or a self-managed NGINX, change
# ingressClassName and keep the WebSocket timeout annotations.
#
# The dashboard streams live metrics over WebSockets (/api/v1/ws and
# /api/v1/tests/{id}/stream) — the long read/send timeouts below prevent the
# proxy from severing streams mid-test.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apexload-controller
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  # TLS: create the secret with cert-manager or upload your certificate, then
  # uncomment. Production deployments should not serve the dashboard over HTTP.
  # tls:
  #   - hosts:
  #       - apexload.example.com
  #     secretName: apexload-tls
  rules:
    - host: apexload.example.com # CHANGE-ME: your DNS name
      http:
        paths:
          # Controller-native CI mutations must reach the admitted execution
          # leader in HA. OIDC exchange and other read/shared-state traffic use
          # the ordinary all-replica Service below so authentication remains
          # available during leader failover.
          - path: /api/v1/ci
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Keep the full execution lifecycle on the admitted controller. The
          # AKS HA overlay uses the same generation-fenced EndpointSlice as the
          # on-prem and Helm deployments.
          - path: /api/v1/tests
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/scenarios
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/schedules/health
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/execution-plans
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/capacity/timeslots
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/system/execution-readiness
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Replay and debugger sessions are process-local. Keep creation,
          # polling, control, and correlation diagnosis on the same admitted
          # controller for the full session lifecycle.
          - path: /api/v1/scripts
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/replay
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/script-debug
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/browser-replay
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Recorder sessions and the replay verification they launch are
          # process-local as well, so keep their full lifecycle on the active
          # controller alongside browser-replay status and progress.
          - path: /api/v1/recorder
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/browser-recorder
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          # Replay/debug progress is broadcast from the owning controller's
          # process-local WebSocket hub. Keep the global stream on that same
          # active endpoint. Per-test streams are covered by /api/v1/tests.
          - path: /api/v1/ws
            pathType: Exact
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apexload-controller
                port:
                  name: http
