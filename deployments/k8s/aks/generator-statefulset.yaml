apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apexload-generator
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
spec:
  serviceName: apexload-generator
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-generator
        app.kubernetes.io/component: generator
        # Generators resolve {{secret.*}} references in-process at run time,
        # so they need workload identity for Key Vault just like the controller.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: apexload-generator
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # Pin generators to the dedicated load node pool (created by Terraform)
      # so noisy load generation never starves the controller or system pods.
      nodeSelector:
        apexload.io/node-pool: generators
      tolerations:
        - key: apexload.io/dedicated
          operator: Equal
          value: generators
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apexload-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: apexload-generator:0.1.0 # rewritten to the ACR reference by kustomization.yaml
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # gRPC auth: controllers must present this token on every RPC.
            # Generate once and put it in the apexload-data-platform Secret
            # (both controller and generator consume it). For full mTLS, add
            # the APEXLOAD_GRPC_TLS_* cert wiring — see
            # deployments/k8s/onprem for a complete example.
            - name: APEXLOAD_GRPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_GRPC_AUTH_TOKEN
                  optional: true
            # Key Vault access for {{secret.*}} interpolation during runs.
            - name: APEXLOAD_AZURE_KEY_VAULT_URL
              valueFrom:
                configMapKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_AZURE_KEY_VAULT_URL
                  optional: true
            - name: APEXLOAD_AZURE_KEY_VAULT_AUTH
              valueFrom:
                configMapKeyRef:
                  name: apexload-data-platform
                  key: APEXLOAD_AZURE_KEY_VAULT_AUTH
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 6Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
