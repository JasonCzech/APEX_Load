# EXAMPLE ONLY — not referenced by kustomization.yaml. Create the real secret
# out-of-band (kubectl create secret / SealedSecrets / the Key Vault CSI
# driver's secretObjects sync) and never commit live credentials.
#
#   kubectl -n apexload create secret generic apexload-data-platform \
#     --from-literal=APEXLOAD_DATABASE_URL='postgres://apexload:<password>@<server>.postgres.database.azure.com:5432/apexload?sslmode=require' \
#     --from-literal=APEXLOAD_REDIS_URL='rediss://:<access-key>@<cache>.redis.cache.windows.net:6380/0'
#
# Azure Cache for Redis only exposes TLS (rediss://) on 6380 by default.
apiVersion: v1
kind: Secret
metadata:
  name: apexload-data-platform
  namespace: apexload
type: Opaque
stringData:
  APEXLOAD_DATABASE_URL: postgres://apexload:change-me@change-me.postgres.database.azure.com:5432/apexload?sslmode=require
  APEXLOAD_REDIS_URL: rediss://:change-me@change-me.redis.cache.windows.net:6380/0
  # Shared controller<->generator gRPC auth token (openssl rand -hex 32).
  APEXLOAD_GRPC_AUTH_TOKEN: change-me-64-hex-chars
