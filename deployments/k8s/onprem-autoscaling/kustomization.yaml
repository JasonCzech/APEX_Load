apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apexload
resources:
  - ../onprem
  - generator-keda-scaledobject.yaml
  - servicemonitor.yaml
  - ../monitoring/prometheusrule.yaml
patches:
  - target:
      kind: ConfigMap
      name: apexload-data-platform
    patch: |-
      - op: add
        path: /data/APEXLOAD_GENERATOR_AUTOSCALING_OWNER
        value: keda
