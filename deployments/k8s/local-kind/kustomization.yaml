apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local
images:
  - name: apexload-controller
    newName: localhost:5001/apexload-controller
    newTag: 0.1.0
  - name: apexload-generator
    newName: localhost:5001/apexload-generator
    newTag: 0.1.0
patches:
  - path: controller-image-policy.yaml
  - path: generator-image-policy.yaml
