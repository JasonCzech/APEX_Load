global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/apexload-rules.yml

scrape_configs:
  - job_name: apexload-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - controller:9091
        labels:
          environment: local
