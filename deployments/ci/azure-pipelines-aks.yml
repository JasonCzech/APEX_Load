# Build APEX Load images, push to ACR, deploy to AKS, smoke test.
#
# Pipeline variables (Library or pipeline settings):
#   AZURE_SERVICE_CONNECTION — ARM service connection with AcrPush on the
#                              registry and Azure Kubernetes Service RBAC
#                              Writer on the cluster
#   ACR_NAME                 — registry name (without .azurecr.io)
#   AKS_RESOURCE_GROUP       — resource group of the cluster
#   AKS_CLUSTER_NAME         — cluster name
#   Terraform state should be initialized for deployments, or provide
#   APEXLOAD_ACR_LOGIN_SERVER, APEXLOAD_STORAGE_ACCOUNT_NAME,
#   APEXLOAD_KEY_VAULT_URL, APEXLOAD_CONTROLLER_WORKLOAD_IDENTITY_CLIENT_ID,
#   and APEXLOAD_GENERATOR_WORKLOAD_IDENTITY_CLIENT_ID as variables/env.
trigger:
  branches:
    include:
      - main

variables:
  imageTag: $(Build.SourceVersion)

stages:
  - stage: Build
    displayName: Build & push images
    jobs:
      - job: build_push
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: AzureCLI@2
            displayName: az acr build (controller + generator)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                COMMIT=$(Build.SourceVersion)
                BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                BUILD_VERSION=$(COMMIT="${COMMIT}" BUILD_TIME="${BUILD_TIME}" ./scripts/resolve-version.sh)
                for binary in controller generator; do
                  az acr build --registry $(ACR_NAME) \
                    --image apexload-${binary}:$(imageTag) \
                    --image apexload-${binary}:latest \
                    --build-arg BINARY=${binary} \
                    --build-arg VERSION=${BUILD_VERSION} \
                    --build-arg COMMIT=${COMMIT} \
                    --build-arg BUILD_TIME=${BUILD_TIME} \
                    --file Dockerfile .
                done

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    jobs:
      - job: validate_deploy_artifacts
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              terraform -chdir=deployments/azure/terraform fmt -check -diff
              terraform -chdir=deployments/azure/terraform init -backend=false -input=false
              terraform -chdir=deployments/azure/terraform validate
              kubectl kustomize deployments/k8s/aks >/tmp/apexload-aks.yaml
              helm lint deployments/helm/apexload \
                --set workloadIdentity.controllerClientId=00000000-0000-0000-0000-000000000001 \
                --set workloadIdentity.generatorClientId=00000000-0000-0000-0000-000000000002
              helm template apexload deployments/helm/apexload --namespace apexload \
                --set workloadIdentity.controllerClientId=00000000-0000-0000-0000-000000000001 \
                --set workloadIdentity.generatorClientId=00000000-0000-0000-0000-000000000002 >/tmp/apexload-helm.yaml
            displayName: Validate Terraform, Kustomize, and Helm

      - deployment: deploy_aks
        dependsOn: validate_deploy_artifacts
        environment: apexload-aks
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: kustomize set images + kubectl apply
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials \
                        --resource-group $(AKS_RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER_NAME) --overwrite-existing
                      terraform -chdir=deployments/azure/terraform init -input=false
                      APEXLOAD_IMAGE_TAG="$(imageTag)" scripts/render-aks-manifests.sh --output /tmp/apexload-aks.yaml
                      kubectl apply -f /tmp/apexload-aks.yaml
                      kubectl -n apexload rollout status deployment/apexload-controller --timeout=300s
                      kubectl -n apexload rollout status statefulset/apexload-generator --timeout=300s

  - stage: Smoke
    displayName: Smoke test
    dependsOn: Deploy
    jobs:
      - job: smoke
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Health + readiness probes via kubectl
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER_NAME) --overwrite-existing
                kubectl -n apexload run smoke --rm -i --restart=Never \
                  --image=curlimages/curl:8.10.1 -- \
                  curl -fsS http://apexload-controller:8080/api/v1/system/health
