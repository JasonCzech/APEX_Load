# Build the APEX Load controller, assemble the Node.js launcher package,
# zip-deploy to Azure App Service for Linux.
# Copy into .github/workflows/ to activate.
#
# Uses OIDC federation (no stored cloud secrets). Repo configuration:
#   Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              APPSERVICE_NAME, APPSERVICE_RESOURCE_GROUP
#   The federated app registration needs Website Contributor on the App Service.
name: Deploy to App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: appservice-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build the React dashboard first — go:embed in pkg/api/server.go picks
      # up pkg/api/static/ which is the output of this step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          set -euo pipefail
          cd dashboard
          npm ci
          npx tsc --noEmit --pretty false
          npm run lint
          npm run lint:a11y
          npm test
          npm run test:bundle-budget
          npm run bundle:check
          npm run build

      # Build a static linux/amd64 controller binary.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build controller (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          BI=github.com/jasonczech/apexload/pkg/buildinfo
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_VERSION=$(COMMIT="${GITHUB_SHA}" BUILD_TIME="${BUILD_TIME}" ./scripts/resolve-version.sh)
          go build -trimpath \
            -ldflags "-s -w -X ${BI}.Version=${BUILD_VERSION} -X ${BI}.Commit=${GITHUB_SHA} -X ${BI}.BuildTime=${BUILD_TIME}" \
            -o deployments/azure/appservice/bin/controller \
            ./cmd/controller

      # Run the launcher test suite before packaging.
      - name: Test launcher
        run: node --test deployments/azure/appservice/launcher.test.js

      # Assemble the zip: launcher files + binary.
      - name: Assemble deployment package
        run: |
          set -euo pipefail
          mkdir -p staging
          cp deployments/azure/appservice/package.json staging/
          cp deployments/azure/appservice/launcher.js  staging/
          mkdir -p staging/bin
          cp deployments/azure/appservice/bin/controller staging/bin/controller
          cd staging
          zip -r ../apexload-appservice.zip .

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip to App Service
        run: |
          az webapp deploy \
            --resource-group "${{ vars.APPSERVICE_RESOURCE_GROUP }}" \
            --name "${{ vars.APPSERVICE_NAME }}" \
            --src-path apexload-appservice.zip \
            --type zip

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="https://${{ vars.APPSERVICE_NAME }}.azurewebsites.net/api/v1/system/health"
          for i in $(seq 1 12); do
            if curl -fsS "$URL"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt ${i}/12 — waiting 10s..."
            sleep 10
          done
          echo "Health check timed out." && exit 1
