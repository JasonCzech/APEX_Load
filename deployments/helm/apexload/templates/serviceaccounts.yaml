apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccountName }}
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
{{ include "apexload.labels" . | indent 4 }}
{{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.controllerClientId is required when workloadIdentity.enabled=true" .Values.workloadIdentity.controllerClientId | quote }}
{{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.generator.serviceAccountName }}
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
{{ include "apexload.labels" . | indent 4 }}
{{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.generatorClientId is required when workloadIdentity.enabled=true" .Values.workloadIdentity.generatorClientId | quote }}
{{- end }}
automountServiceAccountToken: false
