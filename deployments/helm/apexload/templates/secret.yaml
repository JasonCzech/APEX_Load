{{- if .Values.dataPlatform.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dataPlatform.secretName }}
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload
    app.kubernetes.io/component: data-platform
{{ include "apexload.labels" . | indent 4 }}
type: Opaque
stringData:
  APEXLOAD_DATABASE_URL: {{ required "dataPlatform.databaseUrl is required when dataPlatform.createSecret=true" .Values.dataPlatform.databaseUrl | quote }}
  APEXLOAD_REDIS_URL: {{ required "dataPlatform.redisUrl is required when dataPlatform.createSecret=true" .Values.dataPlatform.redisUrl | quote }}
  APEXLOAD_GRPC_AUTH_TOKEN: {{ required "dataPlatform.grpcAuthToken is required when dataPlatform.createSecret=true" .Values.dataPlatform.grpcAuthToken | quote }}
{{- end }}
