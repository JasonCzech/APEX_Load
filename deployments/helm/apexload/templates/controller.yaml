apiVersion: v1
kind: Service
{{- if and .Values.controller.ha.enabled (ne .Values.dataPlatform.store "postgres") }}
{{- fail "controller.ha.enabled requires dataPlatform.store=postgres" }}
{{- end }}
{{- if and .Values.controller.ha.enabled (ne .Values.dataPlatform.cacheBackend "redis") }}
{{- fail "controller.ha.enabled requires dataPlatform.cacheBackend=redis" }}
{{- end }}
{{- if and (gt (int .Values.controller.replicas) 1) (not .Values.controller.ha.enabled) }}
{{- fail "controller.replicas greater than 1 requires controller.ha.enabled=true" }}
{{- end }}
{{- if and .Values.controller.ha.enabled (not (has .Values.controller.ha.endpointAddressType (list "IPv4" "IPv6"))) }}
{{- fail "controller.ha.endpointAddressType must be IPv4 or IPv6" }}
{{- end }}
metadata:
  name: apexload-controller
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
{{ include "apexload.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: apexload-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9091
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: apexload-controller-active
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: active-controller
{{ include "apexload.labels" . | indent 4 }}
spec:
{{- if not .Values.controller.ha.enabled }}
  selector:
    app.kubernetes.io/name: apexload-controller
{{- end }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.controller.ha.enabled }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: apexload-controller-active
  namespace: {{ include "apexload.namespace" . }}
  labels:
    kubernetes.io/service-name: apexload-controller-active
    endpointslice.kubernetes.io/managed-by: apexload-controller
{{ include "apexload.labels" . | indent 4 }}
  annotations:
    apexload.io/execution-lease-owner: ""
    apexload.io/execution-lease-generation: "0"
addressType: {{ .Values.controller.ha.endpointAddressType | quote }}
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apexload-controller-active-endpoint
  namespace: {{ include "apexload.namespace" . }}
  labels:
{{ include "apexload.labels" . | indent 4 }}
rules:
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    resourceNames:
      - apexload-controller-active
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apexload-controller-active-endpoint
  namespace: {{ include "apexload.namespace" . }}
  labels:
{{ include "apexload.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName }}
    namespace: {{ include "apexload.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apexload-controller-active-endpoint
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexload-controller
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: controller
{{ include "apexload.labels" . | indent 4 }}
spec:
  replicas: {{ ternary 2 .Values.controller.replicas .Values.controller.ha.enabled }}
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-controller
        app.kubernetes.io/component: controller
{{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
{{- end }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName }}
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: apexload-controller
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: {{ include "apexload.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          env:
            - name: APEXLOAD_ENV
              value: production
            - name: APEXLOAD_ADDR
              value: ":8080"
            - name: APEXLOAD_PUBLIC_URL
              value: {{ default (printf "https://%s" .Values.ingress.host) .Values.controller.publicURL | quote }}
{{ if .Values.controller.ciOIDCAudience }}
            - name: APEXLOAD_CI_OIDC_AUDIENCE
              value: {{ .Values.controller.ciOIDCAudience | quote }}
{{ end }}
            - name: APEXLOAD_ARCHIVE_DIR
              value: /var/lib/apexload/archives
            - name: APEXLOAD_EXPORT_DIR
              value: /var/lib/apexload/exports
{{- if .Values.controller.ha.enabled }}
            - name: APEXLOAD_CONTROLLER_HA
              value: "true"
            - name: APEXLOAD_ACTIVE_ENDPOINT_SLICE
              value: apexload-controller-active
            - name: APEXLOAD_ACTIVE_ENDPOINT_SERVICE
              value: apexload-controller-active
            - name: APEXLOAD_ACTIVE_ENDPOINT_TOKEN_FILE
              value: /var/run/secrets/apexload-active-endpoint/token
            - name: APEXLOAD_ACTIVE_ENDPOINT_CA_FILE
              value: /var/run/secrets/apexload-active-endpoint/ca.crt
            - name: APEXLOAD_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APEXLOAD_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APEXLOAD_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
{{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.dataPlatform.configMapName }}
            - secretRef:
                name: {{ .Values.dataPlatform.secretName }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/apexload
            - name: grpc-tls
              mountPath: /etc/apexload/grpc-tls
              readOnly: true
{{- if .Values.controller.ha.enabled }}
            - name: active-endpoint-identity
              mountPath: /var/run/secrets/apexload-active-endpoint
              readOnly: true
{{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/system/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.controller.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.controller.scratch.tmpSizeLimit }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.controller.scratch.dataSizeLimit }}
        - name: grpc-tls
          secret:
            secretName: {{ .Values.controller.grpcTlsSecretName }}
{{- if .Values.controller.ha.enabled }}
        - name: active-endpoint-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
{{- end }}
