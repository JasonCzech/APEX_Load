{{- $upgradeValues := include "apexload.upgradeValues" . | fromJson -}}
{{- if $upgradeValues.archiveStaging.persistence.enabled }}
{{- $archiveRoot := "/var/lib/apexload/archives" }}
{{- $archiveClaim := include "apexload.archiveStagingClaimName" . }}
{{- $importRoot := clean .Values.importAssets.root }}
{{- range $protectedRoot := list $archiveRoot "/var/lib/apexload/archive-read-cache" }}
{{- if or (eq $protectedRoot $importRoot) (hasPrefix (printf "%s/" $protectedRoot) $importRoot) (hasPrefix (printf "%s/" (trimSuffix "/" $importRoot)) $protectedRoot) }}
{{- fail "archive staging and reader cache must not overlap importAssets.root" }}
{{- end }}
{{- end }}
{{- if and .Values.importAssets.persistence.enabled (eq $archiveClaim (include "apexload.importAssetsClaimName" .)) }}
{{- fail "archive staging requires a separate claim from importAssets" }}
{{- end }}
{{- if .Values.bruno.importEnabled }}
{{- $brunoRoot := clean .Values.bruno.artifactRoot }}
{{- $brunoClaim := .Values.bruno.artifactPersistence.existingClaim }}
{{- range $protectedRoot := list $archiveRoot "/var/lib/apexload/archive-read-cache" }}
{{- if or (eq $protectedRoot $brunoRoot) (hasPrefix (printf "%s/" $protectedRoot) $brunoRoot) (hasPrefix (printf "%s/" (trimSuffix "/" $brunoRoot)) $protectedRoot) (eq $archiveClaim $brunoClaim) }}
{{- fail "archive staging requires a separate path and claim from Bruno artifacts" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.controller.ha.enabled (not (has "ReadWriteMany" $upgradeValues.archiveStaging.persistence.accessModes)) }}
{{- fail "archiveStaging.persistence.accessModes must declare ReadWriteMany when controller HA is enabled, including existingClaim" }}
{{- end }}
{{- if not $upgradeValues.archiveStaging.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "apexload.archiveStagingClaimName" . }}
  namespace: {{ include "apexload.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
{{ include "apexload.labels" . | indent 4 }}
spec:
  accessModes:
{{ toYaml $upgradeValues.archiveStaging.persistence.accessModes | indent 4 }}
{{- if $upgradeValues.archiveStaging.persistence.storageClassName }}
  storageClassName: {{ $upgradeValues.archiveStaging.persistence.storageClassName | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ $upgradeValues.archiveStaging.persistence.size | quote }}
{{- end }}
{{- end }}
