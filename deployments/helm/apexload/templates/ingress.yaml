{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apexload-controller
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: ingress
{{ include "apexload.labels" . | indent 4 }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "apexload.requiredCleanValue" (list "ingress.host" .Values.ingress.host) }}
      secretName: {{ .Values.ingress.tls.secretName }}
{{- end }}
  rules:
    - host: {{ include "apexload.requiredCleanValue" (list "ingress.host" .Values.ingress.host) }}
      http:
        paths:
          - path: /api/v1/ci
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/tests
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/scenarios
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/schedules/health
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/execution-plans
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/capacity/timeslots
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/system/execution-readiness
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /api/v1/scripts/import/bruno
            pathType: Prefix
            backend:
              service:
                name: apexload-controller-active
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apexload-controller
                port:
                  name: http
{{- end }}
