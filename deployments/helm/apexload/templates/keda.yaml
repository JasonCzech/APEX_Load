{{- if .Values.keda.enabled }}
{{- if .Values.keda.azureMonitor.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Values.keda.azureMonitor.triggerAuthenticationName }}
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: autoscaling
{{ include "apexload.labels" . | indent 4 }}
spec:
  podIdentity:
    provider: azure-workload
---
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apexload-generator
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
{{ include "apexload.labels" . | indent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: apexload-generator
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 25
              periodSeconds: 300
          selectPolicy: Min
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ ternary .Values.keda.azureMonitor.serverAddress .Values.keda.prometheusServerAddress .Values.keda.azureMonitor.enabled }}
        metricName: apexload_queued_vusers
        query: sum(apexload_scaling_vusers{state="queued"})
        threshold: "5000"
        activationThreshold: "1"
{{- if .Values.keda.azureMonitor.enabled }}
      authenticationRef:
        name: {{ .Values.keda.azureMonitor.triggerAuthenticationName }}
{{- end }}
    - type: prometheus
      metadata:
        serverAddress: {{ ternary .Values.keda.azureMonitor.serverAddress .Values.keda.prometheusServerAddress .Values.keda.azureMonitor.enabled }}
        metricName: apexload_queued_browser_vusers
        query: sum(apexload_scaling_protocol_vusers{state="queued",protocol="browser"})
        threshold: "20"
        activationThreshold: "1"
{{- if .Values.keda.azureMonitor.enabled }}
      authenticationRef:
        name: {{ .Values.keda.azureMonitor.triggerAuthenticationName }}
{{- end }}
    - type: prometheus
      metadata:
        serverAddress: {{ ternary .Values.keda.azureMonitor.serverAddress .Values.keda.prometheusServerAddress .Values.keda.azureMonitor.enabled }}
        metricName: apexload_saturated_generators
        query: sum(apexload_generator_capacity_state_count{state="saturated"})
        threshold: "1"
        activationThreshold: "1"
{{- if .Values.keda.azureMonitor.enabled }}
      authenticationRef:
        name: {{ .Values.keda.azureMonitor.triggerAuthenticationName }}
{{- end }}
{{- end }}
