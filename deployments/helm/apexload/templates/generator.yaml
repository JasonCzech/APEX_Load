apiVersion: v1
kind: Service
metadata:
  name: apexload-generator
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
{{ include "apexload.labels" . | indent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: apexload-generator
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apexload-generator
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: generator
{{ include "apexload.labels" . | indent 4 }}
spec:
  serviceName: apexload-generator
  replicas: {{ .Values.generator.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexload-generator
        app.kubernetes.io/component: generator
{{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
{{- end }}
    spec:
      serviceAccountName: {{ .Values.generator.serviceAccountName }}
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
{{- with .Values.generator.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.generator.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apexload-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: {{ include "apexload.generatorImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          env:
            - name: APEXLOAD_ENV
              value: production
            - name: APEXLOAD_GRPC_TLS_CERT
              value: /etc/apexload/grpc-tls/tls.crt
            - name: APEXLOAD_GRPC_TLS_KEY
              value: /etc/apexload/grpc-tls/tls.key
            - name: APEXLOAD_GRPC_TLS_CA
              value: /etc/apexload/grpc-tls/ca.crt
            - name: APEXLOAD_GRPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataPlatform.secretName }}
                  key: APEXLOAD_GRPC_AUTH_TOKEN
            - name: APEXLOAD_AZURE_KEY_VAULT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.dataPlatform.configMapName }}
                  key: APEXLOAD_AZURE_KEY_VAULT_URL
                  optional: true
            - name: APEXLOAD_AZURE_KEY_VAULT_AUTH
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.dataPlatform.configMapName }}
                  key: APEXLOAD_AZURE_KEY_VAULT_AUTH
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: grpc-tls
              mountPath: /etc/apexload/grpc-tls
              readOnly: true
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.generator.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.generator.scratch.tmpSizeLimit }}
        - name: grpc-tls
          secret:
            secretName: {{ .Values.generator.grpcTlsSecretName }}
