{{- if .Values.networkPolicy.enabled }}
{{- $controllerAddr := trim (default ":8080" .Values.controller.addr) }}
{{- $controllerHTTPPort := regexFind "[0-9]+$" $controllerAddr }}
{{- if not $controllerHTTPPort }}
{{- fail "controller.addr must include a numeric port, for example :8080 or 127.0.0.1:8080" }}
{{- end }}
{{- $controllerHTTPPortInt := atoi $controllerHTTPPort }}
{{- if or (lt $controllerHTTPPortInt 1) (gt $controllerHTTPPortInt 65535) }}
{{- fail (printf "controller.addr port must be within 1-65535, got %s" $controllerHTTPPort) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apexload-default-deny-ingress
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload
    app.kubernetes.io/component: network-policy
{{ include "apexload.labels" . | indent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apexload-controller-ingress
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: network-policy
{{ include "apexload.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ $controllerHTTPPortInt }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apexload-controller-metrics
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-controller
    app.kubernetes.io/component: network-policy
{{ include "apexload.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apexload-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 9091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apexload-generator-ingress
  namespace: {{ include "apexload.namespace" . }}
  labels:
    app.kubernetes.io/name: apexload-generator
    app.kubernetes.io/component: network-policy
{{ include "apexload.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apexload-generator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apexload-controller
      ports:
        - protocol: TCP
          port: 9090
{{- end }}
