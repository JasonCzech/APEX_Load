name: Recording and replay E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pkg/recorder/**'
      - 'pkg/recordagent/**'
      - 'pkg/protocol/browser/**'
      - 'pkg/protocol/http/**'
      - 'pkg/protocol/*.go'
      - 'pkg/controller/**'
      - 'pkg/config/**'
      - 'pkg/dslwalk/**'
      - 'pkg/netpolicy/**'
      - 'pkg/fileasset/**'
      - 'pkg/api/**'
      - 'pkg/engine/**'
      - 'pkg/dsl/**'
      - 'pkg/convert/**'
      - 'pkg/selector/**'
      - 'pkg/scrub/**'
      - 'pkg/secretstore/**'
      - 'pkg/credential/**'
      - 'pkg/scriptdisclosure/**'
      - 'pkg/storage/**'
      - 'cmd/controller/**'
      - 'cmd/apexload-record-agent/**'
      - 'dashboard/**'
      - 'scripts/*recording*'
      - 'scripts/run-optin-suites.sh'
      - '.github/actions/upload-artifact/**'
      - 'go.mod'
      - 'go.sum'
      - '.nvmrc'
      - '.github/workflows/recording-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'pkg/recorder/**'
      - 'pkg/recordagent/**'
      - 'pkg/protocol/browser/**'
      - 'pkg/protocol/http/**'
      - 'pkg/protocol/*.go'
      - 'pkg/controller/**'
      - 'pkg/config/**'
      - 'pkg/dslwalk/**'
      - 'pkg/netpolicy/**'
      - 'pkg/fileasset/**'
      - 'pkg/api/**'
      - 'pkg/engine/**'
      - 'pkg/dsl/**'
      - 'pkg/convert/**'
      - 'pkg/selector/**'
      - 'pkg/scrub/**'
      - 'pkg/secretstore/**'
      - 'pkg/credential/**'
      - 'pkg/scriptdisclosure/**'
      - 'pkg/storage/**'
      - 'cmd/controller/**'
      - 'cmd/apexload-record-agent/**'
      - 'dashboard/**'
      - 'scripts/*recording*'
      - 'scripts/run-optin-suites.sh'
      - '.github/actions/upload-artifact/**'
      - 'go.mod'
      - 'go.sum'
      - '.nvmrc'
      - '.github/workflows/recording-e2e.yml'
  merge_group:

permissions:
  contents: read
concurrency:
  group: recording-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
env:
  GOTOOLCHAIN: local
  GOPROXY: ${{ vars.GO_MODULE_PROXY || 'https://proxy.golang.org,direct' }}
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
  PLAYWRIGHT_DOWNLOAD_HOST: ${{ vars.PLAYWRIGHT_DOWNLOAD_HOST || '' }}
jobs:
  recording:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - name: Install browsers and Xvfb on hosted runner
        if: github.server_url == 'https://github.com'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install --with-deps chromium
          dashboard/node_modules/.bin/playwright install --with-deps chromium
      - name: Install browsers from GHES mirror
        if: github.server_url != 'https://github.com'
        run: |
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install chromium
          dashboard/node_modules/.bin/playwright install chromium
          command -v xvfb-run
      - name: Validate test-only launch boundary
        run: |
          go test ./pkg/recorder/browser -run '^TestReleaseRecorderIgnores' -count=1
          go test -tags recording_e2e ./pkg/recorder/browser -run '^TestRecordingE2E' -count=1
      - name: Validate harness and evidence redaction
        run: |
          go test ./scripts -run Recording -count=1
          python3 scripts/test_recording_evidence.py
          node --test scripts/recording-report.test.mjs
      - name: Exercise real recording and replay
        run: scripts/run-recording-e2e.sh
      - name: Retain recording evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: recording-replay-evidence
          path: output/playwright/recording/
          if-no-files-found: warn
          retention-days: 14
