# Disposable, loopback-only fixture infrastructure. Credentials are synthetic.
services:
  kafka:
    image: apache/kafka@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    cpus: 2
    mem_limit: 1g
    ports: ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m
  solace:
    image: solace/solace-pubsub-standard@sha256:8e8ad105595e0aa4a136b3c030a7bb99decaf292388c90d24bfedcb97a51762b
    cpus: 2
    mem_limit: 2g
    shm_size: 1g
    ports: ["127.0.0.1:18090:8080", "127.0.0.1:15672:5672"]
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: fixture-admin
