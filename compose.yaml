services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: controller
        VERSION: ${APEXLOAD_VERSION:-local}
        COMMIT: ${APEXLOAD_COMMIT:-}
        BUILD_TIME: ${APEXLOAD_BUILD_TIME:-}
    image: apexload-controller:local
    init: true
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APEXLOAD_ADDR: "0.0.0.0:8080"
      APEXLOAD_METRICS_ADDR: ":9091"
      APEXLOAD_DB: /data/apexload.db
      APEXLOAD_ARCHIVE_DIR: /data/archives
      APEXLOAD_RECORDING_AGENT_DIST_DIR: /packages/recording-agent
      APEXLOAD_DESKTOP_DIST_DIR: /packages/desktop
      APEXLOAD_PROMETHEUS_URL: http://prometheus:9090
      APEXLOAD_GENERATORS: dns://generator:9090
      APEXLOAD_GENERATOR_DISCOVERY_INTERVAL: 10s
      APEXLOAD_GENERATOR_TIMEOUT: 5s
      APEXLOAD_ENV: local
      APEXLOAD_BRUNO_ARTIFACT_ROOT: /var/lib/apexload-bruno
      APEXLOAD_WRAPPING_MASTER_KEY: ${APEXLOAD_WRAPPING_MASTER_KEY:-apexload-local-wrapping-key-change-me}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:9091"
    volumes:
      - controller-data:/data
      - bruno-artifacts:/var/lib/apexload-bruno
      - ./dist/recording-agent:/packages/recording-agent:ro
      - ./dist/desktop:/packages/desktop:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/system/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      - generator

  generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: generator
        VERSION: ${APEXLOAD_VERSION:-local}
        COMMIT: ${APEXLOAD_COMMIT:-}
        BUILD_TIME: ${APEXLOAD_BUILD_TIME:-}
    image: apexload-generator:local
    init: true
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APEXLOAD_ENV: local
      APEXLOAD_GENERATOR_LISTEN_ADDR: ":9090"
      APEXLOAD_GENERATOR_MAX_VUSERS: "1000"
      APEXLOAD_BRUNO_DISTRIBUTED_EXECUTION_ENABLED: "true"
      APEXLOAD_BRUNO_ARTIFACT_ROOT: /var/lib/apexload-bruno
      APEXLOAD_WRAPPING_MASTER_KEY: ${APEXLOAD_WRAPPING_MASTER_KEY:-apexload-local-wrapping-key-change-me}
      APEXLOAD_BRUNO_RUNNER_URL: http://127.0.0.1:8097
      APEXLOAD_BRUNO_ALLOW_DIRECT_EGRESS: "true"
      APEXLOAD_BRUNO_MAX_JUMPS: "10000"
      APEXLOAD_BRUNO_MAX_RUN_REQUEST_DEPTH: "64"
      APEXLOAD_BRUNO_MAX_PARALLEL_REQUESTS: "100"
      APEXLOAD_BRUNO_MAX_OUTPUT_BYTES: "4194304"
      APEXLOAD_BRUNO_MAX_STREAM_TIMEOUT_MS: "60000"
      # Keep operator enablement independent from service selection. Start the
      # java-vuser profile with APEXLOAD_JAVA_VUSER_RUNNER_ENABLED=true; the
      # profile alone must not silently enable arbitrary Java execution.
      APEXLOAD_JAVA_VUSER_RUNNER_ENABLED: ${APEXLOAD_JAVA_VUSER_RUNNER_ENABLED:-false}
      APEXLOAD_JAVA_VUSER_RUNNER_MODE: sidecar
      APEXLOAD_JAVA_VUSER_RUNNER_URL: http://127.0.0.1:8098
      APEXLOAD_JAVA_VUSER_RUNNER_AUTH_TOKEN: ${APEXLOAD_JAVA_VUSER_RUNNER_AUTH_TOKEN:-}
    expose:
      - "9090"
    tmpfs:
      - /tmp
    volumes:
      - bruno-artifacts:/var/lib/apexload-bruno:ro

  bruno-runner:
    build:
      context: ./runners/bruno
      dockerfile: Dockerfile
    image: apexload-bruno-runner:local
    init: true
    restart: unless-stopped
    network_mode: service:generator
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APEXLOAD_BRUNO_RUNNER_ADDR: 127.0.0.1
      APEXLOAD_BRUNO_RUNNER_PORT: "8097"
      APEXLOAD_BRUNO_ALLOW_DIRECT_EGRESS: "true"
      APEXLOAD_BRUNO_MAX_SESSIONS: "128"
      APEXLOAD_BRUNO_MAX_PENDING_EVENTS: "10000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8097/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      - generator

  java-vuser-runner:
    profiles:
      - java-vuser
    build:
      context: .
      dockerfile: runners/java_vuser/Dockerfile
    image: apexload-java-vuser-runner:local
    init: true
    restart: unless-stopped
    network_mode: service:generator
    read_only: true
    # The stock non-privileged container has no writable cgroup v2 delegation.
    # It advertises legacy full_lifecycle only; combined persistent lifecycle
    # requires a separately governed runner described in JAVA_VUSER_RUNTIME.md.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The profile selects the process; this independent operator flag grants
      # arbitrary Java execution only when explicitly set to true.
      APEXLOAD_JAVA_VUSER_RUNNER_ENABLED: ${APEXLOAD_JAVA_VUSER_RUNNER_ENABLED:-false}
      APEXLOAD_JAVA_VUSER_RUNNER_AUTH_TOKEN: ${APEXLOAD_JAVA_VUSER_RUNNER_AUTH_TOKEN:-}
      APEXLOAD_JAVA_VUSER_RUNNER_ADDR: 127.0.0.1:8098
      APEXLOAD_JAVA_VUSER_HARNESS_JAR: /opt/apexload/java-vuser/java-vuser-runner.jar
      APEXLOAD_JAVA_VUSER_DEFAULT_JDK_HOME: /opt/java/openjdk
      APEXLOAD_JAVA_VUSER_MAX_PROCESSES: "25"
      APEXLOAD_JAVA_VUSER_WORK_DIR: /tmp
    tmpfs:
      - /tmp
    volumes:
      - ${APEXLOAD_JAVA_VUSER_ASSETS_DIR:-./runners/java_vuser/assets}:/opt/apexload/java-assets:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8098/readyz"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 20s
    depends_on:
      - generator

  prometheus:
    image: prom/prometheus:v3.12.0
    init: true
    restart: unless-stopped
    depends_on:
      - controller
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deployments/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  bruno-artifacts:
  controller-data:
  prometheus-data:
