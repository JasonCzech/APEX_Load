# APEX Load — reusable GitHub composite action.
#
# Runs a performance test with apexctl, writes a JUnit report, and fails the
# step (non-zero exit) when SLA thresholds are breached so the workflow gates on
# performance. Consumers either build apexctl from this repo (default) or point
# `apexctl-bin` at a pre-installed binary.
name: "APEX Load Performance Gate"
description: "Run an APEX Load performance test and gate the build on SLA thresholds."

inputs:
  script:
    description: "Path to the JSON DSL test script."
    required: true
  vusers:
    description: "Number of virtual users."
    required: false
    default: "50"
  duration:
    description: "Test duration (e.g. 5m, 1h)."
    required: false
    default: "5m"
  ramp-up:
    description: "Ramp-up period (e.g. 30s)."
    required: false
    default: "30s"
  api:
    description: "Controller base URL to run via the API (empty = run locally)."
    required: false
    default: ""
  base-url:
    description: "Override the scenario base URL (useful for ephemeral PR envs)."
    required: false
    default: ""
  p95-latency-ms:
    description: "Fail if P95 latency exceeds this many ms."
    required: false
    default: ""
  max-error-pct:
    description: "Fail if error rate exceeds this percentage."
    required: false
    default: ""
  junit:
    description: "Path for the JUnit XML report."
    required: false
    default: "apexload-results.xml"
  apexctl-bin:
    description: "Path to a prebuilt apexctl binary. If empty, builds from ./cmd/apexctl."
    required: false
    default: ""

outputs:
  result:
    description: "The JSON result emitted by apexctl."
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Set up Go
      if: ${{ inputs.apexctl-bin == '' }}
      uses: actions/setup-go@v5
      with:
        go-version: "1.26"

    - name: Run APEX Load performance gate
      id: run
      shell: bash
      run: |
        set -uo pipefail

        if [[ -n "${{ inputs.apexctl-bin }}" ]]; then
          apexctl=("${{ inputs.apexctl-bin }}")
        else
          apexctl=(go run ./cmd/apexctl)
        fi

        cmd=("${apexctl[@]}" run
          --script "${{ inputs.script }}"
          --vusers "${{ inputs.vusers }}"
          --duration "${{ inputs.duration }}"
          --ramp-up "${{ inputs.ramp-up }}"
          --junit "${{ inputs.junit }}"
          --format json)

        [[ -n "${{ inputs.api }}" ]]            && cmd+=(--api "${{ inputs.api }}")
        [[ -n "${{ inputs.base-url }}" ]]       && cmd+=(--base-url "${{ inputs.base-url }}")
        [[ -n "${{ inputs.p95-latency-ms }}" ]] && cmd+=(--p95-latency-ms "${{ inputs.p95-latency-ms }}")
        [[ -n "${{ inputs.max-error-pct }}" ]]  && cmd+=(--max-error-pct "${{ inputs.max-error-pct }}")

        result="$("${cmd[@]}")"
        status=$?
        echo "$result"
        {
          echo "result<<APEXEOF"
          echo "$result"
          echo "APEXEOF"
        } >> "$GITHUB_OUTPUT"
        exit $status

    - name: Publish performance test report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: apexload-results
        path: ${{ inputs.junit }}
        if-no-files-found: warn
