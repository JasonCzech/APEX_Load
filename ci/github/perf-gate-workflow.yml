# Example workflow: gate every pull request on an APEX Load performance test.
# Copy to .github/workflows/ and adjust the script path / thresholds.
name: Performance Gate

on:
  pull_request:
    branches: [main]

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run APEX Load performance gate
        uses: ./ci/github # path to the composite action (action.yml)
        with:
          script: examples/web-api/ecommerce-http.json
          vusers: "100"
          duration: "3m"
          ramp-up: "30s"
          p95-latency-ms: "800"
          max-error-pct: "2.0"
          junit: apexload-results.xml

      # Surfaces pass/fail per testcase in the PR's Checks tab.
      - name: Publish test results
        if: ${{ always() }}
        uses: dorny/test-reporter@v1
        with:
          name: APEX Load SLA
          path: apexload-results.xml
          reporter: java-junit
