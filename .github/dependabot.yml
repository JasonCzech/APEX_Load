version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      dashboard-minor-and-patch:
        update-types:
          - minor
          - patch
      # react-dom pins its react peer to the same release, so a major split
      # across two PRs cannot install on its own. Propose them together.
      react-major:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
    # @types/node tracks the Node.js line pinned in .nvmrc, not the newest
    # release. eslint 10 waits on eslint-plugin-jsx-a11y, whose peer range
    # stops at eslint 9 and which drives the accessibility lint gate.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      # React 19 is on hold. Measured on 2026-10-17, it added about 22 KiB
      # gzip to every route, past all three bundle budgets, and its dev-build
      # owner stacks made the large page suites (SettingsPage, NewTestPage,
      # ScriptEditor, TestHub) several times slower, so SettingsPage tests hit
      # the 5 s limit. Remove these four entries to take the react-major
      # group again.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - dashboard
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # The golang and node images must match go.mod and .nvmrc: CI tests with
    # go.mod's toolchain, image builds run check:node (an exact .nvmrc match),
    # and scripts/*_test.go assert the image tags. A minor or major jump is a
    # migration of all of those together, so it is not proposed here. Patch
    # and digest updates still are; a patch PR must bump go.mod or .nvmrc and
    # the image tests in the same change before it can pass.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    labels:
      - dependencies
      - containers
    cooldown:
      default-days: 7
