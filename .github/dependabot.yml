version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      dashboard-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - dashboard
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # The golang and node images must match go.mod and .nvmrc: CI tests with
    # go.mod's toolchain, image builds run check:node (an exact .nvmrc match),
    # and scripts/*_test.go assert the image tags. A minor or major jump is a
    # migration of all of those together, so it is not proposed here. Patch
    # and digest updates still are; a patch PR must bump go.mod or .nvmrc and
    # the image tests in the same change before it can pass.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    labels:
      - dependencies
      - containers
    cooldown:
      default-days: 7
