name: Protected Protocol Integration

on:
  schedule:
    - cron: "0 5 * * 0"
  repository_dispatch:
    types:
      - protocol-integration

permissions:
  contents: read

concurrency:
  group: protected-protocol-integration
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: ${{ vars.GO_MODULE_PROXY || 'https://proxy.golang.org,direct' }}

jobs:
  live-protocol:
    name: Live ${{ matrix.profile }} integration
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.PROTOCOL_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    environment: protocol-integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: solace
            tags: jms_solace_real,jms_solace_integration
            package: ./pkg/protocol/jms
          - profile: servicebus
            tags: jms_servicebus_real,jms_servicebus_integration
            package: ./pkg/protocol/jms
          - profile: kafka
            tags: kafka_real,kafka_integration
            package: ./pkg/protocol/kafka
          - profile: eventhubs
            tags: eventhubs_real
            package: ./pkg/protocol/eventhubs
    steps:
      - name: Validate trusted scheduled or manual trigger
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          TRIGGER_ACTION: ${{ github.event.action }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER_REF" == refs/heads/main && "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'protected protocol integration must run from the protected default branch' >&2
            exit 1
          }
          case "$TRIGGER_EVENT" in
            schedule)
              [[ -z "$TRIGGER_ACTION" ]]
              jq -e '. == null' <<< "$CLIENT_PAYLOAD" >/dev/null
              ;;
            repository_dispatch)
              [[ "$TRIGGER_ACTION" == protocol-integration ]]
              jq -e 'type == "object" and keys == []' <<< "$CLIENT_PAYLOAD" >/dev/null || {
                echo 'protocol-integration does not accept client payload fields' >&2
                exit 1
              }
              ;;
            *)
              echo "unsupported protected protocol integration trigger: $TRIGGER_EVENT" >&2
              exit 1
              ;;
          esac

      - name: Checkout immutable protected-main integration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify protected integration configuration
        env:
          PROFILE: ${{ matrix.profile }}
          SOLACE_AMQP_URL: ${{ secrets.SOLACE_AMQP_URL }}
          SOLACE_QUEUE: ${{ secrets.SOLACE_QUEUE }}
          SERVICEBUS_CONNECTION_STRING: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          SERVICEBUS_QUEUE: ${{ secrets.SERVICEBUS_QUEUE }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}
          EVENTHUBS_CONNECTION_STRING: ${{ secrets.EVENTHUBS_CONNECTION_STRING }}
          EVENTHUBS_EVENT_HUB: ${{ secrets.EVENTHUBS_EVENT_HUB }}
        run: |
          set -euo pipefail
          case "${PROFILE}" in
            solace) required=(SOLACE_AMQP_URL SOLACE_QUEUE) ;;
            servicebus) required=(SERVICEBUS_CONNECTION_STRING SERVICEBUS_QUEUE) ;;
            kafka) required=(KAFKA_BROKERS KAFKA_TOPIC) ;;
            eventhubs) required=(EVENTHUBS_CONNECTION_STRING EVENTHUBS_EVENT_HUB) ;;
            *) echo "unsupported integration profile: ${PROFILE}" >&2; exit 2 ;;
          esac
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "required protected environment secret is missing: ${variable}" >&2
              exit 1
            fi
          done

      - name: Run live protocol round trip
        env:
          BUILD_TAGS: ${{ matrix.tags }}
          TEST_PACKAGE: ${{ matrix.package }}
          SOLACE_AMQP_URL: ${{ secrets.SOLACE_AMQP_URL }}
          SOLACE_USERNAME: ${{ secrets.SOLACE_USERNAME }}
          SOLACE_PASSWORD: ${{ secrets.SOLACE_PASSWORD }}
          SOLACE_VPN: ${{ secrets.SOLACE_VPN }}
          SOLACE_QUEUE: ${{ secrets.SOLACE_QUEUE }}
          SERVICEBUS_CONNECTION_STRING: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          SERVICEBUS_QUEUE: ${{ secrets.SERVICEBUS_QUEUE }}
          SERVICEBUS_TOPIC: ${{ secrets.SERVICEBUS_TOPIC }}
          SERVICEBUS_SUBSCRIPTION: ${{ secrets.SERVICEBUS_SUBSCRIPTION }}
          SERVICEBUS_REPLY_QUEUE: ${{ secrets.SERVICEBUS_REPLY_QUEUE }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}
          EVENTHUBS_CONNECTION_STRING: ${{ secrets.EVENTHUBS_CONNECTION_STRING }}
          EVENTHUBS_EVENT_HUB: ${{ secrets.EVENTHUBS_EVENT_HUB }}
          EVENTHUBS_PARTITION_ID: ${{ secrets.EVENTHUBS_PARTITION_ID }}
        run: go test -count=1 -timeout=20m -tags "${BUILD_TAGS}" "${TEST_PACKAGE}"
