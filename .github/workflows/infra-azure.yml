name: Azure Infrastructure

on:
  repository_dispatch:
    types:
      - azure-infra-plan
      - azure-infra-apply

permissions:
  contents: read

concurrency:
  group: azure-infra-${{ github.event.client_payload.environment == 'production' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  plan:
    name: Plan ${{ github.event.client_payload.environment }} infrastructure
    if: github.event.action == 'azure-infra-plan'
    runs-on: ${{ fromJSON(vars.AZURE_INFRA_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 60
    environment: ${{ github.event.client_payload.environment == 'production' && 'azure-infra-production' || 'azure-infra-staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate trusted plan dispatch
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          DISPATCH_ACTION: ${{ github.event.action }}
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ github.event.client_payload.environment }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_EVENT" == repository_dispatch &&
             "$DISPATCH_ACTION" == azure-infra-plan &&
             "$DISPATCH_REF" == refs/heads/main &&
             "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Terraform plan dispatch must originate from the protected default branch' >&2
            exit 1
          }
          jq -e '
            type == "object" and
            keys == ["environment"] and
            (.environment == "staging" or .environment == "production")
          ' <<< "$CLIENT_PAYLOAD" >/dev/null || {
            echo 'azure-infra-plan accepts exactly one environment field: staging or production' >&2
            exit 1
          }
          [[ "$TARGET_ENVIRONMENT" == staging || "$TARGET_ENVIRONMENT" == production ]]

      - name: Checkout immutable protected-main plan revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Terraform
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Verify exact Terraform version
        run: terraform version -json | jq -e '.terraform_version == "1.15.8"' >/dev/null

      - name: Authenticate with plan-only environment identity
        if: vars.AZURE_AUTH_MODE != 'managed-identity'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_TERRAFORM_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate plan through Azure managed identity for private GHES
        if: vars.AZURE_AUTH_MODE == 'managed-identity'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          auth-type: IDENTITY
          client-id: ${{ vars.AZURE_TERRAFORM_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Materialize protected backend and variable configuration
        env:
          BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG_HCL }}
          TFVARS: ${{ secrets.TF_VARS_HCL }}
        run: |
          set -euo pipefail
          [[ -n "$BACKEND_CONFIG" && -n "$TFVARS" ]]
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          umask 077
          printf '%s\n' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          printf '%s\n' "$TFVARS" > "$RUNNER_TEMP/environment.tfvars"

      - name: Initialize and validate
        run: |
          set -euo pipefail
          terraform -chdir=deployments/azure/terraform fmt -check -diff
          terraform -chdir=deployments/azure/terraform init \
            -lockfile=readonly \
            -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform -chdir=deployments/azure/terraform validate

      - name: Create saved plan
        id: plan
        env:
          TF_PLAN: ${{ runner.temp }}/apexload.tfplan
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=deployments/azure/terraform plan \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var-file="$RUNNER_TEMP/environment.tfvars" \
            -out="$TF_PLAN"
          status=$?
          set -e
          case "$status" in
            0) printf 'has-changes=false\n' >> "$GITHUB_OUTPUT" ;;
            2) printf 'has-changes=true\n' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
          terraform -chdir=deployments/azure/terraform show -json "$TF_PLAN" \
            | jq -e '.format_version and .terraform_version' >/dev/null

      - name: Encrypt and authenticate the exact saved plan for a later apply run
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
          TARGET_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLAN_RUN_ID: ${{ github.run_id }}
          PLAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_AUTH_MODE: ${{ vars.AZURE_AUTH_MODE }}
          AZURE_PLAN_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_PLAN_CLIENT_ID }}
          AZURE_APPLY_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_APPLY_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ ${#PLAN_ENCRYPTION_KEY} -ge 32 ]]
          auth_mode="${AZURE_AUTH_MODE:-oidc}"
          umask 077
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/apexload.tfplan" \
            -out "$RUNNER_TEMP/apexload.tfplan.enc" \
            -pass env:PLAN_ENCRYPTION_KEY
          python3 scripts/deploy/terraform-plan-handoff.py create \
            --environment "$TARGET_ENVIRONMENT" \
            --repository "$REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --run-id "$PLAN_RUN_ID" \
            --run-attempt "$PLAN_RUN_ATTEMPT" \
            --terraform-version 1.15.8 \
            --azure-tenant-id "$AZURE_TENANT_ID" \
            --azure-subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --azure-auth-mode "$auth_mode" \
            --azure-plan-client-id "$AZURE_PLAN_CLIENT_ID" \
            --azure-apply-client-id "$AZURE_APPLY_CLIENT_ID" \
            --backend-config "$RUNNER_TEMP/backend.hcl" \
            --plan "$RUNNER_TEMP/apexload.tfplan" \
            --encrypted "$RUNNER_TEMP/apexload.tfplan.enc" \
            --output "$RUNNER_TEMP/plan-handoff"
          {
            printf '### Terraform saved-plan handoff\n\n'
            printf -- "- Environment: \`%s\`\n" "$TARGET_ENVIRONMENT"
            printf -- "- Plan run: \`%s\` attempt \`%s\`\n" "$PLAN_RUN_ID" "$PLAN_RUN_ATTEMPT"
            printf -- "- Dispatch \`azure-infra-apply\` with those exact identifiers.\n"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted plan handoff
        uses: ./.github/actions/upload-artifact
        with:
          name: terraform-${{ github.event.client_payload.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-handoff/
          if-no-files-found: error
          retention-days: 7

      - name: Remove Terraform plan credentials and plaintext
        if: always()
        run: |
          set +e
          rm -f \
            "$RUNNER_TEMP/backend.hcl" \
            "$RUNNER_TEMP/environment.tfvars" \
            "$RUNNER_TEMP/apexload.tfplan" \
            "$RUNNER_TEMP/apexload.tfplan.enc" \
            "$RUNNER_TEMP/apexload-plan.json"
          file_status=$?
          rm -rf "$RUNNER_TEMP/plan-handoff" deployments/azure/terraform/.terraform
          directory_status=$?
          find deployments/azure/terraform -maxdepth 1 -type f \
            \( -name 'errored.tfstate' -o -name 'terraform.tfstate' -o -name 'terraform.tfstate.*' \
               -o -name '.terraform.tfstate.lock.info' -o -name 'crash.log' -o -name 'crash.*.log' \
               -o -name '*.tfplan' \) -delete
          residue_status=$?
          set -e
          (( file_status == 0 && directory_status == 0 && residue_status == 0 ))

  apply:
    name: Apply independently approved saved plan
    if: github.event.action == 'azure-infra-apply'
    runs-on: ${{ fromJSON(vars.AZURE_INFRA_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 90
    environment: ${{ github.event.client_payload.environment == 'production' && 'azure-infra-production' || 'azure-infra-staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Validate trusted apply dispatch
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          DISPATCH_ACTION: ${{ github.event.action }}
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          PLAN_RUN_ID: ${{ github.event.client_payload.plan_run_id }}
          PLAN_RUN_ATTEMPT: ${{ github.event.client_payload.plan_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_EVENT" == repository_dispatch &&
             "$DISPATCH_ACTION" == azure-infra-apply &&
             "$DISPATCH_REF" == refs/heads/main &&
             "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Terraform apply dispatch must originate from the protected default branch' >&2
            exit 1
          }
          jq -e '
            type == "object" and
            keys == ["environment", "plan_run_attempt", "plan_run_id"] and
            (.environment == "staging" or .environment == "production") and
            ((.plan_run_id | type) == "string") and
            (.plan_run_id | test("^[1-9][0-9]*$")) and
            ((.plan_run_attempt | type) == "string") and
            (.plan_run_attempt | test("^[1-9][0-9]*$"))
          ' <<< "$CLIENT_PAYLOAD" >/dev/null || {
            echo 'azure-infra-apply requires exactly environment, plan_run_id, and plan_run_attempt' >&2
            exit 1
          }
          [[ "$TARGET_ENVIRONMENT" == staging || "$TARGET_ENVIRONMENT" == production ]]
          [[ "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ && "$PLAN_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout immutable protected-main handoff verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and authenticate exact prior plan artifact
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          PLAN_RUN_ID: ${{ github.event.client_payload.plan_run_id }}
          PLAN_RUN_ATTEMPT: ${{ github.event.client_payload.plan_run_attempt }}
          PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
          REPOSITORY: ${{ github.repository }}
          BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG_HCL }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_AUTH_MODE: ${{ vars.AZURE_AUTH_MODE }}
          AZURE_PLAN_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_PLAN_CLIENT_ID }}
          AZURE_APPLY_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_APPLY_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$BACKEND_CONFIG" ]]
          auth_mode="${AZURE_AUTH_MODE:-oidc}"
          umask 077
          printf '%s\n' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          export GH_HOST="${server_url#https://}"
          if [[ "$GH_HOST" != github.com ]]; then
            export GH_ENTERPRISE_TOKEN="$GH_TOKEN"
          fi
          workflow_run="$(gh api "repos/${REPOSITORY}/actions/runs/${PLAN_RUN_ID}/attempts/${PLAN_RUN_ATTEMPT}")"
          jq -e \
            --arg commit "$(jq -r '.head_sha' <<< "$workflow_run")" \
            --argjson attempt "$PLAN_RUN_ATTEMPT" '
            .event == "repository_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == $attempt and
            .head_branch == "main" and
            (.path == ".github/workflows/infra-azure.yml" or
             .path == ".github/workflows/infra-azure.yml@main") and
            (.head_sha == $commit and ($commit | test("^[0-9a-f]{40}$")))
          ' <<< "$workflow_run" >/dev/null || {
            echo 'selected plan run is not a successful protected-main infrastructure plan' >&2
            exit 1
          }
          workflow_jobs="$(gh api "repos/${REPOSITORY}/actions/runs/${PLAN_RUN_ID}/attempts/${PLAN_RUN_ATTEMPT}/jobs?per_page=100")"
          jq -e --arg expected_name "Plan ${TARGET_ENVIRONMENT} infrastructure" '
            [.jobs[] | select(
              .name == $expected_name and
              .status == "completed" and
              .conclusion == "success"
            )] | length == 1
          ' <<< "$workflow_jobs" >/dev/null || {
            echo 'selected workflow attempt did not execute the expected plan-only environment job' >&2
            exit 1
          }
          artifact="terraform-${TARGET_ENVIRONMENT}-${PLAN_RUN_ID}-${PLAN_RUN_ATTEMPT}"
          mkdir -p "$RUNNER_TEMP/plan-handoff"
          gh run download "$PLAN_RUN_ID" --repo "$REPOSITORY" \
            --name "$artifact" --dir "$RUNNER_TEMP/plan-handoff"
          source_commit="$(python3 scripts/deploy/terraform-plan-handoff.py verify \
            --environment "$TARGET_ENVIRONMENT" \
            --repository "$REPOSITORY" \
            --run-id "$PLAN_RUN_ID" \
            --run-attempt "$PLAN_RUN_ATTEMPT" \
            --azure-tenant-id "$AZURE_TENANT_ID" \
            --azure-subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --azure-auth-mode "$auth_mode" \
            --azure-plan-client-id "$AZURE_PLAN_CLIENT_ID" \
            --azure-apply-client-id "$AZURE_APPLY_CLIENT_ID" \
            --backend-config "$RUNNER_TEMP/backend.hcl" \
            --directory "$RUNNER_TEMP/plan-handoff")"
          [[ "$source_commit" == "$(jq -r '.head_sha' <<< "$workflow_run")" ]] || {
            echo 'authenticated plan commit does not match the selected workflow run' >&2
            exit 1
          }
          printf 'source-commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact planned infrastructure revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.handoff.outputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the planned commit to remain in protected main history
        env:
          PLANNED_COMMIT: ${{ steps.handoff.outputs.source-commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PLANNED_COMMIT" ]]
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          export GH_HOST="${server_url#https://}"
          if [[ "$GH_HOST" != github.com ]]; then
            export GH_ENTERPRISE_TOKEN="$GH_TOKEN"
          fi
          comparison="$(gh api "repos/${REPOSITORY}/compare/${PLANNED_COMMIT}...main")"
          jq -e --arg planned "$PLANNED_COMMIT" '
            (.status == "ahead" or .status == "identical") and
            .base_commit.sha == $planned
          ' <<< "$comparison" >/dev/null || {
            echo 'the planned commit is no longer in protected main history' >&2
            exit 1
          }

      - name: Setup pinned Terraform
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Verify exact Terraform version
        run: terraform version -json | jq -e '.terraform_version == "1.15.8"' >/dev/null

      - name: Authenticate with apply-only environment identity
        if: vars.AZURE_AUTH_MODE != 'managed-identity'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_TERRAFORM_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate apply through Azure managed identity for private GHES
        if: vars.AZURE_AUTH_MODE == 'managed-identity'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          auth-type: IDENTITY
          client-id: ${{ vars.AZURE_TERRAFORM_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Decrypt and verify saved plan
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$RUNNER_TEMP/plan-handoff/apexload.tfplan.enc" \
            -out "$RUNNER_TEMP/apexload.tfplan" \
            -pass env:PLAN_ENCRYPTION_KEY
          expected="$(jq -er '.plan_sha256' "$RUNNER_TEMP/plan-handoff/plan-handoff.json")"
          actual="$(sha256sum "$RUNNER_TEMP/apexload.tfplan" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          terraform -chdir=deployments/azure/terraform init \
            -lockfile=readonly \
            -backend-config="$RUNNER_TEMP/backend.hcl"

      - name: Apply only the reviewed saved plan
        run: terraform -chdir=deployments/azure/terraform apply -auto-approve -lock-timeout=5m "$RUNNER_TEMP/apexload.tfplan"

      - name: Remove decrypted Terraform plan and backend credentials
        if: always()
        run: |
          set +e
          rm -f "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/apexload.tfplan"
          file_status=$?
          rm -rf "$RUNNER_TEMP/plan-handoff" deployments/azure/terraform/.terraform
          directory_status=$?
          find deployments/azure/terraform -maxdepth 1 -type f \
            \( -name 'errored.tfstate' -o -name 'terraform.tfstate' -o -name 'terraform.tfstate.*' \
               -o -name '.terraform.tfstate.lock.info' -o -name 'crash.log' -o -name 'crash.*.log' \
               -o -name '*.tfplan' \) -delete
          residue_status=$?
          set -e
          (( file_status == 0 && directory_status == 0 && residue_status == 0 ))
