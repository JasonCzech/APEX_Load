name: Build Client Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'dashboard/**'
      - 'pkg/api/static/**'
      - 'pkg/api/server.go'
      - 'cmd/apexload-record-agent/**'
      - 'pkg/recordagent/**'
      - 'scripts/package-desktop.sh'
      - 'scripts/package-recording-agent.sh'
      - 'scripts/package_desktop_test.go'
      - 'scripts/package_recording_agent_test.go'
      - 'scripts/build-desktop-local.sh'
      - 'scripts/resolve-version.sh'
      - 'docs/recording-agent.md'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

env:
  GOTOOLCHAIN: local
  GOPROXY: ${{ vars.GO_MODULE_PROXY || 'https://proxy.golang.org,direct' }}
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop package (${{ matrix.name }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64
            artifact: apexload-desktop-linux-amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: apexload-desktop-linux-arm64
          - name: macOS Apple Silicon
            os: macos-latest
            platform: darwin/arm64
            artifact: apexload-desktop-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin/amd64
            artifact: apexload-desktop-macos-amd64
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            artifact: apexload-desktop-windows-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Install Wails CLI
        # Pinned for reproducibility; keep in sync with scripts/build-desktop-local.sh.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        # Newer Ubuntu images ship webkit2gtk-4.1; fall back to 4.0 on older ones.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Resolve friendly build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_VERSION=$(COMMIT="${GITHUB_SHA}" BUILD_TIME="${BUILD_TIME}" ./scripts/resolve-version.sh)
          echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Import macOS Developer ID certificate
        if: startsWith(matrix.platform, 'darwin/') && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.APEXLOAD_MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]]; then
            echo "No macOS signing certificate configured; desktop package will be unsigned."
            exit 0
          fi
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-apexload-ci-keychain}"
          cert_path="${RUNNER_TEMP}/apexload-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/apexload-signing.keychain-db"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

      - name: Configure macOS notarization profile
        if: startsWith(matrix.platform, 'darwin/') && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          MACOS_NOTARY_PROFILE: ${{ secrets.APEXLOAD_MACOS_NOTARY_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.APEXLOAD_MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_NOTARY_PROFILE}" ]]; then
            echo "No notarytool profile configured; package script can still use direct Apple ID credentials if provided."
            exit 0
          fi
          if [[ -z "${MACOS_NOTARY_APPLE_ID}" || -z "${MACOS_NOTARY_PASSWORD}" || -z "${MACOS_NOTARY_TEAM_ID}" ]]; then
            echo "APEXLOAD_MACOS_NOTARY_PROFILE requires APEXLOAD_MACOS_NOTARY_APPLE_ID, APEXLOAD_MACOS_NOTARY_PASSWORD, and APEXLOAD_MACOS_NOTARY_TEAM_ID." >&2
            exit 1
          fi
          xcrun notarytool store-credentials "${MACOS_NOTARY_PROFILE}" \
            --apple-id "${MACOS_NOTARY_APPLE_ID}" \
            --team-id "${MACOS_NOTARY_TEAM_ID}" \
            --password "${MACOS_NOTARY_PASSWORD}"

      - name: Prepare Windows Authenticode certificate
        if: startsWith(matrix.platform, 'windows/') && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) {
            Write-Host "No Windows signing certificate configured; desktop package will be unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "apexload-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          "APEXLOAD_WINDOWS_CODESIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APEXLOAD_WINDOWS_CODESIGN_TOOL=signtool" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APEXLOAD_WINDOWS_CODESIGN_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem $kitRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($signtool) {
            $drive = $signtool.FullName.Substring(0, 1).ToLowerInvariant()
            $rest = $signtool.FullName.Substring(2).Replace('\', '/')
            "APEXLOAD_WINDOWS_SIGNTOOL=/$drive$rest" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Import GPG checksum signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APEXLOAD_GPG_PRIVATE_KEY }}
          GPG_SIGNING_KEY: ${{ secrets.APEXLOAD_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "No GPG signing key configured; checksum manifest will not be detached-signed."
            exit 0
          fi
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          echo "APEXLOAD_CHECKSUM_SIGN=1" >> "$GITHUB_ENV"
          if [[ -n "${GPG_SIGNING_KEY}" ]]; then
            echo "APEXLOAD_CHECKSUM_SIGN_KEY=${GPG_SIGNING_KEY}" >> "$GITHUB_ENV"
          fi

      - name: Build Wails App
        shell: bash
        env:
          WAILS_PLATFORM: ${{ matrix.platform }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
        run: |
          set -euo pipefail
          BI=github.com/jasonczech/apexload/pkg/buildinfo
          cd desktop
          wails build -clean -platform "${WAILS_PLATFORM}" -ldflags "-s -w -X ${BI}.Version=${BUILD_VERSION} -X ${BI}.Commit=${GITHUB_SHA} -X ${BI}.BuildTime=${BUILD_TIME}"

      - name: Package Desktop App
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          APEXLOAD_DESKTOP_PACKAGE_PLATFORM: ${{ matrix.platform }}
          APEXLOAD_MACOS_CODESIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APEXLOAD_MACOS_CODESIGN_IDENTITY || '' }}
          APEXLOAD_MACOS_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || vars.APEXLOAD_MACOS_NOTARIZE }}
          APEXLOAD_REQUIRE_TRUSTED_PACKAGES: ${{ startsWith(github.ref, 'refs/tags/') && '1' || vars.APEXLOAD_REQUIRE_TRUSTED_PACKAGES }}
          APEXLOAD_MACOS_NOTARY_PROFILE: ${{ secrets.APEXLOAD_MACOS_NOTARY_PROFILE }}
          APEXLOAD_MACOS_NOTARY_APPLE_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_APPLE_ID }}
          APEXLOAD_MACOS_NOTARY_PASSWORD: ${{ secrets.APEXLOAD_MACOS_NOTARY_PASSWORD }}
          APEXLOAD_MACOS_NOTARY_TEAM_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_TEAM_ID }}
          APEXLOAD_WINDOWS_CODESIGN_PASSWORD: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PASSWORD }}
        run: ./scripts/package-desktop.sh

      - name: Upload Desktop Package
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact }}
          path: dist/desktop/*

  recording-agent:
    name: Recording Agent packages
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve friendly build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_VERSION=$(COMMIT="${GITHUB_SHA}" BUILD_TIME="${BUILD_TIME}" ./scripts/resolve-version.sh)
          echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Import macOS Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.APEXLOAD_MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]]; then
            echo "No macOS signing certificate configured; Darwin agent packages will be unsigned."
            exit 0
          fi
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-apexload-ci-keychain}"
          cert_path="${RUNNER_TEMP}/apexload-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/apexload-signing.keychain-db"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${cert_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

      - name: Configure macOS notarization profile
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          MACOS_NOTARY_PROFILE: ${{ secrets.APEXLOAD_MACOS_NOTARY_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.APEXLOAD_MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_NOTARY_PROFILE}" ]]; then
            echo "No notarytool profile configured; package script can still use direct Apple ID credentials if provided."
            exit 0
          fi
          if [[ -z "${MACOS_NOTARY_APPLE_ID}" || -z "${MACOS_NOTARY_PASSWORD}" || -z "${MACOS_NOTARY_TEAM_ID}" ]]; then
            echo "APEXLOAD_MACOS_NOTARY_PROFILE requires APEXLOAD_MACOS_NOTARY_APPLE_ID, APEXLOAD_MACOS_NOTARY_PASSWORD, and APEXLOAD_MACOS_NOTARY_TEAM_ID." >&2
            exit 1
          fi
          xcrun notarytool store-credentials "${MACOS_NOTARY_PROFILE}" \
            --apple-id "${MACOS_NOTARY_APPLE_ID}" \
            --team-id "${MACOS_NOTARY_TEAM_ID}" \
            --password "${MACOS_NOTARY_PASSWORD}"

      - name: Prepare Windows Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${WINDOWS_CODESIGN_PFX_BASE64}" ]]; then
            echo "No Windows signing certificate configured; Windows agent package will be unsigned."
            exit 0
          fi
          brew install osslsigncode
          cert_path="${RUNNER_TEMP}/apexload-windows-codesign.pfx"
          printf '%s' "${WINDOWS_CODESIGN_PFX_BASE64}" | base64 --decode > "${cert_path}"
          {
            echo "APEXLOAD_WINDOWS_CODESIGN=1"
            echo "APEXLOAD_WINDOWS_CODESIGN_TOOL=osslsigncode"
          } >> "$GITHUB_ENV"
          echo "APEXLOAD_WINDOWS_CODESIGN_CERT_PATH=${cert_path}" >> "$GITHUB_ENV"

      - name: Import GPG checksum signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APEXLOAD_GPG_PRIVATE_KEY }}
          GPG_SIGNING_KEY: ${{ secrets.APEXLOAD_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "No GPG signing key configured; checksum manifest will not be detached-signed."
            exit 0
          fi
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          echo "APEXLOAD_CHECKSUM_SIGN=1" >> "$GITHUB_ENV"
          if [[ -n "${GPG_SIGNING_KEY}" ]]; then
            echo "APEXLOAD_CHECKSUM_SIGN_KEY=${GPG_SIGNING_KEY}" >> "$GITHUB_ENV"
          fi

      - name: Package Recording Agent
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          APEXLOAD_MACOS_CODESIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APEXLOAD_MACOS_CODESIGN_IDENTITY || '' }}
          APEXLOAD_MACOS_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || vars.APEXLOAD_MACOS_NOTARIZE }}
          APEXLOAD_REQUIRE_TRUSTED_PACKAGES: ${{ startsWith(github.ref, 'refs/tags/') && '1' || vars.APEXLOAD_REQUIRE_TRUSTED_PACKAGES }}
          APEXLOAD_MACOS_NOTARY_PROFILE: ${{ secrets.APEXLOAD_MACOS_NOTARY_PROFILE }}
          APEXLOAD_MACOS_NOTARY_APPLE_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_APPLE_ID }}
          APEXLOAD_MACOS_NOTARY_PASSWORD: ${{ secrets.APEXLOAD_MACOS_NOTARY_PASSWORD }}
          APEXLOAD_MACOS_NOTARY_TEAM_ID: ${{ secrets.APEXLOAD_MACOS_NOTARY_TEAM_ID }}
          APEXLOAD_WINDOWS_CODESIGN_PASSWORD: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PASSWORD }}
        run: ./scripts/package-recording-agent.sh

      - name: Upload Recording Agent Packages
        uses: ./.github/actions/upload-artifact
        with:
          name: apexload-recording-agent-packages
          path: dist/recording-agent/*
