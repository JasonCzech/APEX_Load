name: Flake hunt

# Repeated runs of the Go suite to surface non-deterministic tests before they
# surface themselves in someone's PR.
#
# Why this exists: the main CI lane runs each test once (-count=1). FLAKE-1
# (docs/qa/FLAKE_LOG.md) failed 2 runs in 5 and would never have been caught by a
# single-run gate — it was found by accident, and the log that diagnosed it was
# very nearly deleted. This job makes that discovery systematic.
#
# It is deliberately NOT a PR gate. It reports; it does not block. A flake-finder
# wired into the merge path teaches people to re-run until green, which is the
# opposite of what it is for.

on:
  schedule:
    # 04:00 UTC daily, off the weekday-morning peak the security lane uses.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Repetitions per test'
        required: false
        default: '5'
      packages:
        description: 'Packages to hunt (default: the whole module)'
        required: false
        default: './...'
      playwright-count:
        description: 'Playwright suite repetitions'
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: Repeated Go suite
    runs-on: ubuntu-latest
    # Generous: -count=5 over the module is several times a normal run, and
    # pkg/api alone takes 4-5 minutes for a single pass.
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Hunt
        # No continue-on-error and no recorded exit code: the script runs under
        # `set -uo pipefail` without `-e` and ends with a successful command, so
        # it cannot fail the job. Whether a flake was seen is decided by the
        # Summarize step reading the log, which is the single source of truth.
        env:
          COUNT_INPUT: ${{ github.event.inputs.count || '5' }}
          PACKAGES_INPUT: ${{ github.event.inputs.packages || './...' }}
        run: |
          set -uo pipefail
          mkdir -p flake-results
          COUNT="$COUNT_INPUT"
          PKGS="$PACKAGES_INPUT"
          read -r -a pkg_args <<< "$PKGS"
          echo "Running $PKGS with -count=$COUNT -shuffle=on -race"
          # No pipefail-driven early exit: a failure here is the finding, not an
          # error, and the log must be preserved either way.
          go test "${pkg_args[@]}" -race -shuffle=on -count="$COUNT" -timeout=170m \
            > flake-results/flake-hunt.log 2>&1 || true

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail
          log=flake-results/flake-hunt.log
          [ -f "$log" ] || { echo "no log produced"; exit 0; }
          {
            echo "## Flake hunt"
            echo
            if grep -qE '^(--- FAIL|FAIL)' "$log"; then
              echo "**Non-deterministic or failing tests observed.**"
              echo
              echo '```'
              grep -E '^--- FAIL' "$log" | sort | uniq -c | sort -rn | head -40
              echo '```'
              echo
              echo "Record each in \`docs/qa/FLAKE_LOG.md\` with a root cause and a"
              echo "dated un-quarantine commitment. Do not simply re-run."
            else
              echo "No failures across the repetitions. 🟢"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flake evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: flake-hunt-log
          path: flake-results/
          if-no-files-found: warn
          retention-days: 14

  browser-hunt:
    name: Repeated Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build dashboard
        run: |
          npm --prefix dashboard ci --ignore-scripts
          npm --prefix dashboard run build
          (cd dashboard && ./node_modules/.bin/playwright install --with-deps chromium)

      - name: Hunt browser flakes
        env:
          PLAYWRIGHT_COUNT_INPUT: ${{ github.event.inputs['playwright-count'] || '3' }}
        run: |
          set -uo pipefail
          mkdir -p flake-results
          count="$PLAYWRIGHT_COUNT_INPUT"
          status=0
          for iteration in $(seq 1 "$count"); do
            echo "=== Playwright repetition $iteration/$count ===" >> flake-results/playwright.log
            APEXLOAD_E2E_PORT="$((18100 + iteration))" scripts/run-e2e.sh \
              >> flake-results/playwright.log 2>&1 || status=1
            APEXLOAD_E2E_PROFILE=local-auth APEXLOAD_E2E_PORT="$((18200 + iteration))" \
              scripts/run-e2e.sh tier0-local-auth.spec.ts \
              >> flake-results/playwright.log 2>&1 || status=1
          done
          echo "$status" > flake-results/playwright-status

      - name: Summarize browser hunt
        if: always()
        run: |
          status="$(cat flake-results/playwright-status 2>/dev/null || echo 1)"
          if [[ "$status" == "0" ]]; then
            echo "## Playwright flake hunt: no failures" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Playwright flake hunt: failures observed" >> "$GITHUB_STEP_SUMMARY"
            echo "Log the first unexplained failure; fix or quarantine after the second occurrence." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser flake evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-flake-hunt-log
          path: flake-results/
          if-no-files-found: warn
          retention-days: 14
