name: Flake hunt

# Repeated runs of the Go suite to surface non-deterministic tests before they
# surface themselves in someone's PR.
#
# Why this exists: the main CI lane runs each test once (-count=1). FLAKE-1
# (docs/qa/FLAKE_LOG.md) failed 2 runs in 5 and would never have been caught by a
# single-run gate — it was found by accident, and the log that diagnosed it was
# very nearly deleted. This job makes that discovery systematic.
#
# It is deliberately NOT a PR gate. It reports; it does not block. A flake-finder
# wired into the merge path teaches people to re-run until green, which is the
# opposite of what it is for.

on:
  schedule:
    # 04:00 UTC daily, off the weekday-morning peak the security lane uses.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Repetitions per test'
        required: false
        default: '5'
      packages:
        description: 'Packages to hunt (default: the whole module)'
        required: false
        default: './...'

permissions:
  contents: read

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: Repeated Go suite
    runs-on: ubuntu-latest
    # Generous: -count=5 over the module is several times a normal run, and
    # pkg/api alone takes 4-5 minutes for a single pass.
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Hunt
        # No continue-on-error and no recorded exit code: the script runs under
        # `set -uo pipefail` without `-e` and ends with a successful command, so
        # it cannot fail the job. Whether a flake was seen is decided by the
        # Summarize step reading the log, which is the single source of truth.
        run: |
          set -uo pipefail
          mkdir -p flake-results
          COUNT="${{ github.event.inputs.count || '5' }}"
          PKGS="${{ github.event.inputs.packages || './...' }}"
          echo "Running $PKGS with -count=$COUNT -shuffle=on -race"
          # No pipefail-driven early exit: a failure here is the finding, not an
          # error, and the log must be preserved either way.
          go test $PKGS -race -shuffle=on -count="$COUNT" -timeout=170m \
            > flake-results/flake-hunt.log 2>&1 || true

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail
          log=flake-results/flake-hunt.log
          [ -f "$log" ] || { echo "no log produced"; exit 0; }
          {
            echo "## Flake hunt"
            echo
            if grep -qE '^(--- FAIL|FAIL)' "$log"; then
              echo "**Non-deterministic or failing tests observed.**"
              echo
              echo '```'
              grep -E '^--- FAIL' "$log" | sort | uniq -c | sort -rn | head -40
              echo '```'
              echo
              echo "Record each in \`docs/qa/FLAKE_LOG.md\` with a root cause and a"
              echo "dated un-quarantine commitment. Do not simply re-run."
            else
              echo "No failures across the repetitions. 🟢"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flake evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: flake-hunt-log
          path: flake-results/
          if-no-files-found: warn
          retention-days: 14
