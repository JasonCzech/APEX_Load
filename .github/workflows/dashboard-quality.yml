name: Dashboard quality

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-quality.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-quality.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Lint, test, and bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Lint
        run: npm run lint
      - name: Accessibility regression gate
        run: npm run lint:a11y
      - name: Unit tests
        run: npm test
      - name: Bundle checker tests
        run: npm run test:bundle-budget
      - name: Route and aggregate bundle budgets
        run: npm run bundle:check
