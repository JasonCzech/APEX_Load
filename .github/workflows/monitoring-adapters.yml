name: Restricted monitoring adapters
on:
  pull_request:
    paths: ['pkg/collectoragent/**', 'runners/monitor-java/**', '.github/workflows/monitoring-adapters.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Package helper and verify authenticated TLS JMX
        run: |
          make monitor-java-helper
          make test-monitor-java
      - name: Upload monitoring helper
        uses: ./.github/actions/upload-artifact
        with:
          name: apexload-monitor-helper
          path: bin/apexload-monitor-helper.jar
          if-no-files-found: error
          retention-days: 14
