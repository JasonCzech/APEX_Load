name: Restricted monitoring adapters
on:
  pull_request:
    paths: ['pkg/collectoragent/**', 'runners/monitor-java/**', '.github/workflows/monitoring-adapters.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Package helper and verify authenticated TLS JMX
        run: |
          make monitor-java-helper
          make test-monitor-java
      - name: Upload monitoring helper
        uses: ./.github/actions/upload-artifact
        with:
          name: apexload-monitor-helper
          path: bin/apexload-monitor-helper.jar
          if-no-files-found: error
          retention-days: 14
