name: Restricted monitoring adapters
on:
  pull_request:
    paths: ['pkg/collectoragent/**', 'runners/monitor-java/**', '.github/workflows/monitoring-adapters.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Package helper and verify authenticated TLS JMX
        run: |
          make monitor-java-helper
          make test-monitor-java
      - uses: actions/upload-artifact@v4
        with:
          name: apexload-monitor-helper
          path: bin/apexload-monitor-helper.jar
