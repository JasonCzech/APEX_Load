name: Release

on:
  repository_dispatch:
    types:
      - apexload-release

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: ${{ vars.GO_MODULE_PROXY || 'https://proxy.golang.org,direct' }}
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}

jobs:
  verify-tag:
    name: Verify protected signed release tag
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.verified.outputs.tag }}
      tag-object: ${{ steps.verified.outputs.tag-object }}
      commit: ${{ steps.verified.outputs.commit }}
    steps:
      - name: Checkout trusted verification tooling from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify the exact remote annotated tag
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.release }}
          REPOSITORY: ${{ github.repository }}
          APEXLOAD_RELEASE_TAG_PUBLIC_KEYS: ${{ vars.APEXLOAD_RELEASE_TAG_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          ./scripts/release/semver.sh tag "$RELEASE_TAG"
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          release_tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          ./scripts/release/verify-tag.sh "$RELEASE_TAG" "$release_commit"

          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          export GH_HOST="${server_url#https://}"
          if [[ "$GH_HOST" != github.com ]]; then
            export GH_ENTERPRISE_TOKEN="$GH_TOKEN"
          fi
          remote_ref="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          remote_tag_object="$(jq -er 'select(.object.type == "tag") | .object.sha' <<< "$remote_ref")"
          [[ "$remote_tag_object" == "$release_tag_object" ]] || {
            echo 'remote annotated release tag changed during verification' >&2
            exit 1
          }
          remote_tag="$(gh api "repos/${REPOSITORY}/git/tags/${remote_tag_object}")"
          remote_commit="$(jq -er 'select(.object.type == "commit") | .object.sha' <<< "$remote_tag")"
          [[ "$remote_commit" == "$release_commit" ]] || {
            echo 'remote annotated release tag does not resolve to the verified commit' >&2
            exit 1
          }
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'tag-object=%s\n' "$release_tag_object"
            printf 'commit=%s\n' "$release_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Require the canonical action to pin this apexctl
        env:
          RELEASE_TAG: ${{ steps.verified.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.verified.outputs.commit }}
        run: |
          set -euo pipefail
          pinned="$(git show "${RELEASE_COMMIT}:.github/actions/apexload-run/apexctl-version" | tr -d '[:space:]')"
          [[ "$pinned" == "$RELEASE_TAG" ]] || {
            printf 'canonical action pins %s, but release tag is %s\n' "$pinned" "$RELEASE_TAG" >&2
            exit 1
          }

  ci:
    name: Authoritative CI
    needs: verify-tag
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.verify-tag.outputs.commit }}

  metadata:
    name: Freeze release metadata
    needs: [ci, verify-tag]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      tag-object: ${{ steps.metadata.outputs.tag-object }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      build-time: ${{ steps.metadata.outputs.build-time }}
      source-epoch: ${{ steps.metadata.outputs.source-epoch }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute metadata once
        id: metadata
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.verify-tag.outputs.tag-object }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          build_time="$(date --utc --date="@${source_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'tag-object=%s\n' "$RELEASE_TAG_OBJECT"
            printf 'version=%s\n' "${RELEASE_TAG#v}"
            printf 'commit=%s\n' "$RELEASE_COMMIT"
            printf 'source-epoch=%s\n' "$source_epoch"
            printf 'build-time=%s\n' "$build_time"
          } >> "$GITHUB_OUTPUT"

  registry-credentials:
    name: Validate registry and portable signing identities
    needs: metadata
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    environment: registry-release
    steps:
      - name: Checkout the protected action release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Fail closed on missing release identities
        env:
          CHECKSUM_PRIVATE_KEY_PRESENT: ${{ secrets.APEXLOAD_RELEASE_SIGNING_KEY_PEM != '' }}
          CHECKSUM_SIGNER_PATH: ${{ vars.APEXLOAD_RELEASE_SIGNER_PATH }}
          CHECKSUM_PUBLIC_KEY: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          COSIGN_PRIVATE_KEY_PRESENT: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          COSIGN_PASSWORD_PRESENT: ${{ secrets.COSIGN_PASSWORD != '' }}
          COSIGN_KEY_REF: ${{ vars.COSIGN_KEY_REF }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
          RELEASE_REGISTRY: ${{ vars.APEXLOAD_RELEASE_REGISTRY || 'ghcr.io' }}
          RELEASE_REGISTRY_USERNAME: ${{ vars.APEXLOAD_RELEASE_REGISTRY_USERNAME }}
          RELEASE_REGISTRY_PASSWORD: ${{ secrets.APEXLOAD_RELEASE_REGISTRY_PASSWORD }}
          GITHUB_SERVER: ${{ github.server_url }}
          HOSTED_ATTESTATIONS_ENABLED: ${{ vars.APEXLOAD_ENABLE_HOSTED_ATTESTATIONS }}
          HOSTED_ATTESTATIONS_TOKEN_PRESENT: ${{ secrets.APEXLOAD_GITHUB_ATTESTATIONS_TOKEN != '' }}
          MOVING_TAG_PRIVATE_KEY_PRESENT: ${{ secrets.APEXLOAD_RELEASE_TAG_PRIVATE_KEY != '' }}
          MOVING_TAG_SIGNING_KEY_ID: ${{ vars.APEXLOAD_RELEASE_TAG_SIGNING_KEY_ID }}
          MOVING_TAG_SIGNER_MODE: ${{ vars.APEXLOAD_RELEASE_TAG_SIGNER_MODE }}
          MOVING_TAG_GNUPGHOME: ${{ vars.APEXLOAD_RELEASE_TAG_GNUPGHOME }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          for variable in CHECKSUM_PUBLIC_KEY COSIGN_PUBLIC_KEY; do
            [[ -n "${!variable}" ]] || {
              printf '%s must be configured for a production release\n' "$variable" >&2
              exit 1
            }
          done
          if [[ -n "$CHECKSUM_SIGNER_PATH" ]]; then
            [[ "$CHECKSUM_SIGNER_PATH" == /* && -x "$CHECKSUM_SIGNER_PATH" ]] || {
              echo 'APEXLOAD_RELEASE_SIGNER_PATH must be an executable absolute path on the protected runner' >&2
              exit 1
            }
            [[ "$CHECKSUM_PRIVATE_KEY_PRESENT" != true ]] || {
              echo 'do not configure APEXLOAD_RELEASE_SIGNING_KEY_PEM in external signer mode' >&2
              exit 1
            }
          else
            [[ "$CHECKSUM_PRIVATE_KEY_PRESENT" == true ]] || {
              echo 'APEXLOAD_RELEASE_SIGNER_PATH or APEXLOAD_RELEASE_SIGNING_KEY_PEM is required' >&2
              exit 1
            }
          fi
          if [[ -n "$COSIGN_KEY_REF" ]]; then
            [[ "$COSIGN_PRIVATE_KEY_PRESENT" != true && "$COSIGN_PASSWORD_PRESENT" != true ]] || {
              echo 'do not configure COSIGN_PRIVATE_KEY or COSIGN_PASSWORD in KMS/HSM mode' >&2
              exit 1
            }
          else
            [[ "$COSIGN_PRIVATE_KEY_PRESENT" == true && "$COSIGN_PASSWORD_PRESENT" == true ]] || {
              echo 'COSIGN_KEY_REF or COSIGN_PRIVATE_KEY/COSIGN_PASSWORD is required' >&2
              exit 1
            }
          fi
          if [[ "$GITHUB_SERVER" != https://github.com || "$RELEASE_REGISTRY" != ghcr.io ]]; then
            [[ -n "$RELEASE_REGISTRY_USERNAME" && -n "$RELEASE_REGISTRY_PASSWORD" ]] || {
              echo 'custom/GHES release registries require APEXLOAD_RELEASE_REGISTRY_USERNAME and APEXLOAD_RELEASE_REGISTRY_PASSWORD' >&2
              exit 1
            }
          fi
          if [[ "$HOSTED_ATTESTATIONS_ENABLED" == true ]]; then
            [[ "$GITHUB_SERVER" == https://github.com ]] || {
              echo 'hosted GitHub attestations may only be enabled on GitHub.com' >&2
              exit 1
            }
            [[ "$HOSTED_ATTESTATIONS_TOKEN_PRESENT" == true ]] || {
              echo 'APEXLOAD_GITHUB_ATTESTATIONS_TOKEN is required when hosted attestations are enabled' >&2
              exit 1
            }
          fi
          if [[ "$RELEASE_TAG" =~ ^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            [[ -n "$MOVING_TAG_SIGNING_KEY_ID" ]] || {
              echo 'stable v1 releases require the moving-tag signing key ID' >&2
              exit 1
            }
            if [[ "$MOVING_TAG_SIGNER_MODE" == preinstalled ]]; then
              [[ "$MOVING_TAG_PRIVATE_KEY_PRESENT" != true ]] || {
                echo 'do not expose a moving-tag private key in preinstalled signer mode' >&2
                exit 1
              }
              [[ "$MOVING_TAG_GNUPGHOME" == /* && -d "$MOVING_TAG_GNUPGHOME" ]] || {
                echo 'preinstalled signer mode requires an absolute APEXLOAD_RELEASE_TAG_GNUPGHOME' >&2
                exit 1
              }
              export GNUPGHOME="$MOVING_TAG_GNUPGHOME"
              gpg --batch --list-secret-keys "$MOVING_TAG_SIGNING_KEY_ID" >/dev/null 2>&1 || {
                echo 'moving-tag signing key ID does not select the configured private key' >&2
                exit 1
              }
            else
              [[ "$MOVING_TAG_PRIVATE_KEY_PRESENT" == true ]] || {
                echo 'moving-tag private key is required unless signer mode is preinstalled' >&2
                exit 1
              }
            fi
          fi

      - name: Verify software moving-tag key identity
        if: ${{ !contains(needs.metadata.outputs.tag, '-') && startsWith(needs.metadata.outputs.tag, 'v1.') && vars.APEXLOAD_RELEASE_TAG_SIGNER_MODE != 'preinstalled' }}
        env:
          MOVING_TAG_PRIVATE_KEY: ${{ secrets.APEXLOAD_RELEASE_TAG_PRIVATE_KEY }}
          MOVING_TAG_SIGNING_KEY_ID: ${{ vars.APEXLOAD_RELEASE_TAG_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          gnupg_home="$(mktemp -d)"
          trap 'rm -rf "$gnupg_home"' EXIT
          chmod 0700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf '%s' "$MOVING_TAG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1
          gpg --batch --list-secret-keys "$MOVING_TAG_SIGNING_KEY_ID" >/dev/null 2>&1

      - name: Verify release public-key trust configuration
        env:
          CHECKSUM_PUBLIC_KEY: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          bundled_key=.github/actions/apexload-run/release-signing-key.pem
          umask 077
          trap 'rm -f "$RUNNER_TEMP/configured.der" "$RUNNER_TEMP/bundled.der" "$RUNNER_TEMP/configured-release-signing.pub"' EXIT
          printf '%s' "$CHECKSUM_PUBLIC_KEY" > "$RUNNER_TEMP/configured-release-signing.pub"
          openssl pkey -pubin -in "$RUNNER_TEMP/configured-release-signing.pub" -outform DER \
            > "$RUNNER_TEMP/configured.der"
          [[ -s "$bundled_key" ]] || {
            echo 'canonical action releases must bundle release-signing-key.pem before publishing any semantic action release' >&2
            exit 1
          }
          openssl pkey -pubin -in "$bundled_key" -outform DER \
            > "$RUNNER_TEMP/bundled.der"
          cmp "$RUNNER_TEMP/configured.der" "$RUNNER_TEMP/bundled.der"

      - name: Verify software release signing key matches public trust
        if: vars.APEXLOAD_RELEASE_SIGNER_PATH == ''
        env:
          CHECKSUM_PRIVATE_KEY: ${{ secrets.APEXLOAD_RELEASE_SIGNING_KEY_PEM }}
          CHECKSUM_PUBLIC_KEY: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release-signing.key" "$RUNNER_TEMP/private-derived.der" "$RUNNER_TEMP/configured.der" "$RUNNER_TEMP/configured-release-signing.pub"' EXIT
          printf '%s' "$CHECKSUM_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing.key"
          printf '%s' "$CHECKSUM_PUBLIC_KEY" > "$RUNNER_TEMP/configured-release-signing.pub"
          openssl pkey -in "$RUNNER_TEMP/release-signing.key" -pubout -outform DER \
            > "$RUNNER_TEMP/private-derived.der"
          openssl pkey -pubin -in "$RUNNER_TEMP/configured-release-signing.pub" -outform DER \
            > "$RUNNER_TEMP/configured.der"
          cmp "$RUNNER_TEMP/private-derived.der" "$RUNNER_TEMP/configured.der"

  client-credentials:
    name: Validate client signing identities
    needs: metadata
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    environment: client-release
    steps:
      - name: Fail closed on missing macOS and Windows credentials
        env:
          MACOS_P12_PRESENT: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_P12_BASE64 != '' }}
          MACOS_P12_PASSWORD_PRESENT: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_PASSWORD != '' }}
          MACOS_IDENTITY_PRESENT: ${{ secrets.APEXLOAD_MACOS_CODESIGN_IDENTITY != '' }}
          MACOS_NOTARY_KEY_PRESENT: ${{ secrets.APEXLOAD_MACOS_NOTARY_KEY_P8_BASE64 != '' }}
          MACOS_NOTARY_KEY_ID_PRESENT: ${{ vars.APEXLOAD_MACOS_NOTARY_KEY_ID != '' }}
          MACOS_NOTARY_ISSUER_ID_PRESENT: ${{ vars.APEXLOAD_MACOS_NOTARY_ISSUER_ID != '' }}
          WINDOWS_PFX_PRESENT: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PFX_BASE64 != '' }}
          WINDOWS_PFX_PASSWORD_PRESENT: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for variable in MACOS_P12_PRESENT MACOS_P12_PASSWORD_PRESENT MACOS_IDENTITY_PRESENT MACOS_NOTARY_KEY_PRESENT MACOS_NOTARY_KEY_ID_PRESENT MACOS_NOTARY_ISSUER_ID_PRESENT WINDOWS_PFX_PRESENT WINDOWS_PFX_PASSWORD_PRESENT; do
            [[ "${!variable}" == true ]] || {
              printf '%s must be configured for a production release\n' "$variable" >&2
              exit 1
            }
          done

  draft:
    name: Reserve immutable draft Release
    needs: [metadata, registry-credentials, client-credentials]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    environment: registry-release
    permissions:
      contents: write
    steps:
      - name: Create empty draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          export GH_HOST="${server_url#https://}"
          if [[ "$GH_HOST" != github.com ]]; then
            export GH_ENTERPRISE_TOKEN="$GH_TOKEN"
          fi
          if [[ "$GH_HOST" == github.com ]]; then
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPOSITORY}/immutable-releases" \
              | jq -e '.enabled == true' >/dev/null || {
                echo 'enable GitHub immutable releases before reserving a production draft' >&2
                exit 1
              }
          fi
          marker="<!-- apexload-release:${REPOSITORY}:${RELEASE_TAG}:${RELEASE_COMMIT} -->"
          if existing="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" \
            --json isDraft,tagName,body 2>/dev/null)"; then
            jq -e --arg tag "$RELEASE_TAG" --arg marker "$marker" \
              '.isDraft == true and .tagName == $tag and .body == $marker' \
              <<< "$existing" >/dev/null || {
                printf 'release %s already exists but is not this workflow\x27s reusable draft\n' "$RELEASE_TAG" >&2
                exit 1
              }
            printf 'reusing authenticated draft Release %s; downstream publication will verify every existing asset\n' "$RELEASE_TAG"
            exit 0
          fi
          args=(release create "$RELEASE_TAG" --repo "$REPOSITORY" --draft --verify-tag --notes "$marker" --title "APEX Load ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

  core-assets:
    name: Build portable binaries, server tools, App Service, and Helm
    needs: [metadata, draft]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Helm
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.21.3

      - name: Verify exact Helm version
        run: test "$(helm version --template '{{.Version}}')" = v3.21.3

      - name: Build embedded dashboard
        working-directory: dashboard
        run: |
          set -euo pipefail
          npm run check:node
          npm ci --ignore-scripts
          npm run build

      - name: Build release assets once
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source-epoch }}
          APEXLOAD_BUILD_APEXCTL: "0"
        run: ./scripts/release/build-artifacts.sh release/assets "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_BUILD_TIME"

      - name: Verify App Service launcher
        working-directory: deployments/azure/appservice
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test

      - name: Upload core release assets
        uses: ./.github/actions/upload-artifact
        with:
          name: release-core-assets
          path: release/assets/
          if-no-files-found: error
          retention-days: 7

  clients:
    name: Signed desktop client (${{ matrix.name }})
    needs: [metadata, draft, client-credentials]
    runs-on: ${{ fromJSON(vars[matrix.runner_var] || matrix.default_runner) }}
    timeout-minutes: 120
    environment: client-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            runner_var: RELEASE_LINUX_AMD64_RUNNER_LABELS
            default_runner: '["ubuntu-24.04"]'
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            runner_var: RELEASE_LINUX_ARM64_RUNNER_LABELS
            default_runner: '["ubuntu-24.04-arm"]'
          - name: macos-amd64
            os: macos-15-intel
            platform: darwin/amd64
            runner_var: RELEASE_MACOS_AMD64_RUNNER_LABELS
            default_runner: '["macos-15-intel"]'
          - name: macos-arm64
            os: macos-15
            platform: darwin/arm64
            runner_var: RELEASE_MACOS_ARM64_RUNNER_LABELS
            default_runner: '["macos-15"]'
          - name: windows-amd64
            os: windows-2025
            platform: windows/amd64
            runner_var: RELEASE_WINDOWS_AMD64_RUNNER_LABELS
            default_runner: '["windows-2025"]'
    steps:
      - name: Checkout release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Install Wails
        shell: bash
        run: |
          set -euo pipefail
          WAILS_VERSION="$(tr -d '[:space:]' < desktop/.wails-version)"
          [[ "$WAILS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install checksum-pinned NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APEXLOAD_USE_PREINSTALLED_TOOLS: ${{ vars.APEXLOAD_USE_PREINSTALLED_TOOLS }}
          NSIS_RELEASE_BASE_URL: ${{ vars.NSIS_RELEASE_BASE_URL }}
          NSIS_ARCHIVE_PATH: ${{ vars.NSIS_ARCHIVE_PATH }}
        run: |
          & ./scripts/ci/install-nsis.ps1

      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && vars.RELEASE_PREBAKED_NATIVE_DEPS != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils shared-mime-info xdg-utils

      - name: Prepare Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.APEXLOAD_WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CERT_STORE: APEXLoadRelease-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        run: |
          $ErrorActionPreference = "Stop"
          $certPath = Join-Path $env:RUNNER_TEMP "apexload-release.pfx"
          $storeMarker = Join-Path $env:RUNNER_TEMP "apexload-windows-cert-store.txt"
          if ($env:WINDOWS_CERT_STORE -notmatch '^APEXLoadRelease-[A-Za-z0-9-]+$') {
            throw "invalid isolated certificate store name"
          }
          [IO.File]::WriteAllText($storeMarker, $env:WINDOWS_CERT_STORE)
          $storePath = "Cert:\CurrentUser\$env:WINDOWS_CERT_STORE"
          $isolatedStore = [Security.Cryptography.X509Certificates.X509Store]::new(
            $env:WINDOWS_CERT_STORE,
            [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
          )
          $isolatedStore.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $isolatedStore.Close()
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_PFX))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $importedCertificates = Import-PfxCertificate `
            -FilePath $certPath `
            -CertStoreLocation $storePath `
            -Password $securePassword `
            -ErrorAction Stop
          $privateCertificates = @($importedCertificates | Where-Object { $_.HasPrivateKey })
          if ($privateCertificates.Count -ne 1) {
            throw "the PFX must contain exactly one Authenticode certificate with a private key"
          }
          $certificate = $privateCertificates[0]
          "APEXLOAD_WINDOWS_CODESIGN_SHA1=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APEXLOAD_WINDOWS_CODESIGN_STORE=$env:WINDOWS_CERT_STORE" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APEXLOAD_WINDOWS_CODESIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APEXLOAD_WINDOWS_CODESIGN_TOOL=signtool" | Out-File -FilePath $env:GITHUB_ENV -Append
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem $kitRoot -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          $drive = $signTool.FullName.Substring(0, 1).ToLowerInvariant()
          $rest = $signTool.FullName.Substring(2).Replace('\', '/')
          "APEXLOAD_WINDOWS_SIGNTOOL=/$drive$rest" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -Force $certPath

      - name: Build native desktop client
        shell: bash
        env:
          WAILS_PLATFORM: ${{ matrix.platform }}
          WAILS_BUILD_TAGS: ${{ runner.os == 'Linux' && 'webkit2_41' || '' }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}" COMMIT="${RELEASE_COMMIT}" BUILD_TIME="${RELEASE_BUILD_TIME}" \
            ./scripts/build-desktop-local.sh
          grep -R -F -- "${RELEASE_VERSION}" pkg/api/static/assets/*.js >/dev/null

      - name: Verify macOS desktop metadata
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          expected="${RELEASE_VERSION%%[-+]*}"
          plist="desktop/build/bin/apexload.app/Contents/Info.plist"
          [[ "$(plutil -extract CFBundleShortVersionString raw "$plist")" == "$expected" ]]
          [[ "$(plutil -extract NSHighResolutionCapable raw "$plist")" == "true" ]]
          declared_floor="$(plutil -extract LSMinimumSystemVersion raw "$plist")"
          binary_floor="$(otool -l desktop/build/bin/apexload.app/Contents/MacOS/apexload | awk '/minos/{print $2; exit}')"
          [[ "$declared_floor" == "$binary_floor" ]]

      - name: Verify Windows desktop metadata and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = ($env:RELEASE_VERSION -split '[-+]')[0]
          function ConvertTo-FourPartVersion([string] $value) {
            try { $parsed = [version]$value.Trim() } catch { throw "invalid Windows product version '$value'" }
            if ($parsed.Build -lt 0) { throw "Windows product version '$value' does not contain major.minor.patch" }
            $revision = if ($parsed.Revision -lt 0) { 0 } else { $parsed.Revision }
            return "$($parsed.Major).$($parsed.Minor).$($parsed.Build).$revision"
          }
          $expectedWindowsVersion = ConvertTo-FourPartVersion "$expected.0"
          $app = Get-Item "desktop/build/bin/apexload.exe"
          $actualAppVersion = ConvertTo-FourPartVersion $app.VersionInfo.ProductVersion
          if ($actualAppVersion -ne $expectedWindowsVersion) {
            throw "desktop ProductVersion '$actualAppVersion' does not equal '$expectedWindowsVersion'"
          }
          $installers = @(Get-ChildItem "desktop/build/bin" -Filter "*-installer.exe")
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          $actualInstallerVersion = ConvertTo-FourPartVersion $installers[0].VersionInfo.ProductVersion
          if ($actualInstallerVersion -ne $expectedWindowsVersion) {
            throw "installer ProductVersion '$actualInstallerVersion' does not equal '$expectedWindowsVersion'"
          }
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\APEX Load"
          try {
            $process = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "installer exited with $($process.ExitCode)" }
            foreach ($installedBinary in @((Join-Path $installDir "apexload.exe"), (Join-Path $installDir "uninstall.exe"))) {
              if (-not (Test-Path $installedBinary)) { throw "installed signed binary is missing: $installedBinary" }
              $signature = Get-AuthenticodeSignature $installedBinary
              if ($signature.Status -ne "Valid") { throw "invalid Authenticode signature on $installedBinary`: $($signature.Status)" }
              if ($signature.SignerCertificate.Thumbprint -ne $env:APEXLOAD_WINDOWS_CODESIGN_SHA1) {
                throw "unexpected signer on $installedBinary"
              }
            }
          } finally {
            $uninstaller = Join-Path $installDir "uninstall.exe"
            if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait }
          }

      - name: Build platform apexctl
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
        run: |
          set -euo pipefail
          goos="${TARGET_PLATFORM%/*}"
          goarch="${TARGET_PLATFORM#*/}"
          suffix=""
          [[ "$goos" == windows ]] && suffix=.exe
          mkdir -p release/assets
          bi=github.com/jasonczech/apexload/pkg/buildinfo
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
            -ldflags "-s -w -X ${bi}.Version=${RELEASE_VERSION} -X ${bi}.Commit=${RELEASE_COMMIT} -X ${bi}.BuildTime=${RELEASE_BUILD_TIME}" \
            -o "release/assets/apexctl_${RELEASE_VERSION}_${goos}_${goarch}${suffix}" \
            ./cmd/apexctl

      # Import release credentials only after all npm/Vite/Wails/Go build steps
      # have produced and verified the unsigned macOS payloads. This keeps
      # private signing and notarization keys out of dependency build code.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APEXLOAD_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.APEXLOAD_MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.APEXLOAD_MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/apexload-release.p12"
          certificate_pem="$RUNNER_TEMP/apexload-release.pem"
          notary_key="$RUNNER_TEMP/apexload-notary-key.p8"
          keychain="$RUNNER_TEMP/apexload-release.keychain-db"
          original_keychains="$RUNNER_TEMP/apexload-original-keychains.txt"
          security list-keychains -d user > "$original_keychains"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$notary_key"
          openssl pkcs12 \
            -in "$certificate" \
            -nodes \
            -passin env:CERTIFICATE_PASSWORD \
            -out "$certificate_pem" >/dev/null
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate_pem" \
            -k "$keychain" \
            -t agg \
            -f pemseq \
            -x \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          keychains=("$keychain")
          while IFS= read -r existing; do
            existing="${existing#*\"}"
            existing="${existing%\"*}"
            [[ -n "$existing" ]] && keychains+=("$existing")
          done < "$original_keychains"
          security list-keychains -d user -s "${keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_IDENTITY"
          printf 'APEXLOAD_MACOS_NOTARY_KEY_PATH=%s\n' "$notary_key" >> "$GITHUB_ENV"
          rm -f "$certificate" "$certificate_pem"

      - name: Sign and notarize macOS apexctl
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          MACOS_IDENTITY: ${{ secrets.APEXLOAD_MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ vars.APEXLOAD_MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APEXLOAD_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          goarch="${TARGET_PLATFORM#*/}"
          binary="release/assets/apexctl_${RELEASE_VERSION}_darwin_${goarch}"
          codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/apexctl-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/apexctl-notary.zip" \
            --wait \
            --timeout 30m \
            --key "$APEXLOAD_MACOS_NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"

      - name: Sign Windows apexctl
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $binary = "release/assets/apexctl_$($env:RELEASE_VERSION)_windows_amd64.exe"
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem $kitRoot -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /s $env:APEXLOAD_WINDOWS_CODESIGN_STORE /sha1 $env:APEXLOAD_WINDOWS_CODESIGN_SHA1 $binary
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          & $signTool.FullName verify /pa /all $binary
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }

      - name: Package Linux desktop client
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
          APEXLOAD_DESKTOP_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/package-desktop.sh

      - name: Sign, notarize, and package macOS desktop client
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
          APEXLOAD_DESKTOP_PACKAGE_PLATFORM: ${{ matrix.platform }}
          APEXLOAD_MACOS_CODESIGN_IDENTITY: ${{ secrets.APEXLOAD_MACOS_CODESIGN_IDENTITY }}
          APEXLOAD_MACOS_NOTARIZE: "1"
          APEXLOAD_MACOS_NOTARY_KEY_ID: ${{ vars.APEXLOAD_MACOS_NOTARY_KEY_ID }}
          APEXLOAD_MACOS_NOTARY_ISSUER_ID: ${{ vars.APEXLOAD_MACOS_NOTARY_ISSUER_ID }}
          # Native signing/notarization is mandatory in this protected lane.
          # Portable integrity is supplied by the outer signed release manifest,
          # so the package-local GPG checksum signature is intentionally optional.
        run: ./scripts/package-desktop.sh

      - name: Sign and package Windows desktop client
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
          APEXLOAD_DESKTOP_PACKAGE_PLATFORM: ${{ matrix.platform }}
          # Authenticode is mandatory here; the outer release manifest supplies
          # the portable checksum signature after every client artifact is built.
        run: ./scripts/package-desktop.sh

      - name: Remove macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          original_keychains="$RUNNER_TEMP/apexload-original-keychains.txt"
          if [[ -s "$original_keychains" ]]; then
            keychains=()
            while IFS= read -r existing; do
              existing="${existing#*\"}"
              existing="${existing%\"*}"
              [[ -n "$existing" ]] && keychains+=("$existing")
            done < "$original_keychains"
            if (( ${#keychains[@]} > 0 )); then
              security list-keychains -d user -s "${keychains[@]}"
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/apexload-release.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/apexload-release.p12" \
            "$RUNNER_TEMP/apexload-release.pem" \
            "$RUNNER_TEMP/apexload-notary-key.p8" \
            "$RUNNER_TEMP/apexload-original-keychains.txt" \
            "$RUNNER_TEMP/apexctl-notary.zip"

      - name: Remove Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\apexload-release.pfx"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\apexload-nsis-3.10"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\apexload-nsis-3.10.zip"
          $storeMarker = Join-Path $env:RUNNER_TEMP "apexload-windows-cert-store.txt"
          if (Test-Path -LiteralPath $storeMarker) {
            $storeName = (Get-Content -LiteralPath $storeMarker -Raw).Trim()
            if ($storeName -match '^APEXLoadRelease-[A-Za-z0-9-]+$') {
              $storePath = "Cert:\CurrentUser\$storeName"
              if (Test-Path -LiteralPath $storePath) {
                Get-ChildItem -LiteralPath $storePath | ForEach-Object {
                  Remove-Item -LiteralPath $_.PSPath -DeleteKey -Force -ErrorAction Stop
                }
                Remove-Item -LiteralPath $storePath -Force -ErrorAction Stop
              }
            }
            Remove-Item -Force -ErrorAction SilentlyContinue $storeMarker
          }

      - name: Upload signed desktop client
        uses: ./.github/actions/upload-artifact
        with:
          name: release-client-${{ matrix.name }}
          path: |
            dist/desktop/apexload-desktop-*.tar.gz
            dist/desktop/apexload-desktop-*.deb
            release/assets/apexctl_*
          if-no-files-found: error
          retention-days: 7

  images:
    name: Image (${{ matrix.component }}, ${{ matrix.profile }})
    needs: [metadata, draft, registry-credentials]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 90
    environment: registry-release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            profile: standard
            dockerfile: Dockerfile
            binary: controller
          - component: controller
            profile: enterprise
            dockerfile: Dockerfile
            binary: controller
          - component: generator
            profile: standard
            dockerfile: Dockerfile
            binary: generator
          - component: generator
            profile: enterprise
            dockerfile: Dockerfile
            binary: generator
          - component: java-vuser-runner
            profile: standard
            dockerfile: runners/java_vuser/Dockerfile
            binary: apexload-java-vuser-runner
    steps:
      - name: Checkout release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Install pinned cross-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: ${{ runner.arch == 'ARM64' && 'amd64' || 'arm64' }}
          cache-image: false

      - name: Install checksum-pinned Buildx
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        env:
          BUILDX_RELEASE_BASE_URL: ${{ vars.BUILDX_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/apexload-docker-config"
          ./scripts/ci/install-buildx.sh "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Authenticate to release container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ vars.APEXLOAD_RELEASE_REGISTRY || 'ghcr.io' }}
          username: ${{ vars.APEXLOAD_RELEASE_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.APEXLOAD_RELEASE_REGISTRY_PASSWORD || github.token }}

      - name: Validate immutable BuildKit image
        env:
          BUILDKIT_IMAGE: ${{ vars.APEXLOAD_BUILDKIT_IMAGE || 'docker.io/moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a' }}
        run: ./scripts/ci/verify-buildx-toolchain.sh image "$BUILDKIT_IMAGE"

      - name: Create pinned multi-platform builder
        env:
          BUILDER_NAME: apexload-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}-${{ matrix.profile }}
          BUILDKIT_IMAGE: ${{ vars.APEXLOAD_BUILDKIT_IMAGE || 'docker.io/moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a' }}
        run: |
          set -euo pipefail
          ./scripts/ci/verify-buildx-toolchain.sh binary
          docker buildx create \
            --name "$BUILDER_NAME" \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use \
            --bootstrap

      - name: Verify exact Buildx and BuildKit toolchain
        env:
          BUILDER_NAME: apexload-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}-${{ matrix.profile }}
          BUILDKIT_IMAGE: ${{ vars.APEXLOAD_BUILDKIT_IMAGE || 'docker.io/moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a' }}
        run: ./scripts/ci/verify-buildx-toolchain.sh builder "$BUILDER_NAME" "$BUILDKIT_IMAGE"

      - name: Install cosign
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Verify exact cosign version
        run: cosign version 2>&1 | grep -Eq 'GitVersion:[[:space:]]+v3\.1\.1([[:space:]]|$)'

      - name: Derive immutable image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_REGISTRY: ${{ vars.APEXLOAD_RELEASE_REGISTRY || 'ghcr.io' }}
          RELEASE_REGISTRY_NAMESPACE: ${{ vars.APEXLOAD_RELEASE_REGISTRY_NAMESPACE }}
          COMPONENT: ${{ matrix.component }}
          PROFILE: ${{ matrix.profile }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          namespace="${RELEASE_REGISTRY_NAMESPACE:-$OWNER}"
          namespace="$(printf '%s' "$namespace" | tr '[:upper:]' '[:lower:]')"
          [[ "$RELEASE_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$namespace" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          repository="${RELEASE_REGISTRY}/${namespace}/apexload-${COMPONENT}"
          tag="${repository}:${RELEASE_TAG}-${PROFILE}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tag_state="$(./scripts/release/registry-reference-state.sh docker-buildx "$tag")"
          if [[ "$tag_state" == present ]]; then
            printf 'candidate image tag already exists: %s\n' "$tag" >&2
            exit 1
          fi
          [[ "$tag_state" == absent ]]
          {
            printf 'repository=%s\n' "$repository"
            printf 'tag=%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: apexload-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}-${{ matrix.profile }}
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BINARY=${{ matrix.binary }}
            GO_BUILD_TAGS=${{ matrix.profile }}
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_TIME=${{ needs.metadata.outputs.build-time }}

      - name: Resolve exact platform digests
        id: platforms
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --raw)"
          platform_digest() {
            local architecture="$1"
            jq -er --arg architecture "$architecture" '
              [.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == $architecture)]
              | if length == 1 then .[0].digest
                else error("expected exactly one linux/" + $architecture + " manifest") end
            ' <<< "$index"
          }
          amd64_digest="$(platform_digest amd64)"
          arm64_digest="$(platform_digest arm64)"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'amd64-digest=%s\n' "$amd64_digest"
            printf 'arm64-digest=%s\n' "$arm64_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Generate linux-amd64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.platforms.outputs.amd64-digest }}
          format: spdx-json
          output-file: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate linux-arm64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.platforms.outputs.arm64-digest }}
          format: spdx-json
          output-file: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-arm64.spdx.json
          upload-artifact: false

      - name: Block linux-amd64 high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.platforms.outputs.amd64-digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library

      - name: Block linux-arm64 high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.platforms.outputs.arm64-digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library

      - name: Sign exact image digest with KMS or HSM key
        if: vars.COSIGN_KEY_REF != ''
        env:
          COSIGN_KEY_REF: ${{ vars.COSIGN_KEY_REF }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64-digest }}
          SBOM_AMD64: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-amd64.spdx.json
          SBOM_ARM64: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-arm64.spdx.json
        run: |
          set -euo pipefail
          cosign sign --yes --key "$COSIGN_KEY_REF" --use-signing-config=false "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          for platform in amd64 arm64; do
            digest_variable="${platform^^}_DIGEST"
            sbom_variable="SBOM_${platform^^}"
            digest="${!digest_variable}"
            sbom="${!sbom_variable}"
            cosign sign --yes --key "$COSIGN_KEY_REF" --use-signing-config=false "${IMAGE_REPOSITORY}@${digest}"
            cosign attest --yes --key "$COSIGN_KEY_REF" --use-signing-config=false \
              --type spdxjson \
              --predicate "$sbom" \
              "${IMAGE_REPOSITORY}@${digest}"
          done

      - name: Sign exact image digest with protected software key
        if: vars.COSIGN_KEY_REF == ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64-digest }}
          SBOM_AMD64: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-amd64.spdx.json
          SBOM_ARM64: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-arm64.spdx.json
        run: |
          set -euo pipefail
          key=env://COSIGN_PRIVATE_KEY
          cosign sign --yes --key "$key" --use-signing-config=false "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          for platform in amd64 arm64; do
            digest_variable="${platform^^}_DIGEST"
            sbom_variable="SBOM_${platform^^}"
            digest="${!digest_variable}"
            sbom="${!sbom_variable}"
            cosign sign --yes --key "$key" --use-signing-config=false "${IMAGE_REPOSITORY}@${digest}"
            cosign attest --yes --key "$key" --use-signing-config=false \
              --type spdxjson \
              --predicate "$sbom" \
              "${IMAGE_REPOSITORY}@${digest}"
          done

      - name: Verify portable image signature
        env:
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64-digest }}
          SBOM_AMD64: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-amd64.spdx.json
          SBOM_ARM64: release/assets/sbom-apexload-${{ matrix.component }}-${{ matrix.profile }}-linux-arm64.spdx.json
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/cosign.pub"
          printf '%s' "$COSIGN_PUBLIC_KEY" > "$public_key"
          cosign verify --key "$public_key" "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >/dev/null
          for platform in amd64 arm64; do
            digest_variable="${platform^^}_DIGEST"
            sbom_variable="SBOM_${platform^^}"
            digest="${!digest_variable}"
            sbom="${!sbom_variable}"
            cosign verify --key "$public_key" "${IMAGE_REPOSITORY}@${digest}" >/dev/null
            ./scripts/release/verify-sbom-attestation.sh \
              "${IMAGE_REPOSITORY}@${digest}" "$public_key" "$sbom"
          done

      - name: Create image manifest fragment
        env:
          COMPONENT: ${{ matrix.component }}
          PROFILE: ${{ matrix.profile }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64-digest }}
        run: |
          set -euo pipefail
          mkdir -p release/image-metadata
          sbom_amd64="sbom-apexload-${COMPONENT}-${PROFILE}-linux-amd64.spdx.json"
          sbom_arm64="sbom-apexload-${COMPONENT}-${PROFILE}-linux-arm64.spdx.json"
          sbom_amd64_sha256="$(sha256sum "release/assets/$sbom_amd64" | awk '{print $1}')"
          sbom_arm64_sha256="$(sha256sum "release/assets/$sbom_arm64" | awk '{print $1}')"
          jq -n \
            --arg component "$COMPONENT" \
            --arg profile "$PROFILE" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg digest "$IMAGE_DIGEST" \
            --arg amd64_digest "$AMD64_DIGEST" \
            --arg arm64_digest "$ARM64_DIGEST" \
            --arg sbom_amd64 "$sbom_amd64" \
            --arg sbom_arm64 "$sbom_arm64" \
            --arg sbom_amd64_sha256 "$sbom_amd64_sha256" \
            --arg sbom_arm64_sha256 "$sbom_arm64_sha256" \
            '{
              component: $component,
              profile: $profile,
              repository: $repository,
              digest: $digest,
              platforms: [
                {os: "linux", architecture: "amd64", digest: $amd64_digest, sbom_asset: $sbom_amd64, sbom_sha256: $sbom_amd64_sha256},
                {os: "linux", architecture: "arm64", digest: $arm64_digest, sbom_asset: $sbom_arm64, sbom_sha256: $sbom_arm64_sha256}
              ]
            }' \
            > "release/image-metadata/${COMPONENT}-${PROFILE}.json"

      - name: Attest image provenance on GitHub.com
        if: vars.APEXLOAD_ENABLE_HOSTED_ATTESTATIONS == 'true' && github.server_url == 'https://github.com' && (vars.APEXLOAD_RELEASE_REGISTRY == '' || vars.APEXLOAD_RELEASE_REGISTRY == 'ghcr.io')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          github-token: ${{ secrets.APEXLOAD_GITHUB_ATTESTATIONS_TOKEN }}

      - name: Upload image evidence
        uses: ./.github/actions/upload-artifact
        with:
          name: release-image-${{ matrix.component }}-${{ matrix.profile }}
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Remove release builder and isolated registry credentials
        if: always()
        env:
          BUILDER_NAME: apexload-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}-${{ matrix.profile }}
        run: |
          docker buildx rm "$BUILDER_NAME" >/dev/null 2>&1 || true
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP/apexload-docker-config" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi

  assemble:
    name: Assemble and sign immutable release bundle
    needs: [metadata, core-assets, clients, images]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    environment: registry-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Download all release inputs
        uses: ./.github/actions/download-release-inputs
        with:
          path: staging

      - name: Normalize artifact layout
        run: python3 scripts/release/normalize-release-inputs.py staging

      - name: Generate schema-v2 release manifest
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_BUILD_TIME: ${{ needs.metadata.outputs.build-time }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release/create-manifest.py \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --build-time "$RELEASE_BUILD_TIME" \
            --assets staging/assets \
            --image-metadata staging/image-metadata \
            --repository "$REPOSITORY" \
            --output staging/assets/release-manifest.json

      - name: Sign checksum manifest with external KMS or HSM signer
        if: vars.APEXLOAD_RELEASE_SIGNER_PATH != ''
        env:
          PUBLIC_KEY_PEM: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          APEXLOAD_RELEASE_SIGNER_PATH: ${{ vars.APEXLOAD_RELEASE_SIGNER_PATH }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/release-public.pem"
          trap 'rm -f "$public_key"' EXIT
          umask 077
          printf '%s' "$PUBLIC_KEY_PEM" > "$public_key"
          ./scripts/release/sign-release.sh staging/assets "$RUNNER_TEMP/unused-private.pem" "$public_key"
          ./scripts/release/verify-release.sh staging/assets "$RELEASE_TAG" "$public_key" "$RELEASE_COMMIT"

      - name: Sign checksum manifest with protected software key
        if: vars.APEXLOAD_RELEASE_SIGNER_PATH == ''
        env:
          PRIVATE_KEY_PEM: ${{ secrets.APEXLOAD_RELEASE_SIGNING_KEY_PEM }}
          PUBLIC_KEY_PEM: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/release-private.pem"
          public_key="$RUNNER_TEMP/release-public.pem"
          trap 'rm -f "$private_key" "$public_key"' EXIT
          umask 077
          printf '%s' "$PRIVATE_KEY_PEM" > "$private_key"
          printf '%s' "$PUBLIC_KEY_PEM" > "$public_key"
          ./scripts/release/sign-release.sh staging/assets "$private_key" "$public_key"
          ./scripts/release/verify-release.sh staging/assets "$RELEASE_TAG" "$public_key" "$RELEASE_COMMIT"

      - name: Attest downloadable artifacts on GitHub.com
        if: vars.APEXLOAD_ENABLE_HOSTED_ATTESTATIONS == 'true' && github.server_url == 'https://github.com'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: staging/assets/*
          github-token: ${{ secrets.APEXLOAD_GITHUB_ATTESTATIONS_TOKEN }}

      - name: Upload verified release bundle
        uses: ./.github/actions/upload-artifact
        with:
          name: release-bundle
          path: staging/assets/
          if-no-files-found: error
          retention-days: 7

  promote-images:
    name: Expose verified semantic image tags
    needs: [metadata, assemble]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    environment: registry-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release verification tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified signed bundle
        uses: ./.github/actions/download-artifact
        with:
          name: release-bundle
          path: release

      - name: Reverify signed bundle after artifact handoff
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_PUBLIC_KEY: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s' "$RELEASE_PUBLIC_KEY" > "$public_key"
          ./scripts/release/verify-release.sh release "$RELEASE_TAG" "$public_key" "$RELEASE_COMMIT"

      - name: Install checksum-pinned Buildx
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        env:
          BUILDX_RELEASE_BASE_URL: ${{ vars.BUILDX_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/apexload-docker-config"
          ./scripts/ci/install-buildx.sh "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Install checksum-pinned registry inspection
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        env:
          SKOPEO_RELEASE_BASE_URL: ${{ vars.SKOPEO_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          tool_directory="$RUNNER_TEMP/apexload-tools"
          ./scripts/ci/install-skopeo.sh "$tool_directory"
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"

      - name: Authenticate to release container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ vars.APEXLOAD_RELEASE_REGISTRY || 'ghcr.io' }}
          username: ${{ vars.APEXLOAD_RELEASE_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.APEXLOAD_RELEASE_REGISTRY_PASSWORD || github.token }}

      - name: Validate immutable BuildKit image
        env:
          BUILDKIT_IMAGE: ${{ vars.APEXLOAD_BUILDKIT_IMAGE || 'docker.io/moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a' }}
        run: ./scripts/ci/verify-buildx-toolchain.sh image "$BUILDKIT_IMAGE"

      - name: Create pinned registry manifest builder
        env:
          BUILDER_NAME: apexload-promote-${{ github.run_id }}-${{ github.run_attempt }}
          BUILDKIT_IMAGE: ${{ vars.APEXLOAD_BUILDKIT_IMAGE || 'docker.io/moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a' }}
        run: |
          set -euo pipefail
          ./scripts/ci/verify-buildx-toolchain.sh binary
          docker buildx create \
            --name "$BUILDER_NAME" \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use \
            --bootstrap

      - name: Verify exact Buildx and BuildKit toolchain
        env:
          BUILDER_NAME: apexload-promote-${{ github.run_id }}-${{ github.run_attempt }}
          BUILDKIT_IMAGE: ${{ vars.APEXLOAD_BUILDKIT_IMAGE || 'docker.io/moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a' }}
        run: ./scripts/ci/verify-buildx-toolchain.sh builder "$BUILDER_NAME" "$BUILDKIT_IMAGE"

      - name: Verify exact registry inspection tool
        run: |
          set -euo pipefail
          [[ "$(skopeo --version)" == 'skopeo version 1.20.0' ]]

      - name: Install cosign
        if: vars.APEXLOAD_USE_PREINSTALLED_TOOLS != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Verify exact cosign version
        run: cosign version 2>&1 | grep -Eq 'GitVersion:[[:space:]]+v3\.1\.1([[:space:]]|$)'

      - name: Verify all candidate digests and reserve final tags
        env:
          APEXLOAD_IMAGE_INSPECTOR: skopeo
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/cosign.pub"
          printf '%s' "$COSIGN_PUBLIC_KEY" > "$public_key"
          for coordinate in controller:standard controller:enterprise generator:standard generator:enterprise java-vuser-runner:standard; do
              component="${coordinate%%:*}"
              profile="${coordinate#*:}"
              ./scripts/release/verify-image-evidence.sh \
                release/release-manifest.json "$component" "$profile" "$public_key" >/dev/null
              row="$(jq -cer --arg component "$component" --arg profile "$profile" '
                [.images[] | select(.component == $component and .profile == $profile)]
                | if length == 1 then .[0] else error("missing image") end
              ' release/release-manifest.json)"
              repository="$(jq -er '.repository' <<< "$row")"
              expected_digest="$(jq -er '.digest' <<< "$row")"
              final_tag="${repository}:${RELEASE_TAG}-${profile}"
              tag_state="$(./scripts/release/registry-reference-state.sh docker-buildx "$final_tag")"
              if [[ "$tag_state" == present ]]; then
                existing_digest="sha256:$(docker buildx imagetools inspect "$final_tag" --raw | sha256sum | awk '{print $1}')"
                [[ "$existing_digest" == "$expected_digest" ]] || {
                  printf 'immutable semantic image tag %s already points at %s, expected %s\n' "$final_tag" "$existing_digest" "$expected_digest" >&2
                  exit 1
                }
              else
                [[ "$tag_state" == absent ]]
              fi
          done

      - name: Reverify frozen signed tag immediately before image exposure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          APEXLOAD_RELEASE_TAG_PUBLIC_KEYS: ${{ vars.APEXLOAD_RELEASE_TAG_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          ./scripts/release/verify-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          export GH_HOST="${server_url#https://}"
          if [[ "$GH_HOST" != github.com ]]; then
            export GH_ENTERPRISE_TOKEN="$GH_TOKEN"
          fi
          expected_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          ref_state="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          remote_object="$(jq -er 'select(.object.type == "tag") | .object.sha' <<< "$ref_state")"
          [[ "$remote_object" == "$expected_object" ]] || {
            echo 'remote signed release tag changed before image promotion' >&2
            exit 1
          }
          remote_commit="$(gh api "repos/${REPOSITORY}/git/tags/${remote_object}" \
            --jq 'select(.object.type == "commit") | .object.sha')"
          [[ "$remote_commit" == "$RELEASE_COMMIT" ]]

      - name: Promote exact digests and verify tag resolution
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          for coordinate in controller:standard controller:enterprise generator:standard generator:enterprise java-vuser-runner:standard; do
              component="${coordinate%%:*}"
              profile="${coordinate#*:}"
              row="$(jq -cer --arg component "$component" --arg profile "$profile" '
                [.images[] | select(.component == $component and .profile == $profile)]
                | if length == 1 then .[0] else error("missing image") end
              ' release/release-manifest.json)"
              repository="$(jq -er '.repository' <<< "$row")"
              digest="$(jq -er '.digest' <<< "$row")"
              final_tag="${repository}:${RELEASE_TAG}-${profile}"
              tag_state="$(./scripts/release/registry-reference-state.sh docker-buildx "$final_tag")"
              if [[ "$tag_state" == absent ]]; then
                docker buildx imagetools create --tag "$final_tag" "${repository}@${digest}"
              else
                [[ "$tag_state" == present ]]
              fi
              resolved="sha256:$(docker buildx imagetools inspect "$final_tag" --raw | sha256sum | awk '{print $1}')"
              [[ "$resolved" == "$digest" ]] || {
                printf 'semantic tag %s resolved to %s, expected %s\n' "$final_tag" "$resolved" "$digest" >&2
                exit 1
              }
          done

      - name: Confirm signed tag remained frozen through image exposure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          export GH_HOST="${server_url#https://}"
          if [[ "$GH_HOST" != github.com ]]; then
            export GH_ENTERPRISE_TOKEN="$GH_TOKEN"
          fi
          expected_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          remote_object="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          [[ "$remote_object" == "$expected_object" ]] || {
            echo 'remote signed release tag changed during image promotion' >&2
            exit 1
          }

      - name: Remove manifest builder and isolated registry credentials
        if: always()
        env:
          BUILDER_NAME: apexload-promote-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker buildx rm "$BUILDER_NAME" >/dev/null 2>&1 || true
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP/apexload-docker-config" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi

  publish:
    name: Publish verified Release
    needs: [metadata, assemble, promote-images]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    environment: registry-release
    permissions:
      contents: write
    steps:
      - name: Checkout release publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify signed tag before publication
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          APEXLOAD_RELEASE_TAG_PUBLIC_KEYS: ${{ vars.APEXLOAD_RELEASE_TAG_PUBLIC_KEYS }}
        run: ./scripts/release/verify-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Download verified bundle
        uses: ./.github/actions/download-artifact
        with:
          name: release-bundle
          path: release

      - name: Reverify signed bundle after artifact handoff
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_PUBLIC_KEY: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s' "$RELEASE_PUBLIC_KEY" > "$public_key"
          ./scripts/release/verify-release.sh release "$RELEASE_TAG" "$public_key" "$RELEASE_COMMIT"

      - name: Upload idempotently, verify stored bytes, and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_PUBLIC_KEY: ${{ vars.APEXLOAD_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          public_key="$RUNNER_TEMP/release-signing.pub"
          printf '%s' "$RELEASE_PUBLIC_KEY" > "$public_key"
          ./scripts/release/publish-release.sh \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$REPOSITORY" \
            release \
            "$public_key" \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}")"

  move-v1:
    name: Move protected signed v1 action tag
    if: ${{ !contains(needs.metadata.outputs.tag, '-') && startsWith(needs.metadata.outputs.tag, 'v1.') }}
    needs: [metadata, publish]
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    environment: registry-release
    permissions:
      contents: write
    steps:
      - name: Checkout stable release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reverify the frozen signed release tag
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          APEXLOAD_RELEASE_TAG_PUBLIC_KEYS: ${{ vars.APEXLOAD_RELEASE_TAG_PUBLIC_KEYS }}
        run: ./scripts/release/verify-tag.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Import moving-tag signing identity and update v1
        env:
          TAG_PRIVATE_KEY: ${{ secrets.APEXLOAD_RELEASE_TAG_PRIVATE_KEY }}
          TAG_SIGNING_KEY_ID: ${{ vars.APEXLOAD_RELEASE_TAG_SIGNING_KEY_ID }}
          TAG_SIGNER_MODE: ${{ vars.APEXLOAD_RELEASE_TAG_SIGNER_MODE }}
          TAG_GNUPGHOME: ${{ vars.APEXLOAD_RELEASE_TAG_GNUPGHOME }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$TAG_SIGNER_MODE" == preinstalled ]]; then
            [[ -z "$TAG_PRIVATE_KEY" ]] || {
              echo 'do not expose a moving-tag private key in preinstalled signer mode' >&2
              exit 1
            }
            [[ "$TAG_GNUPGHOME" == /* && -d "$TAG_GNUPGHOME" ]] || {
              echo 'preinstalled signer mode requires an absolute APEXLOAD_RELEASE_TAG_GNUPGHOME' >&2
              exit 1
            }
            export GNUPGHOME="$TAG_GNUPGHOME"
          else
            gnupg_home="$(mktemp -d)"
            trap 'rm -rf "$gnupg_home"' EXIT
            chmod 0700 "$gnupg_home"
            export GNUPGHOME="$gnupg_home"
            printf '%s' "$TAG_PRIVATE_KEY" | gpg --batch --import
          fi
          [[ -n "$TAG_SIGNING_KEY_ID" ]] || {
            echo 'APEXLOAD_RELEASE_TAG_SIGNING_KEY_ID is required' >&2
            exit 1
          }
          gpg --batch --list-secret-keys "$TAG_SIGNING_KEY_ID" >/dev/null 2>&1 || {
            echo 'moving-tag signing key is not available from the configured GPG agent/keyring' >&2
            exit 1
          }
          git config user.name 'APEX Load Release Bot'
          git config user.email 'apexload-release@users.noreply.github.com'
          git config user.signingkey "$TAG_SIGNING_KEY_ID"
          existing_oid="$(git ls-remote --tags origin refs/tags/v1 | awk 'NR == 1 {print $1}')"
          if [[ -n "$existing_oid" ]]; then
            git fetch --force --no-tags origin refs/tags/v1:refs/tags/v1
            existing_commit="$(git rev-parse 'refs/tags/v1^{commit}')"
            existing_release="$(git tag --points-at "$existing_commit" --list 'v1.*' \
              | grep -E '^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)"
            [[ -n "$existing_release" ]] || {
              echo 'existing v1 tag is not anchored to a stable semantic v1 release' >&2
              exit 1
            }
            highest="$(printf '%s\n%s\n' "$existing_release" "$RELEASE_TAG" | sort -V | tail -n 1)"
            [[ "$highest" == "$RELEASE_TAG" && "$existing_release" != "$RELEASE_TAG" ]] || {
              printf 'refusing to move v1 backward or sideways from %s to %s\n' "$existing_release" "$RELEASE_TAG" >&2
              exit 1
            }
          fi
          release_tag_oid="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          remote_release_tag_oid="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 {print $1}')"
          [[ "$remote_release_tag_oid" == "$release_tag_oid" ]] || {
            echo 'semantic release tag moved after publication; refusing to update v1' >&2
            exit 1
          }
          git tag --sign --force v1 "$RELEASE_COMMIT" --message "APEX Load action ${RELEASE_TAG}"
          git push --force-with-lease="refs/tags/v1:${existing_oid}" origin refs/tags/v1
