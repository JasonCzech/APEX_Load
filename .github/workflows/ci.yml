name: CI

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact already-trusted commit to validate for a release call.
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  GOTOOLCHAIN: local
  GOPROXY: ${{ vars.GO_MODULE_PROXY || 'https://proxy.golang.org,direct' }}
  NPM_CONFIG_REGISTRY: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
  PLAYWRIGHT_DOWNLOAD_HOST: ${{ vars.PLAYWRIGHT_DOWNLOAD_HOST || '' }}
  PROMETHEUS_IMAGE: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac

jobs:
  fork-static:
    name: Fork static DSL validation
    # Never check out contributor-controlled bytes onto a GHES self-hosted
    # runner. GitHub.com can safely provide an isolated hosted runner for this
    # deliberately static-only fork validation.
    if: github.server_url == 'https://github.com' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.id != github.event.repository.id || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      - name: Enforce the static-only fork change boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          disallowed=()
          while IFS= read -r -d '' file; do
            case "${file}" in
              *.md|LICENSE|NOTICE|examples/*.json)
                entry=$(git ls-tree "${HEAD_SHA}" -- "${file}")
                case "${entry}" in
                  ""|100644\ blob\ *|100755\ blob\ *)
                    ;;
                  *)
                    disallowed+=("${file}")
                    ;;
                esac
                ;;
              *)
                disallowed+=("${file}")
                ;;
            esac
          done < <(git diff --no-renames --name-only -z "${BASE_SHA}" "${HEAD_SHA}")
          if (( ${#disallowed[@]} > 0 )); then
            echo "Fork pull requests may change only documentation and static JSON examples." >&2
            echo "Import source, workflow, container, dashboard, or test changes onto a same-repository review branch for full CI." >&2
            printf 'disallowed path: %q\n' "${disallowed[@]}" >&2
            exit 1
          fi

      - name: Validate changed JSON and DSL syntax without executing repository code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            if [[ -L "${file}" || ! -f "${file}" ]]; then
              printf 'changed JSON path must be a regular file: %q\n' "${file}" >&2
              exit 1
            fi
            jq empty -- "${file}"
            checked=$((checked + 1))
          done < <(git diff --name-only --diff-filter=ACMRT -z "${BASE_SHA}" "${HEAD_SHA}" -- '*.json')
          printf 'validated %d changed JSON file(s)\n' "${checked}"

  workflow-policy:
    name: Workflow policy
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_RELEASE_BASE_URL: ${{ vars.ACTIONLINT_RELEASE_BASE_URL || 'https://github.com/rhysd/actionlint/releases/download' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          [[ "$ACTIONLINT_RELEASE_BASE_URL" == https://* ]]
          url="${ACTIONLINT_RELEASE_BASE_URL%/}/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          install -m 0755 "${RUNNER_TEMP}/actionlint" "${RUNNER_TEMP}/bin/actionlint"
          "${RUNNER_TEMP}/bin/actionlint" -version

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_RELEASE_BASE_URL: ${{ vars.SHELLCHECK_RELEASE_BASE_URL || 'https://github.com/koalaman/shellcheck/releases/download' }}
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          [[ "$SHELLCHECK_RELEASE_BASE_URL" == https://* ]]
          url="${SHELLCHECK_RELEASE_BASE_URL%/}/v${SHELLCHECK_VERSION}/${archive}"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          "${RUNNER_TEMP}/bin/shellcheck" --version

      - name: Install pinned zizmor
        env:
          ZIZMOR_VERSION: 1.27.0
          ZIZMOR_SHA256: afb28123882d2b8248f1e480bf6cc6d1af102e0d3fbe22a40f7f795b1aa9d435
          ZIZMOR_URL: ${{ vars.ZIZMOR_WHEEL_URL || 'https://files.pythonhosted.org/packages/21/64/4e21d26a2fc910594aaab19367ac25467a4da6438b7c381f67e90c38945e/zizmor-1.27.0-py3-none-manylinux_2_28_x86_64.whl' }}
        run: |
          set -euo pipefail
          [[ "$ZIZMOR_URL" == https://* ]]
          wheel="${RUNNER_TEMP}/zizmor-${ZIZMOR_VERSION}-py3-none-manylinux_2_28_x86_64.whl"
          curl --fail --silent --show-error --location --retry 3 --output "${wheel}" "${ZIZMOR_URL}"
          printf '%s  %s\n' "${ZIZMOR_SHA256}" "${wheel}" | sha256sum --check --strict
          python3 -m pip install --disable-pip-version-check --no-input --no-deps --user "${wheel}"
          "${HOME}/.local/bin/zizmor" --version

      - name: Enforce repository workflow policy
        run: python3 scripts/ci/validate-github-actions.py

      - name: Validate workflow syntax
        run: |
          "${RUNNER_TEMP}/bin/actionlint" -color -shellcheck="${RUNNER_TEMP}/bin/shellcheck"

      - name: Audit workflow security
        run: |
          "${HOME}/.local/bin/zizmor" --pedantic --min-severity high --min-confidence medium --format github --no-online-audits .github

      - name: Setup the canonical action's manifest-validation runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Test canonical composite action helpers
        run: .github/actions/apexload-run/tests/run.sh

      - name: Lint tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(git ls-files -z -- '*.sh')
          if (( ${#scripts[@]} > 0 )); then
            "${RUNNER_TEMP}/bin/shellcheck" --external-sources "${scripts[@]}"
          fi

  go-quality:
    name: Go quality and generated artifacts
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build dependencies
        if: github.server_url == 'https://github.com'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [[ -n "${files}" ]]; then
            printf 'The following Go files need gofmt:\n%s\n' "${files}" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          args: --timeout=10m ./...
          only-new-issues: false

      - name: Verify module files are tidy
        run: |
          set -euo pipefail
          go mod tidy
          changes="$(git status --porcelain=v1 --untracked-files=all -- go.mod go.sum)"
          if [[ -n "$changes" ]]; then
            printf 'go mod tidy changed dependency files:\n%s\n' "$changes" >&2
            exit 1
          fi

      - name: Verify generated artifacts are current
        run: |
          set -euo pipefail
          go generate ./...
          changes="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$changes" ]]; then
            printf 'go generate left stale, deleted, or untracked generated artifacts:\n%s\n' "$changes" >&2
            exit 1
          fi

  go-tests:
    name: Go race tests
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install desktop development headers for script tests
        if: github.server_url == 'https://github.com'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install Playwright browser runtimes for Go integration tests
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install --with-deps chromium webkit

      - name: Run race tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          gotestsum --junitfile test-results/go-junit.xml -- \
            -race -shuffle=on -count=1 -timeout=20m -coverprofile=test-results/coverage.out ./...

      - name: Upload Go test evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: go-test-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Binary and Java runner build
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build all Go commands with deterministic metadata
        env:
          BUILD_VERSION: 0.0.0-ci
          BUILD_COMMIT: ${{ inputs.checkout-ref || github.sha }}
          BUILD_TIME: "1970-01-01T00:00:00Z"
        run: |
          set -euo pipefail
          bi=github.com/jasonczech/apexload/pkg/buildinfo
          ldflags="-s -w -X ${bi}.Version=${BUILD_VERSION} -X ${bi}.Commit=${BUILD_COMMIT} -X ${bi}.BuildTime=${BUILD_TIME}"
          go build -trimpath -ldflags "${ldflags}" ./cmd/...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${ldflags}" ./cmd/...
          VERSION="${BUILD_VERSION}" COMMIT="${BUILD_COMMIT}" BUILD_TIME="${BUILD_TIME}" make build

      - name: Smoke-test command surfaces
        run: |
          set -euo pipefail
          ./bin/apexctl version
          ./bin/apexload-record-agent --version
          ./bin/apexload-collector-agent --version
          APEXLOAD_GENERATOR_LISTEN_ADDR=127.0.0.1:19090 \
            APEXLOAD_GENERATOR_HEALTH_ADDR=127.0.0.1:19092 \
            ./bin/generator >"${RUNNER_TEMP}/generator.log" 2>&1 &
          pid=$!
          trap 'kill "${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "${pid}"

      - name: Build and inspect Java Vuser runner
        run: |
          set -euo pipefail
          make java-vuser-runner
          jar --list --file bin/java_vuser/apexload-java-vuser-runner.jar | grep -qx 'Harness.class'
          javap -classpath bin/java_vuser/apexload-java-vuser-runner.jar Harness >/dev/null

  protocol-tags:
    name: Protocol profile (${{ matrix.profile }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: jms-solace
            tags: jms_solace_real
            packages: ./pkg/protocol/jms
          - profile: jms-servicebus
            tags: jms_servicebus_real
            packages: ./pkg/protocol/jms
          - profile: kafka
            tags: kafka_real
            packages: ./pkg/protocol/kafka ./pkg/dsl
          - profile: eventhubs
            tags: eventhubs_real
            packages: ./pkg/protocol/eventhubs ./pkg/dsl
          - profile: enterprise
            tags: jms_solace_real,jms_servicebus_real,kafka_real,eventhubs_real
            packages: ./pkg/protocol/jms ./pkg/protocol/kafka ./pkg/protocol/eventhubs ./pkg/dsl
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test tagged protocol implementation
        env:
          BUILD_TAGS: ${{ matrix.tags }}
          TEST_PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<< "${TEST_PACKAGES}"
          go test -count=1 -tags "${BUILD_TAGS}" "${packages[@]}"

      - name: Compile primary binaries with tagged profile
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          for command in controller generator apexctl; do
            go build -trimpath -tags "${BUILD_TAGS}" -o "${RUNNER_TEMP}/${command}" "./cmd/${command}"
          done

  dashboard:
    name: Dashboard quality and browser smoke
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high

      - name: Type check
        working-directory: dashboard
        run: npm run typecheck

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Accessibility regression gate
        working-directory: dashboard
        run: npm run lint:a11y

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Bundle checker tests
        working-directory: dashboard
        run: npm run test:bundle-budget

      - name: Production build and bundle budgets
        working-directory: dashboard
        run: |
          set -euo pipefail
          npm run build
          npm run bundle:check

      - name: Install Chromium and hosted-runner dependencies
        if: github.server_url == 'https://github.com'
        working-directory: dashboard
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install Chromium from the GHES browser mirror
        if: github.server_url != 'https://github.com'
        working-directory: dashboard
        run: ./node_modules/.bin/playwright install chromium

      - name: Browser smoke against the embedded controller dashboard
        env:
          APEXLOAD_E2E_BASE_URL: http://127.0.0.1:18081
        run: |
          set -euo pipefail
          go build -trimpath -o "${RUNNER_TEMP}/controller" ./cmd/controller
          APEXLOAD_ADDR=127.0.0.1:18081 \
            APEXLOAD_DB="${RUNNER_TEMP}/apexload-e2e.db" \
            APEXLOAD_ARCHIVE_DIR="${RUNNER_TEMP}/apexload-e2e-archives" \
            "${RUNNER_TEMP}/controller" >"${RUNNER_TEMP}/controller-e2e.log" 2>&1 &
          pid=$!
          cleanup() {
            exit_code=$?
            trap - EXIT INT TERM
            kill "${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            if (( exit_code != 0 )); then cat "${RUNNER_TEMP}/controller-e2e.log" >&2; fi
            exit "${exit_code}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          for _ in $(seq 1 60); do
            if curl --silent --fail "${APEXLOAD_E2E_BASE_URL}/api/v1/system/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail "${APEXLOAD_E2E_BASE_URL}/api/v1/system/health" >/dev/null
          npm --prefix dashboard run e2e

      - name: Upload browser evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: dashboard-browser-evidence
          path: |
            dashboard/test-results/
            dashboard/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  bruno-runner:
    name: Bruno compatibility runner
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install pinned Bruno dependencies
        working-directory: runners/bruno
        run: pnpm install --frozen-lockfile

      - name: Audit runner dependencies
        working-directory: runners/bruno
        run: pnpm audit --audit-level moderate

      - name: Test compatibility runner
        working-directory: runners/bruno
        run: pnpm test

      - name: Verify generated CycloneDX manifest
        working-directory: runners/bruno
        run: |
          set -euo pipefail
          pnpm run sbom
          git diff --exit-code -- sbom.cdx.json

      - name: Build runner image
        run: docker build --file runners/bruno/Dockerfile --tag apexload-bruno-runner:ci runners/bruno

      - name: Smoke-test runner image
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm \
            --env APEXLOAD_BRUNO_ALLOW_DIRECT_EGRESS=true \
            --env APEXLOAD_BRUNO_RUNNER_ADDR=0.0.0.0 \
            --publish 127.0.0.1::8097 \
            apexload-bruno-runner:ci)"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          port="$(docker port "${container_id}" 8097/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          for _ in $(seq 1 30); do
            if curl --silent --fail "http://127.0.0.1:${port}/v1/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail "http://127.0.0.1:${port}/v1/capabilities" \
            | jq -e '.compatibility_version == "3.5.2" and .streaming == true' >/dev/null

      - name: Generate runner SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: apexload-bruno-runner:ci
          format: spdx-json
          output-file: sbom-bruno-runner.spdx.json
          upload-artifact: false

      - name: Scan runner image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apexload-bruno-runner:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 10m0s

      - name: Upload runner SBOM
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: sbom-bruno-runner
          path: sbom-bruno-runner.spdx.json
          if-no-files-found: error
          retention-days: 30

  deployment-artifacts:
    name: Deployment artifact validation
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Install verified deployment CLIs
        env:
          TERRAFORM_VERSION: 1.15.8
          TERRAFORM_SHA256: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d
          KUBECTL_VERSION: 1.34.9
          KUBECTL_SHA256: 73bb6f5063caadae1e73a39de018d8ad21755984bea35358484db817859e7634
          HELM_VERSION: 3.21.3
          HELM_SHA256: 15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          TERRAFORM_RELEASE_BASE_URL: ${{ vars.TERRAFORM_RELEASE_BASE_URL || 'https://releases.hashicorp.com/terraform' }}
          KUBECTL_RELEASE_BASE_URL: ${{ vars.KUBECTL_RELEASE_BASE_URL || 'https://dl.k8s.io/release' }}
          HELM_RELEASE_BASE_URL: ${{ vars.HELM_RELEASE_BASE_URL || 'https://get.helm.sh' }}
          KUBECONFORM_RELEASE_BASE_URL: ${{ vars.KUBECONFORM_RELEASE_BASE_URL || 'https://github.com/yannh/kubeconform/releases/download' }}
        run: |
          set -euo pipefail
          for base_url in "$TERRAFORM_RELEASE_BASE_URL" "$KUBECTL_RELEASE_BASE_URL" "$HELM_RELEASE_BASE_URL" "$KUBECONFORM_RELEASE_BASE_URL"; do
            [[ "$base_url" == https://* ]] || {
              printf 'tool mirror must use HTTPS: %s\n' "$base_url" >&2
              exit 1
            }
          done
          mkdir -p "${RUNNER_TEMP}/bin"

          terraform_archive="${RUNNER_TEMP}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${terraform_archive}" \
            "${TERRAFORM_RELEASE_BASE_URL%/}/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          printf '%s  %s\n' "${TERRAFORM_SHA256}" "${terraform_archive}" | sha256sum --check --strict
          unzip -q "${terraform_archive}" -d "${RUNNER_TEMP}/terraform"
          install -m 0755 "${RUNNER_TEMP}/terraform/terraform" "${RUNNER_TEMP}/bin/terraform"

          kubectl_path="${RUNNER_TEMP}/kubectl"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${kubectl_path}" \
            "${KUBECTL_RELEASE_BASE_URL%/}/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check --strict
          install -m 0755 "${kubectl_path}" "${RUNNER_TEMP}/bin/kubectl"

          helm_archive="${RUNNER_TEMP}/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${helm_archive}" \
            "${HELM_RELEASE_BASE_URL%/}/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" "${helm_archive}" | sha256sum --check --strict
          tar -xzf "${helm_archive}" -C "${RUNNER_TEMP}" linux-amd64/helm
          install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/bin/helm"

          kubeconform_archive="${RUNNER_TEMP}/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${kubeconform_archive}" \
            "${KUBECONFORM_RELEASE_BASE_URL%/}/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  %s\n' "${KUBECONFORM_SHA256}" "${kubeconform_archive}" | sha256sum --check --strict
          tar -xzf "${kubeconform_archive}" -C "${RUNNER_TEMP}" kubeconform
          install -m 0755 "${RUNNER_TEMP}/kubeconform" "${RUNNER_TEMP}/bin/kubeconform"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Validate Terraform
        run: |
          set -euo pipefail
          terraform -chdir=deployments/azure/terraform fmt -check -diff
          terraform -chdir=deployments/azure/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deployments/azure/terraform validate

      - name: Install checksum-pinned custom resource schemas
        env:
          # CRDs-catalog snapshot 34cef0fc2698bbb611f475515e555a2d7ca85b6c.
          # GHES installations can mirror this exact directory internally.
          CRD_SCHEMA_BASE_URL: ${{ vars.KUBERNETES_CRD_SCHEMA_BASE_URL || 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/34cef0fc2698bbb611f475515e555a2d7ca85b6c' }}
        run: |
          set -euo pipefail
          [[ "$CRD_SCHEMA_BASE_URL" == https://* ]] || {
            printf 'CRD schema mirror must use HTTPS: %s\n' "$CRD_SCHEMA_BASE_URL" >&2
            exit 1
          }
          schema_root="${RUNNER_TEMP}/crd-schemas"
          mkdir -p \
            "${schema_root}/keda.sh" \
            "${schema_root}/cert-manager.io" \
            "${schema_root}/monitoring.coreos.com"
          schemas=(
            'keda.sh/scaledobject_v1alpha1.json|keda.sh/scaledobject_v1alpha1.json|f0e0801dd04d22c875ab14b2de908143d0b293430b8c2d5d71bafcf1a4e05b4e'
            'keda.sh/triggerauthentication_v1alpha1.json|keda.sh/triggerauthentication_v1alpha1.json|6dc3be31e2517d33c178015e0a943c281ab9eedaa55701ef2eadddaf7b169c36'
            'cert-manager.io/certificate_v1.json|cert-manager.io/certificate_v1.json|d3128cf7805dd289beb96e808e0e03294ef11affac7022fa955c370df1a767ac'
            'cert-manager.io/issuer_v1.json|cert-manager.io/issuer_v1.json|d92fc87966a07c2315f3745a2072cb5b408d989e3b12028b4bdb6c3af0afe2a5'
            'monitoring.coreos.com/servicemonitor_v1.json|monitoring.coreos.com/servicemonitor_v1.json|8978f86e2a7cb281a9ca7bc30d857e0553666658dfe062078c51e99d3f20cd14'
            'monitoring.coreos.com/prometheusrule_v1.json|monitoring.coreos.com/prometheusrule_v1.json|9cd71d75b714b541a0be960b46bd961dbf1f0106071381cd88f54dfe80b8bd9d'
          )
          for entry in "${schemas[@]}"; do
            IFS='|' read -r remote_path local_path checksum <<<"$entry"
            destination="${schema_root}/${local_path}"
            partial="${destination}.partial"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
              --output "$partial" "${CRD_SCHEMA_BASE_URL%/}/${remote_path}"
            printf '%s  %s\n' "$checksum" "$partial" | sha256sum --check --strict
            mv "$partial" "$destination"
          done

      - name: Validate every Kustomize overlay
        run: |
          set -euo pipefail
          while IFS= read -r overlay; do
            output="${RUNNER_TEMP}/kustomize-$(printf '%s' "${overlay}" | tr '/' '-').yaml"
            kubectl kustomize "${overlay}" >"${output}"
            "${RUNNER_TEMP}/bin/kubeconform" -strict \
              -schema-location default \
              -schema-location "${RUNNER_TEMP}/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              "${output}"
          done < <(find deployments/k8s -name kustomization.yaml -exec dirname {} \; | sort)

      - name: Validate the AKS renderer
        env:
          APEXLOAD_ACR_LOGIN_SERVER: ci.azurecr.io
          APEXLOAD_STORAGE_ACCOUNT_NAME: ciapexloadstorage
          APEXLOAD_KEY_VAULT_URL: https://ci-apexload.vault.azure.net
          APEXLOAD_CONTROLLER_WORKLOAD_IDENTITY_CLIENT_ID: 00000000-0000-0000-0000-000000000001
          APEXLOAD_GENERATOR_WORKLOAD_IDENTITY_CLIENT_ID: 00000000-0000-0000-0000-000000000002
          APEXLOAD_IMAGE_TAG: ci
        run: |
          set -euo pipefail
          scripts/render-aks-manifests.sh --output "${RUNNER_TEMP}/apexload-aks-rendered.yaml"
          "${RUNNER_TEMP}/bin/kubeconform" -strict \
            -schema-location default \
            -schema-location "${RUNNER_TEMP}/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "${RUNNER_TEMP}/apexload-aks-rendered.yaml"

      - name: Validate Helm chart
        run: |
          set -euo pipefail
          values=(
            --set workloadIdentity.controllerClientId=00000000-0000-0000-0000-000000000001
            --set workloadIdentity.generatorClientId=00000000-0000-0000-0000-000000000002
            --set image.registry=ci.azurecr.io
            --set dataPlatform.azureStorageAccount=ciapexloadstorage
            --set dataPlatform.keyVaultUrl=https://ci-apexload.vault.azure.net
            --set ingress.host=apexload-ci.example.internal
          )
          helm lint deployments/helm/apexload "${values[@]}"
          helm template apexload deployments/helm/apexload --namespace apexload "${values[@]}" >"${RUNNER_TEMP}/apexload-helm.yaml"
          "${RUNNER_TEMP}/bin/kubeconform" -strict \
            -schema-location default \
            -schema-location "${RUNNER_TEMP}/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "${RUNNER_TEMP}/apexload-helm.yaml"
          if grep -Ein 'changeme|change-me' "${RUNNER_TEMP}/apexload-helm.yaml"; then
            echo "rendered Helm manifest contains unresolved placeholder values" >&2
            exit 1
          fi

          bruno_values=(
            "${values[@]}"
            --set bruno.enabled=true
            --set bruno.artifactPersistence.existingClaim=apexload-bruno-artifacts
            --set bruno.egressBrokerUrl=http://apexload-egress-broker.apexload.svc.cluster.local:8080
            --set bruno.keyVaultKeyId=https://ci-apexload.vault.azure.net/keys/bruno/00000000000000000000000000000000
          )
          helm lint deployments/helm/apexload "${bruno_values[@]}"
          helm template apexload deployments/helm/apexload --namespace apexload \
            "${bruno_values[@]}" >"${RUNNER_TEMP}/apexload-helm-bruno.yaml"
          "${RUNNER_TEMP}/bin/kubeconform" -strict \
            -schema-location default \
            -schema-location "${RUNNER_TEMP}/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "${RUNNER_TEMP}/apexload-helm-bruno.yaml"
          if grep -Ein 'changeme|change-me' "${RUNNER_TEMP}/apexload-helm-bruno.yaml"; then
            echo "rendered Bruno Helm manifest contains unresolved placeholder values" >&2
            exit 1
          fi

      - name: Validate Docker Compose and Prometheus
        run: |
          set -euo pipefail
          docker compose --file compose.yaml config --quiet
          docker run --rm --entrypoint /bin/promtool \
            --volume "${PWD}/deployments/docker/prometheus:/etc/prometheus:ro" \
            "${PROMETHEUS_IMAGE}" check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "${PWD}/deployments/docker/prometheus:/etc/prometheus:ro" \
            "${PROMETHEUS_IMAGE}" check rules /etc/prometheus/apexload-rules.yml

  containers:
    name: Container (${{ matrix.binary }}, ${{ matrix.profile }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: controller
            profile: standard
          - binary: generator
            profile: standard
          - binary: controller
            profile: enterprise
          - binary: generator
            profile: enterprise
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image from clean checkout
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: apexload-${{ matrix.binary }}:ci-${{ matrix.profile }}
          build-args: |
            BINARY=${{ matrix.binary }}
            GO_BUILD_TAGS=${{ matrix.profile }}
            VERSION=0.0.0-ci-smoke
            COMMIT=0000000000000000000000000000000000000000
            BUILD_TIME=1970-01-01T00:00:00Z

      - name: Smoke-test controller image
        if: matrix.binary == 'controller'
        env:
          IMAGE: apexload-controller:ci-${{ matrix.profile }}
        run: scripts/ci/container-smoke.sh "${IMAGE}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: apexload-${{ matrix.binary }}:ci-${{ matrix.profile }}
          format: spdx-json
          output-file: sbom-${{ matrix.binary }}-${{ matrix.profile }}.spdx.json
          upload-artifact: false

      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apexload-${{ matrix.binary }}:ci-${{ matrix.profile }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 10m0s

      - name: Upload container SBOM
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: sbom-${{ matrix.binary }}-${{ matrix.profile }}
          path: sbom-${{ matrix.binary }}-${{ matrix.profile }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  govulncheck:
    name: Go vulnerability reachability
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build dependencies
        if: github.server_url == 'https://github.com'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan reachable Go code
        run: govulncheck ./...

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: Setup Go from go.mod
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop build dependencies
        if: matrix.language == 'go' && github.server_url == 'https://github.com'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Go for CodeQL
        if: matrix.language == 'go'
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          category: /language:${{ matrix.language }}

  ghes-fork-block:
    name: GHES fork policy block
    if: github.server_url != 'https://github.com' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.id != github.event.repository.id || github.event.pull_request.head.repo.full_name != github.repository)
    # This label must never be assigned to a runner. Keeping this job queued
    # leaves the stable Required check pending if GHES fork Actions are enabled
    # contrary to the compatibility runbook, without exposing a self-hosted
    # runner to a fork-modified workflow.
    runs-on: apexload-ci-fork-blocked
    timeout-minutes: 1
    steps:
      - name: Fail closed if the sentinel label is ever provisioned
        run: exit 1

  required:
    name: Required
    if: always()
    needs:
      - fork-static
      - workflow-policy
      - go-quality
      - go-tests
      - build
      - protocol-tags
      - dashboard
      - bruno-runner
      - deployment-artifacts
      - containers
      - dependency-review
      - govulncheck
      - codeql
      - ghes-fork-block
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'apexload-ci-unprivileged' }}
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.id != github.event.repository.id || github.event.pull_request.head.repo.full_name != github.repository) }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          full_ci_jobs=(
            workflow-policy go-quality go-tests build protocol-tags dashboard
            bruno-runner deployment-artifacts containers govulncheck codeql
          )
          expected_success=()
          expected_skipped=()

          if [[ "${IS_UNTRUSTED_PR}" == "true" ]]; then
            expected_success=(fork-static)
            expected_skipped=("${full_ci_jobs[@]}" dependency-review ghes-fork-block)
          else
            expected_success=("${full_ci_jobs[@]}")
            expected_skipped=(fork-static ghes-fork-block)
            if [[ "${IS_PULL_REQUEST}" == "true" ]]; then
              expected_success+=(dependency-review)
            else
              expected_skipped+=(dependency-review)
            fi
          fi

          failures=()
          if (( ${#expected_success[@]} > 0 )); then
            for job in "${expected_success[@]}"; do
              result=$(jq -r --arg job "${job}" '.[$job].result // "missing"' <<< "${JOB_RESULTS}")
              if [[ "${result}" != "success" ]]; then
                failures+=("${job}=${result}; expected success")
              fi
            done
          fi
          if (( ${#expected_skipped[@]} > 0 )); then
            for job in "${expected_skipped[@]}"; do
              result=$(jq -r --arg job "${job}" '.[$job].result // "missing"' <<< "${JOB_RESULTS}")
              if [[ "${result}" != "skipped" ]]; then
                failures+=("${job}=${result}; expected skipped")
              fi
            done
          fi

          if (( ${#failures[@]} > 0 )); then
            printf 'Required CI job contract failed:\n' >&2
            printf '%s\n' "${failures[@]}" >&2
            exit 1
          fi
          echo "All event-appropriate required CI jobs passed."
