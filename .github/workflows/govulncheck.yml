name: govulncheck

# Vulnerability gate. Fails the build when govulncheck finds a vulnerability
# your code actually calls. Runs on PRs to main and pushes to main, and weekly
# so newly-disclosed CVEs against unchanged code are caught too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Track the toolchain pinned in go.mod (go 1.26.4) so the standard
          # library being scanned matches what we ship.
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
