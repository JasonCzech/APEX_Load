name: Deploy Artifact Validation

on:
  pull_request:
    paths:
      - "deployments/**"
      - "scripts/render-aks-manifests.sh"
      - ".github/workflows/deploy-artifacts-validation.yml"
  push:
    branches: [main]
    paths:
      - "deployments/**"
      - "scripts/render-aks-manifests.sh"
      - ".github/workflows/deploy-artifacts-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          version="0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Terraform validate
        run: |
          set -euo pipefail
          terraform -chdir=deployments/azure/terraform fmt -check -diff
          terraform -chdir=deployments/azure/terraform init -backend=false -input=false
          terraform -chdir=deployments/azure/terraform validate

      - name: Kustomize validate
        run: |
          set -euo pipefail
          for overlay in \
            deployments/k8s/aks \
            deployments/k8s/aks-prometheus \
            deployments/k8s/aks-azure-monitor \
            deployments/k8s/onprem \
            deployments/k8s/onprem-autoscaling \
            deployments/k8s/local \
            deployments/k8s/local-kind
          do
            out="/tmp/apexload-$(basename "$overlay").yaml"
            kubectl kustomize "$overlay" > "$out"
            kubeconform -strict -ignore-missing-schemas "$out"
          done

      - name: AKS renderer validates placeholder substitution
        env:
          APEXLOAD_ACR_LOGIN_SERVER: ci.azurecr.io
          APEXLOAD_STORAGE_ACCOUNT_NAME: ciapexloadstorage
          APEXLOAD_KEY_VAULT_URL: https://ci-apexload.vault.azure.net
          APEXLOAD_CONTROLLER_WORKLOAD_IDENTITY_CLIENT_ID: 00000000-0000-0000-0000-000000000001
          APEXLOAD_GENERATOR_WORKLOAD_IDENTITY_CLIENT_ID: 00000000-0000-0000-0000-000000000002
          APEXLOAD_IMAGE_TAG: ci
        run: |
          set -euo pipefail
          scripts/render-aks-manifests.sh --output /tmp/apexload-aks-rendered.yaml
          kubeconform -strict -ignore-missing-schemas /tmp/apexload-aks-rendered.yaml

      - name: Helm validate
        run: |
          set -euo pipefail
          helm lint deployments/helm/apexload \
            --set workloadIdentity.controllerClientId=00000000-0000-0000-0000-000000000001 \
            --set workloadIdentity.generatorClientId=00000000-0000-0000-0000-000000000002 \
            --set image.registry=ci.azurecr.io \
            --set dataPlatform.azureStorageAccount=ciapexloadstorage \
            --set dataPlatform.keyVaultUrl=https://ci-apexload.vault.azure.net \
            --set ingress.host=apexload-ci.example.internal
          helm template apexload deployments/helm/apexload \
            --namespace apexload \
            --set workloadIdentity.controllerClientId=00000000-0000-0000-0000-000000000001 \
            --set workloadIdentity.generatorClientId=00000000-0000-0000-0000-000000000002 \
            --set image.registry=ci.azurecr.io \
            --set dataPlatform.azureStorageAccount=ciapexloadstorage \
            --set dataPlatform.keyVaultUrl=https://ci-apexload.vault.azure.net \
            --set ingress.host=apexload-ci.example.internal \
            > /tmp/apexload-helm.yaml
          kubeconform -strict -ignore-missing-schemas /tmp/apexload-helm.yaml
          # Fail closed if any values.yaml placeholder leaks into a rendered
          # manifest (mirrors the CHANGE-ME guard in render-aks-manifests.sh): a
          # rendered changeme/CHANGE-ME means a required value lacks an override.
          if grep -Ein 'changeme|change-me' /tmp/apexload-helm.yaml; then
            echo "::error::Rendered Helm manifest still contains placeholder values; supply the required --set overrides." >&2
            exit 1
          fi
