name: Platform-compatible release input download
description: Downloads the exact ten release input artifacts on GitHub.com or GHES.
inputs:
  path:
    description: Destination directory.
    required: true
runs:
  using: composite
  steps:
    - name: Download core assets on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-core-assets
        path: ${{ inputs.path }}/release-core-assets
    - name: Download linux-amd64 client on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-client-linux-amd64
        path: ${{ inputs.path }}/release-client-linux-amd64
    - name: Download linux-arm64 client on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-client-linux-arm64
        path: ${{ inputs.path }}/release-client-linux-arm64
    - name: Download macos-amd64 client on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-client-macos-amd64
        path: ${{ inputs.path }}/release-client-macos-amd64
    - name: Download macos-arm64 client on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-client-macos-arm64
        path: ${{ inputs.path }}/release-client-macos-arm64
    - name: Download windows-amd64 client on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-client-windows-amd64
        path: ${{ inputs.path }}/release-client-windows-amd64
    - name: Download controller-standard image evidence on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-image-controller-standard
        path: ${{ inputs.path }}/release-image-controller-standard
    - name: Download controller-enterprise image evidence on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-image-controller-enterprise
        path: ${{ inputs.path }}/release-image-controller-enterprise
    - name: Download generator-standard image evidence on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-image-generator-standard
        path: ${{ inputs.path }}/release-image-generator-standard
    - name: Download generator-enterprise image evidence on GitHub.com
      if: github.server_url == 'https://github.com'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-image-generator-enterprise
        path: ${{ inputs.path }}/release-image-generator-enterprise
    - name: Download core assets on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-core-assets
        path: ${{ inputs.path }}/release-core-assets
    - name: Download linux-amd64 client on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-client-linux-amd64
        path: ${{ inputs.path }}/release-client-linux-amd64
    - name: Download linux-arm64 client on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-client-linux-arm64
        path: ${{ inputs.path }}/release-client-linux-arm64
    - name: Download macos-amd64 client on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-client-macos-amd64
        path: ${{ inputs.path }}/release-client-macos-amd64
    - name: Download macos-arm64 client on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-client-macos-arm64
        path: ${{ inputs.path }}/release-client-macos-arm64
    - name: Download windows-amd64 client on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-client-windows-amd64
        path: ${{ inputs.path }}/release-client-windows-amd64
    - name: Download controller-standard image evidence on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-image-controller-standard
        path: ${{ inputs.path }}/release-image-controller-standard
    - name: Download controller-enterprise image evidence on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-image-controller-enterprise
        path: ${{ inputs.path }}/release-image-controller-enterprise
    - name: Download generator-standard image evidence on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-image-generator-standard
        path: ${{ inputs.path }}/release-image-generator-standard
    - name: Download generator-enterprise image evidence on GHES
      if: github.server_url != 'https://github.com'
      uses: actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55 # v3-node20
      with:
        name: release-image-generator-enterprise
        path: ${{ inputs.path }}/release-image-generator-enterprise
