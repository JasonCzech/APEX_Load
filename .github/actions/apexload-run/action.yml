name: APEX Load SLA Gate
description: Build and run apexctl with optional SLA guardrails for CI/CD pipelines.

inputs:
  script:
    description: Path to the APEX Load DSL script in the checked-out repository.
    required: true
  vusers:
    description: Number of virtual users.
    required: false
    default: "10"
  duration:
    description: Test duration.
    required: false
    default: "1m"
  ramp-up:
    description: Ramp-up duration.
    required: false
    default: "0s"
  api-url:
    description: Optional controller base URL for API-backed execution.
    required: false
    default: ""
  base-url:
    description: Optional base URL override for the DSL script.
    required: false
    default: ""
  env:
    description: Optional newline-delimited KEY=value runtime overrides.
    required: false
    default: ""
  p95-latency-ms:
    description: Optional P95 latency guardrail.
    required: false
    default: ""
  max-error-pct:
    description: Optional max error percentage guardrail.
    required: false
    default: ""
  max-avg-server-processing-ms:
    description: Optional average server processing guardrail.
    required: false
    default: ""
  max-avg-transfer-ms:
    description: Optional average transfer guardrail.
    required: false
    default: ""
  max-error-count:
    description: Optional max error count guardrail.
    required: false
    default: ""
  publish-check:
    description: Publish the APEX Load result as a GitHub Check Run through the controller GitHub App integration.
    required: false
    default: "false"
  github-script-id:
    description: Optional APEX Load script id to link the check run to a synced GitHub script.
    required: false
    default: ""
  github-owner:
    description: Optional repository owner for check-run publishing; defaults to GITHUB_REPOSITORY owner.
    required: false
    default: ""
  github-repo:
    description: Optional repository name for check-run publishing; defaults to GITHUB_REPOSITORY name.
    required: false
    default: ""
  github-commit-sha:
    description: Optional commit SHA for check-run publishing; defaults to GITHUB_SHA.
    required: false
    default: ""
  check-details-url:
    description: Optional check-run details URL; defaults to the controller run report endpoint when api-url is set.
    required: false
    default: ""
  evidence-artifact-name:
    description: Name for the uploaded APEX Load CI evidence artifact. Leave blank to skip upload.
    required: false
    default: apexload-evidence

outputs:
  json:
    description: JSON result returned by apexctl.
    value: ${{ steps.apexload.outputs.json }}
  test-id:
    description: Controller test id for API-backed runs.
    value: ${{ steps.apexload.outputs.test-id }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run apexctl
      id: apexload
      shell: bash
      run: |
        set -euo pipefail

        cmd=(go run ./cmd/apexctl run \
          --script "${{ inputs.script }}" \
          --vusers "${{ inputs.vusers }}" \
          --duration "${{ inputs.duration }}" \
          --ramp-up "${{ inputs.ramp-up }}" \
          --format json)

        if [[ -n "${{ inputs.api-url }}" ]]; then
          cmd+=(--api "${{ inputs.api-url }}")
        fi
        if [[ -n "${{ inputs.base-url }}" ]]; then
          cmd+=(--base-url "${{ inputs.base-url }}")
        fi
        if [[ -n "${{ inputs.p95-latency-ms }}" ]]; then
          cmd+=(--p95-latency-ms "${{ inputs.p95-latency-ms }}")
        fi
        if [[ -n "${{ inputs.max-error-pct }}" ]]; then
          cmd+=(--max-error-pct "${{ inputs.max-error-pct }}")
        fi
        if [[ -n "${{ inputs.max-avg-server-processing-ms }}" ]]; then
          cmd+=(--max-avg-server-processing-ms "${{ inputs.max-avg-server-processing-ms }}")
        fi
        if [[ -n "${{ inputs.max-avg-transfer-ms }}" ]]; then
          cmd+=(--max-avg-transfer-ms "${{ inputs.max-avg-transfer-ms }}")
        fi
        if [[ -n "${{ inputs.max-error-count }}" ]]; then
          cmd+=(--max-error-count "${{ inputs.max-error-count }}")
        fi

        while IFS= read -r entry; do
          [[ -z "$entry" ]] && continue
          cmd+=(--env "$entry")
        done <<< "${{ inputs.env }}"

        set +e
        result="$(${cmd[@]})"
        status=$?
        set -e
        echo "$result"
        printf '%s\n' "$result" > apexload-result.json

        test_id="$(RESULT_JSON="$result" python3 - <<'PY'
import json, os
try:
    print(json.loads(os.environ.get("RESULT_JSON", "{}")).get("test_id", ""))
except Exception:
    print("")
PY
)"

        {
          echo 'json<<EOF'
          echo "$result"
          echo 'EOF'
          echo "test-id=$test_id"
        } >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Upload APEX Load evidence
      if: always() && inputs.evidence-artifact-name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: apexload-result.json
        if-no-files-found: ignore

    - name: Publish GitHub check run
      if: always() && inputs.publish-check == 'true' && inputs.api-url != '' && steps.apexload.outputs.test-id != ''
      shell: bash
      run: |
        set -euo pipefail
        owner="${{ inputs.github-owner }}"
        repo="${{ inputs.github-repo }}"
        commit_sha="${{ inputs.github-commit-sha }}"
        details_url="${{ inputs.check-details-url }}"
        if [[ -z "$owner" || -z "$repo" ]]; then
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
        fi
        if [[ -z "$commit_sha" ]]; then
          commit_sha="$GITHUB_SHA"
        fi
        if [[ -z "$details_url" ]]; then
          details_url="${{ inputs.api-url }}/api/v1/tests/${{ steps.apexload.outputs.test-id }}/report"
        fi
        cmd=(go run ./cmd/apexctl github check-run \
          --api "${{ inputs.api-url }}" \
          --test "${{ steps.apexload.outputs.test-id }}" \
          --owner "$owner" \
          --repo "$repo" \
          --commit-sha "$commit_sha" \
          --details-url "$details_url" \
          --format json)
        if [[ -n "${{ inputs.github-script-id }}" ]]; then
          cmd+=(--script "${{ inputs.github-script-id }}")
        fi
        "${cmd[@]}"
