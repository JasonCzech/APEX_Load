name: APEX Load Performance Gate
description: Run a controller-backed APEX Load CI gate with verified evidence and an optional local smoke-test fallback.

inputs:
  execution-mode:
    description: controller (default) or local.
    required: false
    default: controller
  controller-url:
    description: HTTPS controller base URL; required in controller mode.
    required: false
    default: ""
  project-id:
    description: Controller project ID; required in controller mode.
    required: false
    default: ""
  script-path:
    description: Path to a JSON DSL script. Exactly one of script-path or script-id is required.
    required: false
    default: ""
  script-id:
    description: Existing controller script ID. Exactly one of script-path or script-id is required.
    required: false
    default: ""
  release-id:
    description: Optional release correlation ID.
    required: false
    default: ""
  test-name:
    description: Optional display name for the test.
    required: false
    default: ""
  auth-mode:
    description: oidc (default) or api-key. API-key mode reads APEXLOAD_API_KEY from the job environment.
    required: false
    default: oidc
  vusers:
    description: Number of virtual users.
    required: false
    default: "10"
  duration:
    description: Test duration.
    required: false
    default: 1m
  ramp-up:
    description: Ramp-up duration.
    required: false
    default: 0s
  base-url:
    description: Policy-controlled base URL override.
    required: false
    default: ""
  variables-file:
    description: Optional JSON object containing non-secret string overrides.
    required: false
    default: ""
  p95-latency-ms:
    description: Maximum P95 latency in milliseconds.
    required: false
    default: ""
  max-error-pct:
    description: Maximum error percentage.
    required: false
    default: ""
  max-avg-server-processing-ms:
    description: Maximum average server processing time in milliseconds.
    required: false
    default: ""
  max-avg-transfer-ms:
    description: Maximum average transfer time in milliseconds.
    required: false
    default: ""
  max-error-count:
    description: Maximum total error count.
    required: false
    default: ""
  require-sla:
    description: Fail when no SLA thresholds are evaluated.
    required: false
    default: "true"
  require-results:
    description: Fail when the test produces no transactions.
    required: false
    default: "true"
  timeout:
    description: Maximum total time for the CI run.
    required: false
    default: 30m
  wait-analysis:
    description: After the run ends, wait up to this long (for example 5m, at most 10m) for its root-cause analysis so the summary and the root-cause output carry it. Empty does not wait.
    required: false
    default: ""
  abort-on-cancel:
    description: Ask the controller to abort after timeout or workflow cancellation.
    required: false
    default: "true"
  publish-check:
    description: Publish a controller-owned GitHub Check. Empty defaults to true in controller mode and false in local mode.
    required: false
    default: ""
  evidence-directory:
    description: Directory under the workspace or runner temp for JSON and JUnit evidence; symbolic-link traversal is rejected.
    required: false
    default: .apexload
  idempotency-key:
    description: Optional unique key for this gate. Set it when one workflow run executes multiple gates for the same script.
    required: false
    default: ""
  telemetry-inconclusive:
    description: How an inconclusive telemetry acceptance verdict maps under a fail_ci policy (pass or fail). Required by the controller when the project's acceptance policy is fail_ci; there is no default.
    required: false
    default: ""
  apexctl-version:
    description: Exact released apexctl version. Empty uses the version pinned by this action revision.
    required: false
    default: ""
  apexctl-path:
    description: Explicit trusted apexctl executable; skips release download.
    required: false
    default: ""
  release-base-url:
    description: Optional release mirror root ending before /VERSION. Defaults to this action repository's Releases URL.
    required: false
    default: ""
  release-public-key:
    description: PEM public key used to verify SHA256SUMS.sig when the action release does not bundle release-signing-key.pem.
    required: false
    default: ""

outputs:
  outcome:
    description: Stable gate outcome.
    value: ${{ steps.run.outputs.outcome }}
  test-id:
    description: Controller test ID.
    value: ${{ steps.run.outputs.test-id }}
  status:
    description: Controller or local execution status.
    value: ${{ steps.run.outputs.status }}
  sla-evaluated:
    description: Whether SLA thresholds were evaluated.
    value: ${{ steps.run.outputs.sla-evaluated }}
  sla-breached:
    description: Whether any SLA threshold was breached.
    value: ${{ steps.run.outputs.sla-breached }}
  transactions:
    description: Total transactions.
    value: ${{ steps.run.outputs.transactions }}
  errors:
    description: Total errors.
    value: ${{ steps.run.outputs.errors }}
  tps:
    description: Final transactions per second.
    value: ${{ steps.run.outputs.tps }}
  duration-ms:
    description: Run duration in milliseconds.
    value: ${{ steps.run.outputs.duration-ms }}
  report-url:
    description: Human-readable APEX Load report URL.
    value: ${{ steps.run.outputs.report-url }}
  telemetry-verdict:
    description: Telemetry acceptance verdict (pass, fail or inconclusive); empty when no acceptance policy applied.
    value: ${{ steps.run.outputs.telemetry-verdict }}
  validity:
    description: Run validity verdict (valid, suspect, invalid or unknown); empty when the controller reported none.
    value: ${{ steps.run.outputs.validity }}
  root-cause:
    description: The run's root cause in one line (the leading hypothesis, "no cause supported", "insufficient evidence" or the analysis state); empty when the project does not present root cause.
    value: ${{ steps.run.outputs.root-cause }}
  check-url:
    description: Controller-owned GitHub Check URL.
    value: ${{ steps.run.outputs.check-url }}
  json-path:
    description: Absolute JSON evidence path.
    value: ${{ steps.run.outputs.json-path }}
  junit-path:
    description: Absolute JUnit evidence path.
    value: ${{ steps.run.outputs.junit-path }}
  apexctl-version:
    description: Installed apexctl version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Provide the pinned manifest-validation runtime
      if: ${{ inputs.apexctl-path == '' }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.22.0

    - name: Install verified apexctl
      id: install
      continue-on-error: true
      shell: bash
      env:
        APEXLOAD_INPUT_APEXCTL_PATH: ${{ inputs.apexctl-path }}
        APEXLOAD_INPUT_APEXCTL_VERSION: ${{ inputs.apexctl-version }}
        APEXLOAD_INPUT_RELEASE_BASE_URL: ${{ inputs.release-base-url }}
        APEXLOAD_INPUT_RELEASE_PUBLIC_KEY: ${{ inputs.release-public-key }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'

    - name: Run APEX Load performance gate
      id: run
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      env:
        APEXLOAD_APEXCTL_BIN: ${{ steps.install.outputs.path }}
        APEXLOAD_INSTALL_STEP_OUTCOME: ${{ steps.install.outcome }}
        APEXLOAD_INSTALL_FAILURE_OUTCOME: ${{ steps.install.outputs.failure-outcome }}
        APEXLOAD_INPUT_EXECUTION_MODE: ${{ inputs.execution-mode }}
        APEXLOAD_INPUT_CONTROLLER_URL: ${{ inputs.controller-url }}
        APEXLOAD_INPUT_PROJECT_ID: ${{ inputs.project-id }}
        APEXLOAD_INPUT_SCRIPT_PATH: ${{ inputs.script-path }}
        APEXLOAD_INPUT_SCRIPT_ID: ${{ inputs.script-id }}
        APEXLOAD_INPUT_RELEASE_ID: ${{ inputs.release-id }}
        APEXLOAD_INPUT_TEST_NAME: ${{ inputs.test-name }}
        APEXLOAD_INPUT_AUTH_MODE: ${{ inputs.auth-mode }}
        APEXLOAD_INPUT_VUSERS: ${{ inputs.vusers }}
        APEXLOAD_INPUT_DURATION: ${{ inputs.duration }}
        APEXLOAD_INPUT_RAMP_UP: ${{ inputs.ramp-up }}
        APEXLOAD_INPUT_BASE_URL: ${{ inputs.base-url }}
        APEXLOAD_INPUT_VARIABLES_FILE: ${{ inputs.variables-file }}
        APEXLOAD_INPUT_P95_LATENCY_MS: ${{ inputs.p95-latency-ms }}
        APEXLOAD_INPUT_MAX_ERROR_PCT: ${{ inputs.max-error-pct }}
        APEXLOAD_INPUT_MAX_AVG_SERVER_PROCESSING_MS: ${{ inputs.max-avg-server-processing-ms }}
        APEXLOAD_INPUT_MAX_AVG_TRANSFER_MS: ${{ inputs.max-avg-transfer-ms }}
        APEXLOAD_INPUT_MAX_ERROR_COUNT: ${{ inputs.max-error-count }}
        APEXLOAD_INPUT_REQUIRE_SLA: ${{ inputs.require-sla }}
        APEXLOAD_INPUT_REQUIRE_RESULTS: ${{ inputs.require-results }}
        APEXLOAD_INPUT_TIMEOUT: ${{ inputs.timeout }}
        APEXLOAD_INPUT_WAIT_ANALYSIS: ${{ inputs.wait-analysis }}
        APEXLOAD_INPUT_ABORT_ON_CANCEL: ${{ inputs.abort-on-cancel }}
        APEXLOAD_INPUT_PUBLISH_CHECK: ${{ inputs.publish-check }}
        APEXLOAD_INPUT_EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        APEXLOAD_INPUT_IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
        APEXLOAD_INPUT_TELEMETRY_INCONCLUSIVE: ${{ inputs.telemetry-inconclusive }}
        # These values come from GitHub's immutable workflow expression
        # context. apexctl deliberately does not trust the mutable event JSON
        # file for pull-request repository identity.
        APEXLOAD_GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        APEXLOAD_GITHUB_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        APEXLOAD_GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'

    - name: Conclude APEX Load performance gate
      if: ${{ always() }}
      shell: bash
      env:
        APEXLOAD_INSTALL_STEP_OUTCOME: ${{ steps.install.outcome }}
        APEXLOAD_RUN_STEP_OUTCOME: ${{ steps.run.outcome }}
        APEXLOAD_GATE_EXIT_CODE: ${{ steps.run.outputs.action-exit-code }}
      run: '"$GITHUB_ACTION_PATH/conclude.sh"'
