version: "2"

run:
  timeout: 10m

# Policy for this file: only enable linters that pass cleanly on the tree as it
# stands. A gate that is red on arrival gets ignored, and mass-rewriting the
# repository to satisfy a style linter is not worth the churn. When adding a
# linter, run `golangci-lint run ./...` first and drop it if it reports
# pre-existing violations.
#
# nilerr, ineffassign, staticcheck (SA checks) and govet's nilness were enabled
# on 2026-10-17 after their findings were fixed or annotated with a reason.
#
# Evaluated and rejected (violation counts on the tree at the time of writing,
# capped at 50 per linter): mnd 50+, canonicalheader 50+, copyloopvar 50+,
# wastedassign 38, predeclared 28, errchkjson 24, iface 12, recvcheck 10,
# interfacebloat 9, mirror 8, dupword 8, errname 7, fatcontext 6,
# protogetter 4, bodyclose 3, nilnil 3, sqlclosecheck 3, gosmopolitan 3,
# makezero 1, usetesting 1. Several of those
#
# WARNING — the counts above are TRUNCATED and understate the real backlog.
# golangci-lint defaults to max-same-issues=3 and max-issues-per-linter=50, so
# any entry reading "3" may be far larger and every "50+" is simply the cap.
# Measured 2026-08-18 with --max-same-issues=0 --max-issues-per-linter=0:
#   bodyclose 23 (not 3) · sqlclosecheck 41 (not 3)
# Re-measure with those flags before scoping any burn-down from this list.
#
# Note also that a large share are not defects. sqlclosecheck reports "Close
# should use defer" against this repository's deliberate idiom of closing on
# every path AND checking the Close error — which a bare defer discards, so the
# existing code is arguably stronger. bodyclose flags constructed cache-entry
# responses (pkg/protocol/http/http.go) and raw-connection reads whose conn is
# explicitly closed (pkg/recorder/websocket.go). Enabling these is a triage
# project, not a mechanical fix.
# are worth revisiting as standalone cleanups; none belong in a "cheap hygiene"
# gate.
linters:
  default: none
  enable:
    # Correctness — these find bug shapes the compiler and `go vet` miss.
    - govet
    - asasalint # []any spread into a variadic ...any parameter
    - durationcheck # time.Duration multiplied by another Duration
    - reassign # mutating another package's exported package-level vars
    - spancheck # OpenTelemetry spans that are never ended
    - rowserrcheck # database row iteration errors must not silently truncate results
    - nilerr # an error checked as non-nil and then dropped by returning nil
    - ineffassign # a value assigned and never read, often a lost result
    - staticcheck # SA bug checks only; see settings
    # Toolchain hygiene — a malformed directive fails silently and open.
    - gocheckcompilerdirectives # e.g. a typo'd //go:generate / //go:embed
    - nolintlint # malformed or no-longer-needed //nolint directives
    - testableexamples # Example funcs whose output is never asserted
    # Supply-chain hygiene — source that does not read the way it executes.
    - asciicheck # non-ASCII homoglyphs in identifiers
    - bidichk # bidirectional-override "trojan source" characters
    # Readability.
    - exptostd # golang.org/x/exp helpers that are now in the stdlib
    - goprintffuncname
    - misspell
    - unconvert
  settings:
    govet:
      enable:
        - nilness # conditions that are always true or false, and nil dereferences
    staticcheck:
      # Deprecations (SA1019) are tracked separately: each needs a migration,
      # not a cleanup.
      checks:
        - SA*
        - -SA1019
    nolintlint:
      # Every exception names the linter it silences and says why.
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      # Vendored JavaScript packages ship Go sources (for example
      # node_modules/flatted/golang) that are not ours to lint or fix.
      - node_modules
    rules:
      # Unicode transliteration fixtures intentionally contain words such as
      # "AEther" that the English-only spell checker treats as misspellings.
      - linters:
          - misspell
        path: pkg/api/archive_report_pdf_ascii_test.go

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - node_modules
  settings:
    gofmt:
      # Match the repository's documented plain `gofmt` gate.
      simplify: false
